      +'<br><b>顺序要和上面的输入框一一对应</b>：'+label+'。</p>'
      +'<div class="fld"><textarea class="inp" id="pstTa" rows="8" placeholder="在这里粘贴…" style="font-family:ui-monospace,Menlo,monospace;font-size:13px"></textarea></div>'
      +'<div class="rowx"><button class="btn grey sm" id="pstDemo">填入示例</button>'
      +'<button class="btn ghost sm" id="pstFile">选择 CSV 文件</button></div>'
      +'<input type="file" id="pstFileInp" accept=".csv,.txt,.tsv" style="display:none">',
    foot:'<button class="btn grey" style="flex:1" data-close>取消</button><button class="btn" style="flex:1.4" id="pstOk">填入</button>'});
  m.querySelector('#pstDemo').onclick=function(){

      var its=Store.data.examItems[eid]||[];
      m.querySelector('#pstTa').value=stus.map(function(s){
        return its.map(function(it){return Math.round(it.full*(0.6+Math.random()*0.4))}).join('\t');
      }).join('\n');
    } else {
      m.querySelector('#pstTa').value=stus.map(function(s){
        return e.subjects.map(function(sub){return Math.round(Calc.subFull(e,sub)*(0.6+Math.random()*0.4))}).join('\t');
      }).join('\n');
    }
    toast('已填入示例（随机分），可改成真实数据','ok');
  };
  m.querySelector('#pstFile').onclick=function(){m.querySelector('#pstFileInp').click()};
  m.querySelector('#pstFileInp').addEventListener('change',function(){
    var f=this.files[0];if(!f)return;
    readFileText(f,function(t){m.querySelector('#pstTa').value=t;toast('已读取 '+f.name,'ok')});
    this.value='';
  });
  m.querySelector('#pstOk').onclick=function(){
    var grid=parseTable(m.querySelector('#pstTa').value);
    if(!grid.length){toast('没有解析到数据','warn');return}
    var stus=Store.activeStudents();
    var filled=0;
    if(isItem){
      var its=Store.data.examItems[eid]||[];
      Store.data.itemScores[eid]=Store.data.itemScores[eid]||{};
      stus.forEach(function(s,si){
        var row=grid[si];if(!row)return;
        Store.data.itemScores[eid][s.id]=Store.data.itemScores[eid][s.id]||{};
        its.forEach(function(it,ci){
          var v=normNum(row[ci]);
          if(v==null)return;
          Store.data.itemScores[eid][s.id][it.no]=clamp(v,0,it.full);filled++;
        });
        var isc=Store.data.itemScores[eid][s.id],t=0,any=false;
        its.forEach(function(x){var z=isc[x.no];if(z!=null&&z!==''){t+=Number(z);any=true}});
        Store.data.scores[eid]=Store.data.scores[eid]||{};
        Store.data.scores[eid][s.id]=Store.data.scores[eid][s.id]||{};
        if(any)Store.data.scores[eid][s.id][Store.data.meta.mathSubject]=t;
      });
    } else {
      Store.data.scores[eid]=Store.data.scores[eid]||{};
      stus.forEach(function(s,si){
        var row=grid[si];if(!row)return;
        Store.data.scores[eid][s.id]=Store.data.scores[eid][s.id]||{};
        e.subjects.forEach(function(sub,ci){
          var v=normNum(row[ci]);
          if(v==null)return;
          Store.data.scores[eid][s.id][sub]=clamp(v,0,Calc.subFull(e,sub));filled++;
        });
      });
    }
    Store.save();closeSheet(m);App.render();
    toast('已填入 '+filled+' 个分数','ok');
  };
}
function entryFillFull(){

function exSetup(){
  var box=$('#exBox'),eid=UI.examId,e=Store.exam(eid);
  var items=Store.data.examItems[eid]||[];
  var msub=Store.data.meta.mathSubject;
  var lines=items.map(function(it){return [it.no,it.full,it.topic||'',it.desc||''].join(',')}).join('\n');
  var h='';
  h+='<div class="card"><div class="ch"><h3>'+ic('cog',17)+' 基本信息</h3></div>'
    +'<div class="fld"><label>考试名称</label><input class="inp" id="seName" value="'+esc(e.name)+'"></div>'
    +'<div class="rowx"><div class="fld" style="flex:1"><label>考试日期</label><input class="inp" type="date" id="seDate" value="'+esc(e.date||'')+'"></div>'
    +'<div class="fld" style="flex:1"><label>备注</label><input class="inp" id="seNote" value="'+esc(e.note||'')+'"></div></div>'
    +'<div class="fld"><label>包含科目</label><div class="tagpick">'
    +Store.data.meta.subjects.map(function(sub){
      return '<label><input type="checkbox" class="seSub" value="'+esc(sub)+'"'+(e.subjects.indexOf(sub)>=0?' checked':'')+'><span>'+esc(sub)+'</span></label>';
    }).join('')+'</div></div>'
    +'<div class="fld"><label>各科满分</label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'
    +Store.data.meta.subjects.map(function(sub){
      return '<div><div style="font-size:10.5px;color:var(--muted);text-align:center;margin-bottom:3px">'+esc(sub)+'</div>'
        +'<input class="bignum seFull" data-sub="'+esc(sub)+'" type="number" inputmode="numeric" style="font-size:15px;padding:8px 4px" value="'+(e.fullMarks[sub]||Calc.subFull(e,sub))+'"></div>';
    }).join('')+'</div></div>'
    +'<button class="btn block" id="seSave">保存</button></div>';
  h+='<div class="card"><div class="ch"><h3>'+ic('layers',17)+' 题号表</h3><span class="sub">'+esc(msub)+'</span></div>'
    +'<p class="hint lead">登记每题满分和知识板块，才能算出<b>难度 P、区分度 D</b> 和<b>板块掌握度</b>。'
    +'<br>每行格式：<code>题号,满分,知识板块,说明</code>（直接从 Excel 粘四列也行）</p>'
    +'<textarea class="inp" id="seItems" rows="8" style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px" placeholder="1,10,有理数,选择题">'+esc(lines)+'</textarea>'
    +'<div id="seItemSum" class="hint"></div>'
    +'<div class="rowx" style="margin-top:10px">'
    +'<button class="btn grey sm" id="seItemsGen">按板块生成</button>'
    +'<button class="btn sm" id="seItemsSave">保存题号表</button></div></div>';
  h+='<div class="card"><div class="ch"><h3>'+ic('trash',17)+' 危险操作</h3></div>'
    +'<button class="btn rose block" id="seDel">删除这场考试</button>'
    +'<div class="hint">会同时删除它的成绩、题号表和题号得分，无法恢复。</div></div>';
  box.innerHTML='<div class="page">'+h+'</div>';
  renderItemSum();
  $('#seItems').addEventListener('input',debounce(renderItemSum,280));
  $('#seSave').onclick=function(){
    e.name=$('#seName').value.trim()||e.name;
    e.date=$('#seDate').value||e.date;
    e.note=$('#seNote').value.trim();
    var subs=$$('.seSub:checked').map(function(x){return x.value});
    if(!subs.length){toast('至少选一门科目','warn');return}
    e.subjects=subs;
    $$('.seFull').forEach(function(inp){
      var sub=inp.getAttribute('data-sub'),v=normNum(inp.value);
      if(v!=null&&v>0)e.fullMarks[sub]=v;
    });
    Store.log('修改考试',e.name);Store.save();App.render();toast('已保存','ok');
  };
  $('#seItemsGen').onclick=function(){
    var topics=Store.data.meta.topics;
    if(!topics.length){toast('「我的 → 知识板块」里还没有板块','warn');return}
    var mf=Store.data.meta.fullMarks[msub]||120;
    var n=Math.min(topics.length,6),per=Math.floor(mf/n/2)*2,out=[];
    for(var i=0;i<n;i++)out.push((i+1)+','+per+','+topics[i]+',');
    var rest=mf-per*n;
    if(rest>0)out.push((n+1)+','+rest+',综合应用,压轴题');
    $('#seItems').value=out.join('\n');renderItemSum();toast('已生成，可自行调整','ok');
  };
  $('#seItemsSave').onclick=function(){
    var items2=parseItems($('#seItems').value);
    Store.data.examItems[eid]=items2;
    items2.forEach(function(it){
      if(it.topic&&it.topic!=='未分类'&&Store.data.meta.topics.indexOf(it.topic)<0)Store.data.meta.topics.push(it.topic);
    });
    Store.log('保存题号表',e.name+'：'+items2.length+' 题');
    Store.save();toast('题号表已保存（'+items2.length+' 题）','ok');renderItemSum();
  };
  $('#seDel').onclick=function(){
    confirmSheet('删除考试「'+esc(e.name)+'」及其全部成绩？',function(){
      Store.data.exams=Store.data.exams.filter(function(x){return x.id!==e.id});
      delete Store.data.scores[e.id];delete Store.data.itemScores[e.id];delete Store.data.examItems[e.id];
      Store.log('删除考试',e.name);
      Store.save();UI.examId=null;UI.examId=ensureExam();App.render();toast('已删除','ok');
    },'删除',true);
  };
}
function parseItems(text){
  var grid=parseTable(text),out=[];
  grid.forEach(function(r){
    var no=normNum(r[0]),full=normNum(r[1]);
    if(no==null||full==null)return;
    out.push({no:no,full:full,topic:String(r[2]||'').trim()||'未分类',desc:String(r[3]||'').trim()});
  });
  out.sort(function(a,b){return a.no-b.no});
  return out;
}
function renderItemSum(){
  var ta=$('#seItems');if(!ta)return;
  var el=$('#seItemSum');if(!el)return;
  var items=parseItems(ta.value);
  var s=sum(items.map(function(x){return x.full}));
  var mf=Store.data.meta.fullMarks[Store.data.meta.mathSubject]||120;
  el.innerHTML='共 '+items.length+' 题，合计 <b>'+s+'</b> / '+mf+' 分 '
    +(s===mf?'<span class="bg teal">与满分一致 ✓</span>':(s>mf?'<span class="bg rose">超出满分</span>':'<span class="bg amber">还差 '+(mf-s)+' 分</span>'));
}

function examNew(){
  var msub=Store.data.meta.subjects;
  var m=sheet({title:'新建考试',
    body:'<div class="fld"><label>考试名称</label><input class="inp" id="neName" placeholder="如：第一次月考" autocomplete="off"></div>'

      +'</div></div>'
      +'<p class="hint">创建后可以到「设置」登记题号表，再按题号录数学成绩，自动算出难度与区分度。</p>',
    foot:'<button class="btn grey" style="flex:1" data-close>取消</button><button class="btn" style="flex:1.3" id="neOk">创建</button>'});
  setTimeout(function(){m.querySelector('#neName').focus()},300);
  m.querySelector('#neOk').onclick=function(){
    var name=m.querySelector('#neName').value.trim();
    if(!name){toast('请填写考试名称','warn');return}
    var subs=$$('.neSub:checked',m).map(function(x){return x.value});
    if(!subs.length){toast('至少选一门科目','warn');return}
    var e={id:uid('E'),name:name,date:m.querySelector('#neDate').value||todayStr(),kind:'full',
      subjects:subs,fullMarks:JSON.parse(JSON.stringify(Store.data.meta.fullMarks)),note:''};
    Store.data.exams.push(e);
    Store.data.scores[e.id]={};Store.data.itemScores[e.id]={};Store.data.examItems[e.id]=[];
    Store.log('新建考试',name);
    Store.save();closeSheet(m);
    UI.examId=e.id;UI.tab='exams';UI.exSeg='entry';
    if(location.hash!=='#/exams')location.hash='#/exams';
    App.render();window.scrollTo(0,0);
    toast('已创建，去录入或导入成绩','ok');
  };
}

/* ---------------- 板块热力图 ---------------- */
function teTopic(){
  var box=$('#teBox'),eid=UI.examId,ts=Calc.topicStat(eid);
  if(!ts){box.innerHTML=emptyBox('🧩','没有题号表','去登记');bindEmptyBtn(function(){UI.tab='exams';UI.exSeg='setup';App.render()});return}
  var h='';
  h+='<div class="card"><div class="ch"><h3>'+ic('layers',17)+' 板块掌握度</h3><span class="sub">数字=该生该板块得分率%</span>'
    +'<span class="more" id="tpExport">导出</span></div>'
    +'<div class="heat-wrap"><table class="heat"><thead><tr><th class="nm">姓名</th>'
    +ts.list.map(function(t){return '<th class="top" title="'+esc(t.topic)+'（满分'+t.full+'）">'+esc(t.topic).slice(0,4)+'</th>'}).join('')
    +'<th class="top">总</th></tr></thead><tbody>';
  var rows=Store.activeStudents().map(function(s){
    var r=ts.stuRate[s.id]||{};
    var vals=ts.list.map(function(t){return r[t.topic]});
    var valid=vals.filter(function(v){return v!=null});
    return {s:s,vals:vals,avg:valid.length?mean(valid):null};
  }).sort(function(a,b){return (b.avg==null?-1:b.avg)-(a.avg==null?-1:a.avg)});
  rows.forEach(function(r){
    h+='<tr><td class="nm">'+esc(r.s.name)+'</td>';
    r.vals.forEach(function(v){
      h+='<td style="background:'+heatColor(v,.9)+';color:'+heatText(v)+'" '+(v!=null?('data-stu="'+r.s.id+'" data-topic="'+esc(r.vals.indexOf(v))+'"'):'')+'>'+(v==null?'':Math.round(v))+'</td>';
    });
    h+='<td style="background:'+heatColor(r.avg,.95)+';color:'+heatText(r.avg)+';font-weight:800">'+(r.avg==null?'':Math.round(r.avg))+'</td></tr>';
  });
  h+='<tr><td class="nm" style="border-top:2px solid var(--pri)">班均</td>';
  ts.list.forEach(function(t){
    h+='<td class="avg" style="background:'+heatColor(t.pct)+';color:'+heatText(t.pct)+'">'+Math.round(t.pct)+'</td>';
  });
  var avgs=rows.filter(function(r){return r.avg!=null}).map(function(r){return r.avg});
  var ca=avgs.length?mean(avgs):null;
  h+='<td class="avg" style="background:'+heatColor(ca)+';color:'+heatText(ca)+'">'+(ca==null?'':Math.round(ca))+'</td></tr>';
  h+='</tbody></table></div>'+heatLegendHTML()
    +'<div class="hint">左右滑动看全部板块。颜色越绿掌握越好，越红越需要讲评。</div></div>';

  h+='<div class="card"><div class="ch"><h3>'+ic('alert',17)+' 最需讲评</h3><span class="sub">按得分率升序</span></div>';
  ts.list.slice(0,6).forEach(function(t){
    var lv=t.pct>=80?'已掌握':(t.pct>=65?'基本达标':(t.pct>=50?'薄弱':'严重薄弱'));
    var tone=t.pct>=80?'teal':(t.pct>=65?'grey':(t.pct>=50?'amber':'rose'));
    h+='<div class="li"><div class="bd"><b>'+esc(t.topic)+'</b><span>满分 '+t.full+' · 学生间差异 σ'+fmtV(t.sd*100)+'</span></div>'
      +'<div class="rt"><b style="color:'+heatColor(t.pct)+'">'+fmtV(t.pct)+'%</b><span class="bg '+tone+'">'+lv+'</span></div></div>';
  });
  h+='</div>';

  var weakPer=[];
  rows.forEach(function(r){
    ts.list.forEach(function(t,i){
      var v=r.vals[i];
      if(v!=null&&v<60)weakPer.push({name:r.s.name,sid:r.s.id,topic:t.topic,v:v});
    });
  });
  weakPer.sort(function(a,b){return a.v-b.v});
  h+='<div class="card"><div class="ch"><h3>'+ic('user',17)+' 个体短板</h3><span class="sub">得分率 &lt; 60%</span></div>';
  if(!weakPer.length)h+='<p class="hint" style="margin:0">没有学生单板块得分率低于 60%。</p>';
  else{
    weakPer.slice(0,20).forEach(function(w){
      h+='<div class="li tap" data-sid="'+w.sid+'"><div class="bd"><b>'+esc(w.name)+'</b><span>'+esc(w.topic)+'</span></div>'
        +'<div class="rt"><b style="color:'+heatColor(w.v)+'">'+fmtV(w.v)+'%</b></div></div>';
    });
    if(weakPer.length>20)h+='<div class="hint">共 '+weakPer.length+' 条，显示最弱的 20 条</div>';
  }
  h+='</div>';
  box.innerHTML='<div class="page">'+h+'</div>';
  $$('#teBox .li[data-sid]').forEach(function(el){el.onclick=function(){openStudent(el.getAttribute('data-sid'))}});
  var ex=$('#tpExport');if(ex)ex.onclick=exportTopicCsv;
}

    +'<div class="stat"><div class="k">平均用时</div><div class="v">'+(tValid.length?fmtV(mean(tValid)):'—')+'<small>秒</small></div><div class="d">'+(ss[0].total||10)+' 题</div></div>'

  if(Object.keys(by).length){
    h+='<div class="card"><div class="ch"><h3>'+ic('layers',17)+' 错式类型分布</h3></div><div class="chart"><canvas id="ccErr"></canvas></div></div>';
  }
  h+='<div class="card"><div class="ch"><h3>'+ic('doc',17)+' 记录</h3></div>';

    var acc=x.total?(x.total-x.wrong)/x.total*100:0;
    h+='<div class="li"><div class="bd"><b>'+esc(x.date||'')+'</b>'
      +'<span>'+x.total+' 题错 '+x.wrong+'　'+(x.seconds==null?'':(x.seconds+' 秒'))+((x.types||[]).length?('　'+esc(x.types.join('、'))):'')+'</span></div>'
      +'<div class="rt"><b style="color:'+heatColor(acc)+'">'+fmtV(acc)+'%</b>'
      +'<span><button class="btn xs grey" data-del="'+x.id+'">删</button></span></div></div>';
  });
  h+='</div>';
  box.innerHTML='<div class="page">'+h+'</div>';

  $('#ccTimer').onclick=calcTimerSheet;

    el.onclick=function(){
      var id=el.getAttribute('data-del');
      confirmSheet('删除这条训练记录？',function(){
        Store.data.compute=(Store.data.compute||[]).filter(function(x){return x.id!==id});
        Store.save();App.render();
      },'删除',true);
    };
  });
  var cv=$('#ccChart');
  if(cv){
    Chart.line(cv,ss.map(function(x){return String(x.date||'').slice(5)}),

var CALC_TYPES=['符号错误','去括号','通分/约分','移项变号','合并同类项','公式记错','运算顺序','小数分数互化'];
function computeAdd(){
  var m=sheet({title:'记录计算训练',
    body:'<div class="rowx"><div class="fld" style="flex:1.4"><label>日期</label><input class="inp" type="date" id="cpD" value="'+todayStr()+'"></div>'
      +'<div class="fld" style="flex:1"><label>题数</label><input class="inp" type="number" inputmode="numeric" id="cpT" value="10"></div>'
      +'<div class="fld" style="flex:1"><label>错题数</label><input class="inp" type="number" inputmode="numeric" id="cpW" value="0"></div></div>'
      +'<div class="fld"><label>用时（秒，可空）</label><input class="inp" type="number" inputmode="numeric" id="cpS" placeholder="如 240"></div>'
      +'<div class="fld"><label>错式类型（可多选）</label><div class="tagpick rose">'
      +CALC_TYPES.map(function(t){return '<label><input type="checkbox" class="cpT" value="'+esc(t)+'"><span>'+esc(t)+'</span></label>'}).join('')
      +'</div></div>'
      +'<div class="fld"><label>备注</label><textarea class="inp" id="cpN" rows="2" placeholder="如：整体比上周快 40 秒"></textarea></div>',
    foot:'<button class="btn grey" style="flex:1" data-close>取消</button><button class="btn" style="flex:1.3" id="cpOk">保存</button>'});
  m.querySelector('#cpOk').onclick=function(){
    var total=normNum(m.querySelector('#cpT').value)||10;
    var wrong=normNum(m.querySelector('#cpW').value)||0;
    Store.data.compute=Store.data.compute||[];
    Store.data.compute.push({id:uid('C'),date:m.querySelector('#cpD').value||todayStr(),
      total:total,wrong:clamp(wrong,0,total),seconds:normNum(m.querySelector('#cpS').value),
      types:$$('.cpT:checked',m).map(function(x){return x.value}),
      note:m.querySelector('#cpN').value.trim()});
    Store.log('计算训练',total+' 题错 '+wrong);
    Store.save();closeSheet(m);App.render();toast('已记录','ok');
  };
}
function calcTimerSheet(){
  var m=sheet({title:'⏱ 计算训练计时器',
    body:'<div style="text-align:center;padding:8px 0 4px">'
      +'<div id="ctD" style="font-size:60px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--pri);letter-spacing:-2px;line-height:1.1">0:00</div>'
      +'<div class="hint" style="margin-top:2px">建议：10 道计算题，目标 5 分钟内全对</div>'
      +'<div class="rowx" style="margin-top:16px"><button class="btn grey" id="ctR">↺ 重置</button><button class="btn" id="ctS" style="flex:1.6">▶ 开始</button></div>'
      +'</div>',
    foot:false});
  var t0=null,iv=null,run=false;
  function paint(){
    var s=t0?Math.floor((Date.now()-t0)/1000):0;
    m.querySelector('#ctD').textContent=Math.floor(s/60)+':'+pad2(s%60);
  }
  m.querySelector('#ctS').onclick=function(){
    var b=this;
    if(run){clearInterval(iv);run=false;b.textContent='▶ 继续'}
    else{if(!t0)t0=Date.now();run=true;b.textContent='⏸ 暂停';iv=setInterval(paint,180)}
  };
  m.querySelector('#ctR').onclick=function(){
    clearInterval(iv);run=false;t0=null;paint();m.querySelector('#ctS').textContent='▶ 开始';
  };
  paint();
}

function wrPoints(){
  var box=$('#wrBox');
  var d=Store.data;
  var byStu={};
  Store.activeStudents().forEach(function(s){byStu[s.id]={s:s,v:0,pos:0,neg:0,n:0}});
  d.points.forEach(function(p){
    var o=byStu[p.studentId];if(!o)return;
    o.v+=p.delta;if(p.delta>0)o.pos+=p.delta;else o.neg+=p.delta;o.n++;
  });
  var rows=Object.keys(byStu).map(function(k){return byStu[k]}).sort(function(a,b){return b.v-a.v});
  var abs={};
  Store.activeStudents().forEach(function(s){abs[s.id]=0});
  d.attendance.forEach(function(a){if(abs[a.studentId]!=null)abs[a.studentId]++});
  var h='<div class="card tight"><div style="display:flex;align-items:center;gap:9px">'
    +'<b style="font-size:15px">积分与考勤</b>'
    +'<button class="btn xs" style="margin-left:auto" id="ptBulk">批量加减分</button>'
    +'<button class="btn xs ghost" id="abAdd">记考勤</button></div>'
    +'<div class="hint" style="margin-top:8px">积分用于「重点关注」的综合判断。<b>不要用来在班级或家长群公示排名。</b></div></div>';
  h+='<div class="card"><div class="ch"><h3>'+ic('star',17)+' 积分榜</h3><span class="sub">'+d.points.length+' 条流水</span></div>';
  if(!d.points.length)h+='<p class="hint" style="margin:0">还没有积分记录。</p>';
  else{
    var rk=0,pv=null,cnt=0;
    rows.forEach(function(r){
      cnt++;if(pv===null||r.v!==pv){rk=cnt;pv=r.v}
      h+='<div class="li tap" data-sid="'+r.s.id+'">'
        +'<div class="rankno'+(rk<=3?' t'+rk:'')+'">'+rk+'</div>'
        +'<div class="bd"><b>'+esc(r.s.name)+'</b><span>加 '+r.pos+' · 扣 '+r.neg+' · '+r.n+' 条</span></div>'
        +'<div class="rt"><b class="'+(r.v<0?'v-pos':'v-neg')+'">'+r.v+'</b>'
        +'<span><button class="btn xs grey" data-pt="'+r.s.id+'">±</button></span></div></div>';
    });
  }
  h+='</div>';
  h+='<div class="card"><div class="ch"><h3>'+ic('calendar',17)+' 缺勤统计</h3><span class="more" id="abList">全部记录</span></div>';
  var ranked=Store.activeStudents().map(function(s){return {s:s,n:abs[s.id]}}).filter(function(x){return x.n})
    .sort(function(a,b){return b.n-a.n});
  if(!ranked.length)h+='<p class="hint" style="margin:0">还没有考勤记录。</p>';
  else{
    var byType={};
    d.attendance.forEach(function(a){byType[a.type]=(byType[a.type]||0)+1});
    h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">'
      +Object.keys(byType).map(function(t){return '<span class="bg grey">'+esc(t)+' '+byType[t]+'</span>'}).join('')+'</div>';
    ranked.slice(0,10).forEach(function(x){
      h+='<div class="li tap" data-sid="'+x.s.id+'"><div class="av '+(x.n>=3?'r':'a')+'">'+x.n+'</div>'
        +'<div class="bd"><b>'+esc(x.s.name)+'</b><span>缺勤 '+x.n+' 次</span></div>'+ic('right',16)+'</div>';
    });
  }
  h+='</div>';
  box.innerHTML='<div class="page">'+h+'</div>';
  $('#ptBulk').onclick=pointBulk;
  $('#abAdd').onclick=function(){pickStudent(function(s){absenceAdd(s.id)})};

  });

    h+=emptyBox('📋','还没有作业记录。','＋ 新建作业');
    box.innerHTML='<div class="page">'+h+'</div>';
    $('#emBtn').onclick=hwAdd;$('#hwAdd').onclick=hwAdd;
    return;
  }
  var n=Store.activeStudents().length||1;
  h+='<div class="card">';
  list.forEach(function(hw){
    var st=Store.data.hwStatus[hw.id]||{};
    var done=0,exc=0,miss=0;
    Store.activeStudents().forEach(function(s){
      var v=st[s.id];
      if(v===1||v===2)done++;
      if(v===2)exc++;
      if(v===0)miss++;
    });
    var rate=Math.round(done/n*100);
    h+='<div class="li tap" data-hw="'+hw.id+'">'
      +'<div class="bd"><b>'+esc(hw.title)+'</b>'
      +'<span>'+esc(hw.subject)+' · '+esc(String(hw.assigned||'').slice(5))+' 布置'+(miss?(' · 缺交 '+miss+' 人'):' · 全部交齐')+'</span>'
      +'<div class="bar sm" style="margin-top:6px"><i style="width:'+rate+'%;background:'+heatColor(rate)+'"></i></div></div>'
      +'<div class="rt"><b>'+rate+'%</b><span>优秀 '+exc+'</span></div></div>';
  });
  h+='</div>';
  var missBy={};
  Store.activeStudents().forEach(function(s){missBy[s.id]=0});
  list.forEach(function(hw){
    var st=Store.data.hwStatus[hw.id]||{};
    Store.activeStudents().forEach(function(s){if(st[s.id]===0)missBy[s.id]++});
  });
  var ranked=Store.activeStudents().map(function(s){return {s:s,n:missBy[s.id]}}).filter(function(x){return x.n})
    .sort(function(a,b){return b.n-a.n});
  if(ranked.length){
    h+='<div class="card"><div class="ch"><h3>'+ic('alert',17)+' 缺交排行</h3></div>'
      +ranked.slice(0,12).map(function(x){
        return '<div class="li tap" data-sid="'+x.s.id+'"><div class="av '+(x.n>=3?'r':'a')+'">'+x.n+'</div>'
          +'<div class="bd"><b>'+esc(x.s.name)+'</b><span>缺交 '+x.n+' 次</span></div>'+ic('right',16)+'</div>';
      }).join('')+'</div>';
  }
  box.innerHTML='<div class="page">'+h+'</div>';
  $('#hwAdd').onclick=hwAdd;
  var he=$('#hwExport');if(he)he.onclick=exportHomeworkCsv;
  $$('#wrBox [data-hw]').forEach(function(el){el.onclick=function(){hwMark(el.getAttribute('data-hw'))}});
  $$('#wrBox .li[data-sid]').forEach(function(el){el.onclick=function(){openStudent(el.getAttribute('data-sid'))}});
}
function hwAdd(){
  var m=sheet({title:'新建作业',
    body:'<div class="rowx"><div class="fld" style="flex:1.2"><label>学科</label><select class="inp" id="hwSub">'
      +Store.data.meta.subjects.map(function(s){return '<option'+(s===Store.data.meta.mathSubject?' selected':'')+'>'+esc(s)+'</option>'}).join('')
      +'</select></div>'
      +'<div class="fld" style="flex:1.3"><label>布置日期</label><input class="inp" type="date" id="hwA" value="'+todayStr()+'"></div></div>'
      +'<div class="fld"><label>作业内容</label><input class="inp" id="hwTitle" placeholder="如：课本 P42 习题 1-6"></div>'
      +'<div class="fld"><label>截止日期</label><input class="inp" type="date" id="hwD" value="'+todayStr()+'"></div>',
    foot:'<button class="btn grey" style="flex:1" data-close>取消</button><button class="btn" style="flex:1.3" id="hwOk">创建并登记</button>'});
  m.querySelector('#hwOk').onclick=function(){

    if(!title){toast('请填写作业内容','warn');return}
    var hw={id:uid('HW'),subject:m.querySelector('#hwSub').value,title:title,
      assigned:m.querySelector('#hwA').value||todayStr(),due:m.querySelector('#hwD').value||todayStr(),note:''};
    Store.data.homework.push(hw);Store.data.hwStatus[hw.id]={};
    /* 默认全部标记已交，只需点出缺交和优秀的 */
    Store.activeStudents().forEach(function(s){Store.data.hwStatus[hw.id][s.id]=1});
    Store.log('新建作业',hw.subject+' '+title);
    Store.save();closeSheet(m);App.render();
    toast('默认已全部标记为已交，点出缺交和优秀的即可','ok');
    hwMark(hw.id);
  };
}
function hwMark(id){
  var hw=null;Store.data.homework.forEach(function(x){if(x.id===id)hw=x});
  if(!hw)return;
  var m=sheet({title:'作业登记 · '+esc(hw.title),full:true,
    body:'<p class="hint lead">点一下循环切换：<b>已交 → 优秀 → 缺交</b>。默认全部已交，只需点出缺交和优秀的。</p>'
      +'<button class="btn grey block sm" id="hwAllIn" style="margin-bottom:12px">全部标记已交</button>'
      +'<div id="hwMarkBox"></div>',foot:false});
  function paint(){
    var box=m.querySelector('#hwMarkBox');
    box.innerHTML=Store.activeStudents().map(function(s){
      var v=Store.data.hwStatus[id][s.id];
      var label=v===2?'优秀':(v===1?'已交':'缺交');
      var cls=v===2?'amber':(v===1?'ghost':'rose');
      return '<div class="li"><div class="av">'+s.no+'</div>'
        +'<div class="bd"><b>'+esc(s.name)+'</b></div>'
        +'<button class="btn xs '+cls+'" data-sid="'+s.id+'" style="min-width:62px">'+label+'</button></div>';
    }).join('');
    $$('button[data-sid]',box).forEach(function(b){
      b.onclick=function(){
        var sid=b.getAttribute('data-sid');
        var cur=Store.data.hwStatus[id][sid];
        Store.data.hwStatus[id][sid]=(cur===1?2:(cur===2?0:1));
        haptic();Store.save();paint();
      };
    });
  }
  m.querySelector('#hwAllIn').onclick=function(){
    Store.activeStudents().forEach(function(s){Store.data.hwStatus[id][s.id]=1});
    Store.save();paint();
  };
  paint();
}

      +(s.phone?(' · '+esc(Store.maskPhone(s.phone))):'')+'</span></div>'
      +'<div class="rt">'+(w
        ? ('<b class="v-pos" style="font-size:14px">⚠'+w.score+'</b>'+(tRow?('<span>Z '+fmtV(tRow.z)+'</span>'):'<span></span>'))
        : (tRow?('<b>'+fmtV(tRow.raw)+'</b><span>Z '+fmtV(tRow.z)+'</span>'):''))+'</div></div>';

    var e=$('#miQ');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}},280));

    +(s.phone?('<div class="li" style="padding:4px 0"><div class="bd"><span>家长电话</span><b id="stPhone">'+esc(Store.maskPhone(s.phone))+'</b></div>'

    +(s.tags&&s.tags.length?('<div class="tagpick" style="margin-top:8px;gap:6px">'+s.tags.map(function(t){return '<span class="bg amber">'+esc(t)+'</span>'}).join('')+'</div>'):'')

    +'<span class="sub">'+(prof.delta==null?'':((prof.delta>=0?'↑':'↓')+fmtV(Math.abs(prof.delta))+' 分'))+'</span></div>';
  if(prof.trend.filter(function(x){return x.score!=null}).length){
    h+='<div class="chart"><canvas id="stTrend"></canvas></div>';
    h+='<div class="tagpick" style="margin-top:9px;gap:6px">'+prof.trend.map(function(x){

      return '<span class="bg pri">'+esc(x.name)+' '+fmtV(x.score)+(x.rank?('（'+x.rank+'名）'):'')+'</span>';
    }).join('')+'</div>';
    if(prof.zsd>=0.6)h+='<div class="hint">成绩波动较大（Z 分标准差 '+fmtV(prof.zsd)+'），建议重点抓发挥稳定性。</div>';
  } else h+='<p class="hint" style="margin:0">还没有 '+esc(msub)+' 成绩。</p>';

    +'</div>'
    +'<div class="rowx" style="margin-top:11px"><button class="btn grey sm" id="stPt">± 加减分</button>'

    +'<button class="btn ghost block sm" style="margin-top:9px" id="stSaveCm">保存评语</button></div>';

  var sp=$('#stShowPh');
  if(sp)sp.onclick=function(){

  var am=$('#stAddMk');if(am)am.onclick=function(){mistakeAdd()};

function suggestComment(id){
  var s=Store.stu(id);if(!s)return;
  var prof=Calc.profile(id);
  var el=$('#stCm');if(!el)return;
  var parts=[];
  var mathTxt='数学学习态度端正';
  if(prof.last&&prof.first){
    if(prof.delta>=8)mathTxt='这学期数学进步明显，从 '+fmtV(prof.first.score)+' 分提升到 '+fmtV(prof.last.score)+' 分';
    else if(prof.delta<=-8)mathTxt='数学成绩近期有所回落（'+fmtV(prof.first.score)+'→'+fmtV(prof.last.score)+' 分）';
    else mathTxt='数学成绩保持在 '+fmtV(prof.last.score)+' 分左右，比较稳定';
  }
  parts.push(s.name+'同学：'+mathTxt+'。');
  if(prof.zsd>=0.6)parts.push('成绩起伏较大，建议把注意力放在"稳定发挥"上，先把会做的题做对。');
  if(prof.topErrors.length)parts.push('从错题看，主要问题在「'+prof.topErrors[0].label+'」，建议针对性练习同类题，把错因消灭在平时。');
  if(prof.weakTopics.length)parts.push('知识板块里「'+prof.weakTopics[0].topic+'」还需要加强，可以先用课本例题把基础打牢。');
  if(prof.point>=30)parts.push('常规表现积极，班级事务参与度高，值得肯定。');
  else if(prof.point<0)parts.push('常规方面还需注意纪律与细节，希望你下阶段能对自己的行为多一分要求。');
  if(prof.missHw>=3)parts.push('作业有缺交情况，请按时完成并交给老师检查。');
  if(prof.absence>=3)parts.push('本学期请假次数偏多，希望调整作息、保持出勤。');
  parts.push('老师相信你能做得更好，加油！');
  el.value=parts.join('');
  toast('已生成草稿，请按实际情况修改','ok');
}

function copyText(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){toast('已复制到剪贴板','ok')},function(){fallbackCopy(t)});
    } else fallbackCopy(t);
  }catch(e){fallbackCopy(t)}
}
function fallbackCopy(t){
  var ta=document.createElement('textarea');
  ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制到剪贴板','ok')}catch(e){toast('复制失败，请长按手动复制','warn')}
  ta.remove();
}

function changePinSheet(){
  var m=sheet({title:'修改密码',
    body:'<p class="hint lead">修改后会立即用新密钥重新加密全部数据。</p>'
      +'<div class="fld"><label>当前密码</label><input class="inp" type="password" id="cpOld"></div>'
      +'<div class="fld"><label>新密码（至少 4 位）</label><input class="inp" type="password" id="cpNew"></div>'
      +'<div class="fld"><label>再输一次</label><input class="inp" type="password" id="cpNew2"></div>'
      +'<div class="lkerr" id="cpErr" style="color:var(--rose);min-height:18px;font-size:12.5px"></div>',
    foot:'<button class="btn grey" style="flex:1" data-close>取消</button><button class="btn" style="flex:1.3" id="cpOk">修改</button>'});
  m.querySelector('#cpOk').onclick=function(){
    var oldP=m.querySelector('#cpOld').value,newP=m.querySelector('#cpNew').value,n2=m.querySelector('#cpNew2').value;
    var err=m.querySelector('#cpErr');
    var chk=pinStrength(newP);
    if(!chk.ok){err.textContent=chk.msg;return}
    if(newP!==n2){err.textContent='两次输入不一致';return}
    err.textContent='正在重新加密…';
    Sec.digest(oldP+Sec.pepper).then(function(h){
      return Sec.idbGet(Sec.SALT).then(function(rec){
        if(!rec||(rec.hash&&rec.hash!==h)){err.textContent='当前密码不正确';return Promise.reject('bad')}
        var salt=randomSalt();
        return Sec.init(newP,salt).then(function(){
          return Sec.digest(newP+Sec.pepper);
        }).then(function(h2){
          return Sec.idbSet(Sec.SALT,{salt:salt,hash:h2});
        }).then(function(){
          return Sec.encrypt(Store.data);
        }).then(function(enc){
          return Sec.idbSet(Sec.KEY,enc);
        }).then(function(){
          closeSheet(m);toast('密码已修改','ok');Store.log('修改密码','');
        });
      });
    }).catch(function(e){if(e!=='bad')err.textContent='修改失败：'+(e.message||e)});
  };
}

    m.querySelector('#expErr').textContent='正在加密…';
    var salt=randomSalt(),saved=Sec._key;
    Sec.init(p,salt).then(function(){

      var payload={app:'cls-assistant-mobile',kind:'backup',v:1,salt:salt,created:nowTs(),

      download(name,JSON.stringify(payload),'application/json');

      Store.log('导出加密备份',name);
      closeSheet(m);toast('已导出备份文件','ok');
    }).catch(function(e){
      Sec._key=saved;
      m.querySelector('#expErr').textContent='导出失败：'+(e.message||e);
    });
  };
}
function backupImportSheet(text){
  var payload=null;
  try{payload=JSON.parse(text)}catch(e){toast('文件不是有效的备份','bad');return}
  if(!payload||!payload.rec){toast('文件格式不对','bad');return}
  var m=sheet({title:'导入备份',
    body:'<p class="hint lead">备份来自：<b>'+esc(payload.label||'未知')+'</b><br>导出于 '+fmtTime(payload.created)+'</p>'
      +'<p style="font-size:13.5px;color:var(--rose)">导入会<b>覆盖当前全部数据</b>，请确认。</p>'
      +'<div class="fld"><label>备份密码</label><input class="inp" type="password" id="impP"></div>'
      +'<div class="lkerr" id="impErr" style="color:var(--rose);min-height:18px;font-size:12.5px"></div>',
    foot:'<button class="btn grey" style="flex:1" data-close>取消</button><button class="btn rose" style="flex:1.3" id="impOk">覆盖导入</button>'});
  m.querySelector('#impOk').onclick=function(){
    var p=m.querySelector('#impP').value,saved=Sec._key;
    m.querySelector('#impErr').textContent='正在解密…';
    Sec.init(p,payload.salt).then(function(){
      return Sec.decrypt(payload.rec);
    }).then(function(obj){
      Store.data=Fixer.fix(obj);
      Sec._key=saved;
      return Sec.encrypt(Store.data);
    }).then(function(enc){
      return Sec.idbSet(Sec.KEY,enc);
    }).then(function(){
      Sec._key=saved;
      Store.log('导入备份',payload.label||'');
      closeSheet(m);UI.examId=null;UI.examId=ensureExam();App.render();
      toast('备份已导入','ok');
    }).catch(function(){
      Sec._key=saved;
      m.querySelector('#impErr').textContent='密码错误或文件损坏';
    });
  };
}

var Reports={
  _svgLine:function(labels,vals,o){
    o=o||{};
    var w=680,h=o.h||160,pad={l:34,r:12,t:14,b:22};
    var v2=vals.filter(function(v){return v!=null&&!isNaN(v)});
    if(!v2.length)return '<p style="font-size:11px;color:#8A94A6;margin:4px 0">暂无数据</p>';
    var mn=o.min!=null?o.min:Math.min.apply(null,v2),mx=o.max!=null?o.max:Math.max.apply(null,v2);
    if(mx-mn<1)mx=mn+1;
    var pd=(mx-mn)*.14;mn-=pd;mx+=pd;
    var iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
    var px=function(i){return pad.l+(labels.length<=1?iw/2:iw*i/(labels.length-1))};
    var py=function(v){return pad.t+ih-ih*(v-mn)/(mx-mn)};
    var s='<svg width="100%" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="max-width:100%">';
    for(var g=0;g<=4;g++){
      var y=pad.t+ih-ih*g/4;
      s+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(w-pad.r)+'" y2="'+y+'" stroke="#E8ECF4"/>';
      s+='<text x="'+(pad.l-4)+'" y="'+(y+3)+'" font-size="9" fill="#8A94A6" text-anchor="end">'+fmtV(mn+(mx-mn)*g/4,0)+'</text>';
    }
    var d='',started=false;
    vals.forEach(function(v,i){
      if(v==null||isNaN(v)){started=false;return}
      d+=(started?' L':' M')+px(i).toFixed(1)+' '+py(+v).toFixed(1);started=true;
    });
    s+='<path d="'+d+'" fill="none" stroke="#3B5BDB" stroke-width="2"/>';
    vals.forEach(function(v,i){
      if(v==null||isNaN(v))return;

function exportStudentsCsv(){
  var rows=[['学号','姓名','性别','出生日期','家长电话','标签','备注']];
  Store.data.students.forEach(function(s){
    rows.push([s.no,s.name,s.gender||'',s.birthday||'',s.phone||'',(s.tags||[]).join('、'),s.note||'']);
  });
  download('学生名单.csv','\uFEFF'+toCsv(rows),'text/csv;charset=utf-8');
  toast('已导出名单','ok');
}
function exportRankCsv(){
  var st=Calc.examStat(UI.examId);if(!st){toast('没有成绩数据','warn');return}
  var head=['名次','学号','姓名'].concat(st.exam.subjects).concat(['总分','得分率%','Z分','T分','超过%']);
  var rows=[head];
  st.rows.forEach(function(r){
    rows.push([r.rank,r.no,r.name].concat(st.exam.subjects.map(function(s){return r.sc[s]==null?'':r.sc[s]}))
      .concat([r.raw,fmtV(r.pct),fmtV(r.z),fmtV(r.t),r.percentile]));
  });
  download(st.exam.name+'_成绩总表.csv','\uFEFF'+toCsv(rows),'text/csv;charset=utf-8');
  Store.log('导出',st.exam.name+' 成绩总表');
  toast('已导出成绩总表','ok');
}
function exportSubjectCsv(){
  var st=Calc.examStat(UI.examId);if(!st){toast('没有数据','warn');return}
  var rows=[['科目','满分','平均','得分率%','及格率%','优秀率%','低分率%','标准差','最高','最低','中位数','Q1','Q3','人数']];
  st.exam.subjects.forEach(function(sub){
    var s=st.subj[sub];if(!s)return;
    rows.push([sub,s.full,fmtV(s.avg),fmtV(s.avgPct),Math.round(s.pass*100),Math.round(s.good*100),
      Math.round(s.low*100),fmtV(s.sd),fmtV(s.max),fmtV(s.min),fmtV(s.mid),fmtV(s.q1),fmtV(s.q3),s.n]);
  });
  download(st.exam.name+'_各科统计.csv','\uFEFF'+toCsv(rows),'text/csv;charset=utf-8');
  toast('已导出各科统计','ok');
}
function exportItemCsv(){
  var ist=Calc.itemStat(UI.examId);if(!ist){toast('本场还没有题号表','warn');return}
  var rows=[['题号','满分','知识板块','说明','平均分','得分率%','难度P','区分度D','高分组%','低分组%','评价']];
  ist.items.forEach(function(it){
    rows.push([it.no,it.full,it.topic,it.desc,fmtV(it.avg||0),fmtV(it.avgPct||0),fmtV(it.P,2),fmtV(it.D,2),
      it.hiPct==null?'':fmtV(it.hiPct),it.loPct==null?'':fmtV(it.loPct),it.level]);
  });
  download(Store.exam(UI.examId).name+'_题目分析.csv','\uFEFF'+toCsv(rows),'text/csv;charset=utf-8');
  toast('已导出题目分析','ok');
}
function exportTopicCsv(){
  var ts=Calc.topicStat(UI.examId);if(!ts){toast('本场还没有题号表','warn');return}
  var rows=[['姓名','学号'].concat(ts.list.map(function(t){return t.topic+'（满分'+t.full+'）'})).concat(['总得分率%'])];
  Store.activeStudents().forEach(function(s){
    var r=ts.stuRate[s.id]||{};
    var vals=ts.list.map(function(t){return r[t.topic]});
    var valid=vals.filter(function(v){return v!=null});
    rows.push([s.name,s.no].concat(vals.map(function(v){return v==null?'':fmtV(v)})).concat([valid.length?fmtV(mean(valid)):'']));
  });
  rows.push(['班级平均',''].concat(ts.list.map(function(t){return fmtV(t.pct)})).concat(['']));
  download('知识板块掌握度_'+Store.exam(UI.examId).name+'.csv','\uFEFF'+toCsv(rows),'text/csv;charset=utf-8');
  toast('已导出板块掌握度','ok');
}
function exportCritCsv(){
  var c=Calc.critList(UI.examId);
  if(!c.rows.length){toast('没有临界生','warn');return}
  var rows=[['学号','姓名','名次','总分','得分率%','Z分','Z波动','标签','说明']];
  c.rows.forEach(function(r){
    rows.push([r.no,r.name,r.rank,fmtV(r.raw),fmtV(r.pct),fmtV(r.z),fmtV(r.zsd),r.tag,r.reasons.join('；')]);
  });
  download('临界生名单.csv','\uFEFF'+toCsv(rows),'text/csv;charset=utf-8');
  toast('已导出临界生名单','ok');
}
function exportWarningCsv(){
  var ws=Calc.warnings(UI.examId);
  if(!ws.length){toast('没有预警数据','warn');return}
  var rows=[['学号','姓名','风险分','等级','名次变化','积分','缺勤','作业缺交','错题未订正','原因']];
  ws.forEach(function(w){
    rows.push([w.no,w.name,w.score,w.level,(w.drop==null?'':w.drop),w.point,w.abs,w.miss,w.mistake,w.flags.join('；')]);
  });
  download('重点关注名单.csv','\uFEFF'+toCsv(rows),'text/csv;charset=utf-8');
  toast('已导出关注名单','ok');
}
function exportMistakesCsv(sid){
  var list=Calc.mistakesOf(sid||null);
  if(!list.length){toast('没有错题记录','warn');return}
  var rows=[['日期','姓名','来源','题号','知识板块','错因','满分','得分','简述','状态','重复次数']];
  list.forEach(function(mk){
    var s=Store.stu(mk.studentId);
    rows.push([mk.date,s?s.name:'',mk.source||'',mk.itemNo||'',mk.topic||'',
      (ERROR_MAP[mk.type]||{}).label||'',mk.full==null?'':mk.full,mk.got==null?'':mk.got,
      mk.brief||'',mk.fixed?'已订正':'未订正',mk.recur||0]);
  });
  download('错题本'+(sid?('_'+(Store.stu(sid)||{}).name):'')+'.csv','\uFEFF'+toCsv(rows),'text/csv;charset=utf-8');
  toast('已导出错题本','ok');
}
function exportPointsCsv(){
  var rows=[['时间','姓名','学号','分值','事由','类别']];
  Store.data.points.forEach(function(p){
    var s=Store.stu(p.studentId);

  toast('已导出积分流水','ok');
}
function exportAbsenceCsv(){
  var rows=[['日期','学号','姓名','类型','时段','原因']];

    var s=Store.stu(a.studentId);

  toast('已导出考勤','ok');
}
function exportHomeworkCsv(){
  var rows=[['布置日期','学科','作业','学号','姓名','状态']];
  Store.data.homework.forEach(function(hw){
    Store.activeStudents().forEach(function(s){
      var v=Store.data.hwStatus[hw.id][s.id];

function exportComputeCsv(){
  var rows=[['日期','题数','错题数','正确率%','用时秒','错式类型','备注']];
  (Store.data.compute||[]).forEach(function(s){
    rows.push([s.date,s.total,s.wrong,fmtV(s.total?(s.total-s.wrong)/s.total*100:0),
      s.seconds==null?'':s.seconds,(s.types||[]).join('、'),s.note||'']);
  });

function exportLogCsv(){
  var rows=[['时间','操作','详情']];
  Store.data.logs.forEach(function(l){rows.push([new Date(l.ts).toLocaleString('zh-CN'),l.action,l.detail])});
  download('操作日志.csv','\uFEFF'+toCsv(rows),'text/csv;charset=utf-8');
  toast('已导出日志','ok');
}
function exportAllCsv(){
  confirmSheet('导出的是<b>明文 CSV</b>，含学生姓名、成绩、家长电话。<br>确定导出？'
    +'<br><span style="font-size:13px;color:var(--muted)">导出后请妥善保管，用完及时删除，不要发到微信群里。</span>',function(){
    var name=Store.data.meta.className.replace(/[\\/:*?"<>|]/g,'_')+'_全部数据_'+todayStr()+'.csv';
    var rows=[];
    rows.push(['【学生名单】']);
    rows.push(['学号','姓名','性别','出生日期','家长电话','标签','备注']);
    Store.data.students.forEach(function(s){rows.push([s.no,s.name,s.gender||'',s.birthday||'',s.phone||'',(s.tags||[]).join('、'),s.note||''])});
    rows.push([]);
    Calc.sortedExams().forEach(function(e){
      rows.push(['【'+e.name+'（'+e.date+'）】']);
      rows.push(['名次','学号','姓名'].concat(e.subjects).concat(['总分','得分率%','Z分']));
      var st=Calc.examStat(e.id);
      if(st)st.rows.forEach(function(r){
        rows.push([r.rank,r.no,r.name].concat(e.subjects.map(function(s){return r.sc[s]==null?'':r.sc[s]}))
          .concat([r.raw,fmtV(r.pct),fmtV(r.z)]));
      });
      rows.push([]);
    });
    rows.push(['【错题本】']);
    rows.push(['日期','姓名','来源','题号','知识板块','错因','满分','得分','简述','状态']);
    Store.data.mistakes.forEach(function(mk){
      var s=Store.stu(mk.studentId);
      rows.push([mk.date,s?s.name:'',mk.source||'',mk.itemNo||'',mk.topic||'',(ERROR_MAP[mk.type]||{}).label||'',
        mk.full==null?'':mk.full,mk.got==null?'':mk.got,mk.brief||'',mk.fixed?'已订正':'未订正']);
    });
    download(name,'\uFEFF'+toCsv(rows),'text/csv;charset=utf-8');
    Store.data.meta.lastExport=nowTs();Store.save();
    Store.log('导出明文 CSV',name);
    toast('已导出，请妥善保管','warn');
  },'导出明文',true);
}

function openImportM(cfg){
  var m=sheet({title:cfg.title,full:true,body:'<div id="imBody"></div>',foot:false});
  var grid=[],headers=[],rows=[],map={};
  var fields=cfg.kind==='students'?{
    no:{label:'学号 *',res:[/^学号$/,/学籍号/,/^号$/,/^序号$/]},
    name:{label:'姓名 *',res:[/^姓名$/,/^名字$/,/学生姓名/]},
    gender:{label:'性别',res:[/^性别$/]},
    birthday:{label:'出生日期',res:[/出生/,/生日/]},
    parent:{label:'家长姓名',res:[/^家长$/,/家长姓名/,/监护人$/]},
    phone:{label:'家长电话',res:[/家长.*(电话|手机)/,/联系电话/,/^电话$/,/手机号?$/]},
    phone2:{label:'备用电话',res:[/备用/,/第二.*(电话|手机)/]},
    tags:{label:'标签',res:[/标签/]},
    note:{label:'备注',res:[/^备注$/,/说明/]}
  }:(function(){
    var e=Store.exam(cfg.examId);
    var f={no:{label:'学号',res:[/^学号$/,/学籍号/,/^号$/,/^序号$/]},
           name:{label:'姓名',res:[/^姓名$/,/^名字$/]}};
    e.subjects.forEach(function(sub){
      f['sub:'+sub]={label:sub,res:[new RegExp('^'+sub.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(分|得分|成绩)?$')]};
    });
    return f;
  })();
  function step1(){
    m.querySelector('#imBody').innerHTML=
      '<p class="hint lead">'+esc(cfg.tip)+'</p>'
      +'<div class="fld"><textarea class="inp" id="imTa" rows="8" placeholder="在这里粘贴表格…" style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px"></textarea></div>'
      +'<div class="rowx"><button class="btn grey sm" id="imDemo">填入示例</button>'
      +'<button class="btn ghost sm" id="imFile">选 CSV 文件</button></div>'
      +'<input type="file" id="imFileInp" accept=".csv,.txt,.tsv" style="display:none">'
      +'<div class="fld" style="margin-top:14px"><label class="pick" style="padding:0"><div class="bd"><b>第一行是表头</b></div>'
      +'<span class="sw"><input type="checkbox" id="imHead" checked><i></i></span></label></div>'
      +'<button class="btn block" id="imNext" style="margin-top:6px">下一步：确认列对应关系</button>'
      +'<button class="btn grey block" style="margin-top:9px" data-close>取消</button>';
    m.querySelector('#imDemo').onclick=function(){m.querySelector('#imTa').value=cfg.sample;toast('已填入示例，可改成你的数据','ok')};
    m.querySelector('#imFile').onclick=function(){m.querySelector('#imFileInp').click()};
    m.querySelector('#imFileInp').addEventListener('change',function(){
      var f=this.files[0];if(!f)return;
      readFileText(f,function(t){m.querySelector('#imTa').value=t;toast('已读取 '+f.name,'ok')});
      this.value='';
    });
    m.querySelector('#imNext').onclick=function(){
      grid=parseTable(m.querySelector('#imTa').value);
      if(!grid.length){toast('请先粘贴或选择表格数据','warn');return}
      var hasHead=m.querySelector('#imHead').checked;
      headers=hasHead?grid[0]:grid[0].map(function(_,i){return '第'+(i+1)+'列'});
      rows=hasHead?grid.slice(1):grid;
      if(!rows.length){toast('只有表头，没有数据行','warn');return}
      map=guessCols(headers,fields);
      step2();
    };
  }
  function step2(){
    var opts='<option value="">— 不导入 —</option>'+headers.map(function(h,i){
      return '<option value="'+i+'">'+esc(h||('第'+(i+1)+'列'))+'</option>'}).join('');
    m.querySelector('#imBody').innerHTML=
      '<p class="hint lead">已解析 <b>'+rows.length+'</b> 行。核对下面列名对不对（已自动猜好）：</p>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">'
      +Object.keys(fields).map(function(k){
        return '<div><label style="font-size:11.5px;color:var(--fg2);font-weight:600;display:block;margin-bottom:4px">'+esc(fields[k].label)+'</label>'
          +'<select class="inp" data-fk="'+k+'" style="padding:9px 10px;font-size:14px">'+opts+'</select></div>';
      }).join('')
      +'</div>'
      +(cfg.kind==='students'?'<label class="pick" style="margin-top:12px;padding:10px 0 0"><div class="bd"><b style="font-size:14px">学号或姓名已存在时更新</b><span>不勾选则跳过重复</span></div>'
        +'<span class="sw"><input type="checkbox" id="imOw" checked><i></i></span></label>':'')
      +'<p class="hint lead" style="margin-top:14px">数据预览（前 3 行）：</p>'
      +'<div class="heat-wrap"><table class="heat" style="font-size:11.5px"><thead><tr>'
      +headers.map(function(h){return '<th class="top">'+esc(String(h||'').slice(0,7))+'</th>'}).join('')+'</tr></thead><tbody>'
      +rows.slice(0,3).map(function(r){
        return '<tr>'+headers.map(function(_,i){
          return '<td style="background:#F7F9FC;min-width:52px;font-weight:500">'+esc(String(r[i]==null?'':r[i]).slice(0,10))+'</td>';
        }).join('')+'</tr>';
      }).join('')+'</tbody></table></div>'
      +'<div class="rowx" style="margin-top:16px"><button class="btn grey" id="imBack" style="flex:1">← 上一步</button>'
      +'<button class="btn" id="imRun" style="flex:1.5">✔ 导入 '+rows.length+' 行</button></div>';
    $$('#imBody select[data-fk]').forEach(function(sel){
      var k=sel.getAttribute('data-fk');
      if(map[k]!=null)sel.value=String(map[k]);
      sel.onchange=function(){map[k]=sel.value===''?undefined:Number(sel.value)};
    });
    m.querySelector('#imBack').onclick=step1;
    m.querySelector('#imRun').onclick=function(){
      var ow=$('#imOw')?$('#imOw').checked:true;
      var res=runImport(cfg,rows,map,ow);
      Store.save();closeSheet(m);
      App.render();
      cfg.kind==='students'
        ? toast('导入完成：新增 '+res.added+' 人、更新 '+res.upd+' 人、跳过 '+res.skip+' 人',(res.dupNo&&res.dupNo.length)?'warn':'ok')
        : toast('已导入 '+res.matched+' 人成绩'+(res.unmatched.length?('，'+res.unmatched.length+' 行没匹配到'):''),res.unmatched.length?'warn':'ok');
    };
  }
  step1();
}
function runImport(cfg,rows,map,overwrite){
  if(cfg.kind==='students'){
    return Fields.students.run(rows,map,{overwrite:overwrite,matchNo:true});
  }
  var e=Store.exam(cfg.examId);
  return Fields.scores.run(rows,map,{exam:e});
}

/* =====================================================================
   M12. 启动：锁屏 / 建库 / 自动锁
   ===================================================================== */
var LockUI={
  mode:'unlock',
  mount:function(mode){
    this.mode=mode;
    var isSetup=(mode==='setup');
    $('#lockTip').innerHTML=isSetup
      ?'第一次使用，请设置一个密码<br><span style="font-size:12px;opacity:.8">数据会用这个密码加密后存在本机</span>'
      :'请输入密码解锁';
    $('#lockOk').textContent=isSetup?'创建并开始使用':'解锁';
    var row=$('#pinRow');
    row.innerHTML='<input type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="密码">'
      +'<input type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="'+(isSetup?'再输一次':'确认')+'">';
    var ins=$$('#pinRow input');
    ins.forEach(function(inp,i){
      inp.addEventListener('input',function(){
        inp.value=inp.value.replace(/\D/g,'');
        if(inp.value.length>=4&&ins[i+1]&&!ins[i+1].value)ins[i+1].focus();
      });
      inp.addEventListener('keydown',function(ev){
        if(ev.key==='Backspace'&&!inp.value&&ins[i-1])ins[i-1].focus();
        if(ev.key==='Enter')LockUI.submit();
      });
    });
    $('#lockErr').textContent='';
    App.locked();
    setTimeout(function(){if(ins[0]&&ins[0].focus)try{ins[0].focus()}catch(e){}},320);
  },
  err:function(msg){
    $('#lockErr').textContent=msg;
    var ins=$$('#pinRow input');
    ins.forEach(function(i2){i2.value=''});
    ins[0].focus();
  },
  submit:function(){
    var ins=$$('#pinRow input');
    var p1=ins[0].value,p2=ins[1]?ins[1].value:'';
    if(this.mode==='setup'){
      var chk=pinStrength(p1);
      if(!chk.ok){this.err(chk.msg);return}
      if(p1!==p2){this.err('两次输入不一致');return}
      $('#lockErr').textContent='正在创建加密数据库…';
      var salt=randomSalt();
      Sec.init(p1,salt).then(function(){
        return Sec.digest(p1+Sec.pepper);
      }).then(function(h){
        return Sec.idbSet(Sec.SALT,{salt:salt,hash:h});
      }).then(function(){
        return Sec.encrypt(Store.data||blankData());
      }).then(function(enc){
        return Sec.idbSet(Sec.KEY,enc);
      }).then(function(){
        Store.data=Store.data||blankData();
        Store.log('初始化','创建加密数据库');
        /* 首次建库必须立刻落盘：Store.save 有 320ms 防抖，若页面随即被切走/重载会丢掉第一次写入 */
        Store.save();
        return Sec.encrypt(Store.data).then(function(enc){return Sec.idbSet(Sec.KEY,enc)});
      }).then(function(){
        App.boot(true);
        setTimeout(function(){toast('已就绪。建议先到「我的 → 备份」导出一份加密备份','ok')},1200);
      }).catch(function(e){
        LockUI.err('创建失败：'+(e.message||e));
      });
      return;
    }
    Sec.idbGet(Sec.SALT).then(function(rec){
      if(!rec||!rec.salt){LockUI.err('本机没有初始化过，请刷新页面重新设置密码');return Promise.reject('noinit')}
      return Sec.digest(p1+Sec.pepper).then(function(h){
        if(rec.hash&&h!==rec.hash){LockUI.err('密码不正确');return Promise.reject('bad')}
        return Sec.init(p1,rec.salt);
      }).then(function(){
        return Store.load();
      }).then(function(res){
        if(res.broken){LockUI.err('数据解密失败，请检查密码');return Promise.reject('bad')}
        UI.examId=ensureExam();
        App.boot(res.fresh);
      });
    }).catch(function(e){
      if(e!=='bad'&&e!=='noinit'){LockUI.err('出错了：'+(e.message||e))}
    });
  }
};
var App2={
  _lockTimer:null,
  lockNow:function(){
    Sec._key=null;
    $('#main').innerHTML='';
    $('#full').classList.remove('on');
    LockUI.mount('unlock');
    toast('已锁定','ok');
  },
  armAutoLock:function(){
    if(this._lockTimer)clearTimeout(this._lockTimer);
    var min=(Store.data&&Store.data.meta.autoLock!=null)?Store.data.meta.autoLock:15;
    if(!min||min<=0)return;
    var self=this;
    this._lockTimer=setTimeout(function(){self.lockNow()},min*60000);
  },
  storageWarn:function(){
    if(this._swShown)return;this._swShown=true;
    if(Sec.backend!=='mem')return;
    var bar=document.createElement('div');
    bar.id='storeWarn';
    bar.setAttribute('style','position:fixed;left:0;right:0;top:0;z-index:150;'
      +'padding:calc(env(safe-area-inset-top,0px) + 9px) 14px 10px;background:#E03131;color:#fff;'
      +'font-size:12.5px;line-height:1.55;display:flex;align-items:center;gap:10px;box-shadow:0 3px 14px rgba(0,0,0,.2)');
    bar.innerHTML='<span style="flex:1"><b>当前无法保存数据！</b>浏览器禁用了本地存储，'
      +'关闭这个页面后数据会丢失。请立刻导出加密备份。</span>'
      +'<button style="flex:none;background:#fff;color:#E03131;padding:7px 12px;border-radius:9px;font-weight:800;font-size:12.5px" '
      +'onclick="backupExportSheet()">导出备份</button>';
    document.body.appendChild(bar);
  },
  checkBackup:function(){
    if(!Store.data)return;
    var le=Store.data.meta.lastExport||0;
    if(nowTs()-le>7*86400000&&!this._bkNotified){
      this._bkNotified=true;
      var m=sheet({title:'💡 该备份了',
        body:'<p style="font-size:14.5px;line-height:1.72;margin:2px 0 8px">已经超过 7 天没有导出备份了。'
          +'数据存在这台手机的浏览器里，清理浏览器数据、卸载浏览器、换手机都会丢失。</p>'
          +'<p class="hint">建议现在导出一份加密备份，存到网盘或发给自己的另一个设备。</p>',
        foot:'<button class="btn grey" style="flex:1" data-close>稍后</button>'
          +'<button class="btn gold" style="flex:1.3" id="bkNow">立即导出</button>'});
      m.querySelector('#bkNow').onclick=function(){closeSheet(m);backupExportSheet()};
    }
  }
};

$('#hdSearch').onclick=function(){
  var m=sheet({title:'搜索',full:true,
    body:'<div class="fld"><input class="inp" id="gsQ" placeholder="搜学生姓名 / 学号 / 错题板块 / 知识点" autocomplete="off"></div>'
      +'<div id="gsRes"><p class="hint">输入关键词开始搜索</p></div>',foot:false});
  function run(){
    var q=(m.querySelector('#gsQ').value||'').trim();
    var box=m.querySelector('#gsRes');
    if(!q){box.innerHTML='<p class="hint">输入关键词开始搜索</p>';return}
    var res=[];
    Store.activeStudents().forEach(function(s){
      if((s.name||'').indexOf(q)>=0||String(s.no)===q||(s.tags||[]).join(',').indexOf(q)>=0){
        res.push({type:'学生',label:s.name,desc:s.no+' 号',act:function(){closeSheet(m);openStudent(s.id)}});
      }
    });
    Store.data.mistakes.forEach(function(mk){
      if((mk.topic||'').indexOf(q)>=0||(mk.brief||'').indexOf(q)>=0||(mk.note||'').indexOf(q)>=0){
        var s=Store.stu(mk.studentId);
        if(res.length<40)res.push({type:'错题',label:(s?s.name:'')+' '+(mk.topic||''),desc:(ERROR_MAP[mk.type]||{}).label+' · '+(mk.brief||''),act:function(){closeSheet(m);UI.tab='wrong';UI.misSeg='list';UI.misStu=s?s.name:'';location.hash='#/wrong';App.render()}});
      }
    });
    Store.data.exams.forEach(function(e){
      if((e.name||'').indexOf(q)>=0){
        res.push({type:'考试',label:e.name,desc:e.date||'',act:function(){closeSheet(m);UI.examId=e.id;UI.tab='exams';location.hash='#/exams';App.render()}});
      }
    });
    box.innerHTML=res.length?res.map(function(r,i){
      return '<div class="li tap" data-i="'+i+'"><div class="bd"><b>'+esc(r.label)+'</b><span>'+r.type+' · '+esc(r.desc)+'</span></div>'+ic('right',16)+'</div>';
    }).join(''):'<div class="empty"><div class="e-ico">🔍</div><p>没有找到「'+esc(q)+'」</p></div>';
    $$('.li[data-i]',box).forEach(function(el){
      el.onclick=function(){res[+el.getAttribute('data-i')].act()};
    });
  }
  m.querySelector('#gsQ').addEventListener('input',debounce(run,220));
  setTimeout(function(){m.querySelector('#gsQ').focus()},320);
};

/* =====================================================================
   M13. 启动
   ===================================================================== */
/* 测试钩子：自动化测试可在加载前设置 window.__CLS_TEST_IDB = {...} 注入内存版 IDB */
(function(){
  if(window.__CLS_TEST_IDB&&typeof Sec!=='undefined'){
    var T=window.__CLS_TEST_IDB;
    Sec.idbGet=function(k){return Promise.resolve(T.get(k))};
    Sec.idbSet=function(k,v){T.set(k,v);return Promise.resolve(true)};
    Sec.idbDel=function(k){T.del(k);return Promise.resolve(true)};
    Sec.get=Sec.idbGet;Sec.set=Sec.idbSet;Sec.del=Sec.idbDel;
    Sec.probe=function(){Sec.backend='idb';return Promise.resolve('idb')};
  }
})();
(function boot(){
  if(!Sec.available()){
    $('#boot').innerHTML='<div style="padding:30px;text-align:center;color:#fff">'
      +'<div style="font-size:40px">⚠️</div><h2 style="font-size:18px">浏览器不支持</h2>'
      +'<p style="font-size:13.5px;opacity:.9;line-height:1.8">这个工具需要 Web Crypto + IndexedDB 才能把数据加密保存在本机。'
      +'<br>请用较新版本的 Chrome / Edge / Safari / 微信内置浏览器打开。</p></div>';
    return;
  }
  window.addEventListener('hashchange',function(){
    var r=(location.hash||'').replace(/^#\/?/,'');
    for(var i=0;i<TABS.length;i++){if(TABS[i].k===r){UI.tab=r;break}}
    App.render();
  });
  ['click','touchstart','keydown'].forEach(function(ev){
    window.addEventListener(ev,function(){
      if(Store.data&&$('#lock').classList.contains('hide'))App2.armAutoLock();
    },{passive:true});
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      var s=lastSheet();
      if(s){closeSheet(s);return}
      if($('#full').classList.contains('on'))closePage();
    }
  });
  /* 探测存储后端：优先 IndexedDB，不可用时自动降级到 localStorage / 内存。
     iOS Safari 打开本地文件时会禁用 IndexedDB，这时仍要能启动并给出明确提示。 */
  Sec.probe().then(function(b){
    if(b==='mem')App2.storageWarn();
    Sec.get(Sec.SALT).then(function(rec){
      if(rec&&rec.salt){LockUI.mount('unlock');App2.armAutoLock()}
      else LockUI.mount('setup');
      $('#lockOk').onclick=function(){LockUI.submit()};
    });
  });
  /* 定时检查备份提醒 */
  setInterval(function(){
    try{if(Store.data&&$('#lock').classList.contains('hide'))App2.checkBackup()}catch(e){}
  },60000);
})();
</script>
