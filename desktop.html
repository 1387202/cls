<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>班级教学仪表盘</title>
<style>
/* ============ 主题 ============ */
:root{
  --bg:#F2F5FA; --card:#FFFFFF; --fg:#1C2536; --muted:#6B7689; --line:#E2E8F2;
  --pri:#1F4E9C; --pri2:#2F68C4; --pri-soft:#EAF1FC;
  --gold:#D9A21B; --gold-soft:#FCF3DC;
  --ok:#1F9254; --ok-soft:#E4F5EC;
  --warn:#D97B1E; --warn-soft:#FCF0E1;
  --bad:#D64550; --bad-soft:#FCEAEC;
  --topbar:#152A55; --topbar2:#1E3A72;
  --radius:12px; --fs:14.5px;
  --shadow:0 1px 3px rgba(21,42,85,.06),0 6px 18px rgba(21,42,85,.06);
  --shadow-lg:0 10px 34px rgba(21,42,85,.18);
  --heat0:#EEF2F7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","微软雅黑","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--fg); font-size:var(--fs); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--pri);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C3CDDD;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none !important}

/* ============ 顶栏 ============ */
#topbar{
  position:fixed;top:0;left:0;right:0;height:56px;z-index:120;
  background:linear-gradient(92deg,var(--topbar),var(--topbar2));color:#fff;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  box-shadow:0 2px 10px rgba(21,42,85,.28);
}
#topbar .brand{font-size:16.5px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
#topbar .sub{font-size:12px;opacity:.75;white-space:nowrap}
#topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-btn{
  background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.24);
  border-radius:9px;padding:6px 13px;cursor:pointer;font-size:13px;white-space:nowrap;
}
.tb-btn:hover{background:rgba(255,255,255,.24)}
.tb-btn.gold{background:var(--gold);color:#3D2C00;border-color:var(--gold);font-weight:700}
#lockBar{display:none;align-items:center;gap:10px;font-size:12px;opacity:.85}

/* ============ 布局 ============ */
#layout{display:flex;padding-top:56px;min-height:100vh}
#nav{
  width:196px;flex:none;padding:12px 9px 80px;position:sticky;top:56px;
  height:calc(100vh - 56px);overflow-y:auto;
}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 13px;margin-bottom:3px;
  border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;
}
.nav-item:hover{background:var(--pri-soft);color:var(--pri)}
.nav-item.active{background:var(--pri);color:#fff;box-shadow:0 3px 10px rgba(31,78,156,.32)}
.nav-item .ico{width:20px;text-align:center}
#main{flex:1;min-width:0;padding:18px 22px 90px;max-width:1280px;margin:0 auto;width:100%}

/* ============ 组件 ============ */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 17px;margin-bottom:14px;border:1px solid rgba(226,232,242,.7)}
.card>h3{margin:0 0 11px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .sub{font-size:12px;color:var(--muted);font-weight:400}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.bold{font-weight:700}
.right{margin-left:auto}
.center{text-align:center}
.btn{
  border:none;border-radius:9px;padding:7px 15px;cursor:pointer;font-weight:600;
  background:var(--pri);color:#fff;display:inline-flex;align-items:center;gap:6px;
  transition:filter .15s,transform .05s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.975)}
.btn.ghost{background:var(--pri-soft);color:var(--pri)}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--warn)}
.btn.bad{background:var(--bad)}
.btn.gold{background:var(--gold);color:#fff}
.btn.sm{padding:4px 11px;font-size:13px;border-radius:7px}
.btn.xs{padding:2px 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.42;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;outline:none;min-width:0;
}
input:focus,select:focus,textarea:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(47,104,196,.13)}
textarea{width:100%;resize:vertical}
label.ck{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
label.ck input{accent-color:var(--pri)}
.seg{display:inline-flex;background:var(--pri-soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:5px 14px;border-radius:8px;cursor:pointer;color:var(--pri);font-weight:600}
.seg button.on{background:var(--pri);color:#fff}
.tabs{display:flex;gap:3px;border-bottom:2px solid var(--line);margin-bottom:13px;flex-wrap:wrap}
.tabs .tab{padding:7px 15px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500;border-radius:6px 6px 0 0}
.tabs .tab:hover{color:var(--pri);background:var(--pri-soft)}
.tabs .tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-size:12px;white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:#8A6300}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.gray{background:#EEF1F6;color:var(--muted)}
.flow-item{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--line)}
.flow-item:last-child{border-bottom:none}
.stat{background:#fff;border-radius:10px;padding:11px 13px;box-shadow:var(--shadow);border:1px solid rgba(226,232,242,.7)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .d{font-size:11.5px;color:var(--muted)}
.stat .v.pos{color:var(--bad)}
.stat .v.neg{color:var(--ok)}
.stat .v.gold{color:var(--gold)}
.stat .v.pri{color:var(--pri)}
.tbl-wrap{overflow:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
table.tbl th,table.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.tbl th{background:#F7F9FC;color:var(--muted);font-weight:600;position:sticky;top:0;z-index:2}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl tr.clickable{cursor:pointer}
table.tbl tr.clickable:hover{background:var(--pri-soft)}
.arrow-up{color:var(--bad);font-weight:600}
.arrow-down{color:var(--ok);font-weight:600}
.empty{padding:34px;text-align:center;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.sec{border-top:1px solid var(--line);padding-top:11px;margin-top:11px}
.sec h4{margin:0 0 8px;font-size:14px}

/* ============ 弹窗 ============ */
.mask{position:fixed;inset:0;background:rgba(16,26,48,.46);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:38px 14px;overflow:auto}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:540px;overflow:hidden}
.modal.wide{max-width:940px}
.modal-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700}
.modal-h .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:17px;padding:0 4px}
.modal-b{padding:15px 16px;max-height:66vh;overflow:auto}
.modal-f{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#FAFBFD}

/* ============ 锁屏 ============ */
#lock{position:fixed;inset:0;z-index:900;background:linear-gradient(150deg,#152A55,#27508F);display:flex;align-items:center;justify-content:center}
#lock .box{background:#fff;border-radius:16px;padding:28px;width:min(370px,92vw);box-shadow:var(--shadow-lg);text-align:center}
#lock h1{font-size:19px;margin:0 0 4px}
#lock .pin{display:flex;gap:8px;justify-content:center;margin:16px 0 6px}
#lock .pin input{width:44px;height:52px;text-align:center;font-size:22px;font-weight:700;border-radius:10px}
#lock .err{color:var(--bad);font-size:12.5px;min-height:18px}

/* ============ 表格导入器 ============ */
.dropzone{border:2px dashed var(--line);border-radius:11px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:#FAFBFD}
.dropzone:hover,.dropzone.over{border-color:var(--pri2);background:var(--pri-soft);color:var(--pri)}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.map-grid label{font-size:12.5px;color:var(--muted);display:block}
.map-grid select{width:100%}
.prev-wrap{overflow:auto;max-height:330px;border:1px solid var(--line);border-radius:9px;margin-top:10px}
.prev-wrap table{border-collapse:collapse;font-size:12px;width:100%}
.prev-wrap th,.prev-wrap td{border:.5px solid var(--line);padding:3px 6px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.prev-wrap th{background:#F5F8FC;color:var(--muted);position:sticky;top:0}
.prev-wrap td.bad{background:var(--bad-soft);color:var(--bad)}
.prev-wrap td.good{background:var(--ok-soft)}

/* ============ 热力图 ============ */
.heat-scroll{overflow:auto;max-width:100%}
table.heat{border-collapse:separate;border-spacing:2px;font-size:12px}
table.heat th{font-weight:600;white-space:nowrap;padding:3px 6px;color:var(--muted);background:transparent;position:sticky;left:0}
table.heat th.top{position:sticky;top:0;background:#fff;z-index:3;max-width:82px;overflow:hidden;text-overflow:ellipsis;writing-mode:horizontal-tb}
table.heat td{width:52px;height:29px;text-align:center;border-radius:5px;font-variant-numeric:tabular-nums;cursor:default;color:#22303F}
table.heat td.name{text-align:left;position:sticky;left:0;background:#fff;z-index:1;font-weight:600;white-space:nowrap}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{width:22px;height:12px;border-radius:3px;display:inline-block}

/* ============ 图表 ============ */
canvas{max-width:100%}
.chart-box{position:relative}

/* ============ 打印 / 报告 ============ */
#reportHost{position:fixed;inset:0;z-index:700;background:#ECEEF3;overflow:auto;padding:24px 12px 60px;display:none}
#reportHost.on{display:block}
.report-toolbar{max-width:820px;margin:0 auto 14px;display:flex;gap:8px;justify-content:flex-end}
.paper{
  background:#fff;width:210mm;min-height:297mm;margin:0 auto 16px;padding:16mm 15mm;
  box-shadow:0 6px 24px rgba(20,30,60,.16);font-size:12px;color:#15202E;line-height:1.62;
}
.paper h1{font-size:19px;margin:0 0 2px;text-align:center}
.paper .meta{text-align:center;color:#5C6a7A;font-size:11.5px;margin-bottom:14px}
.paper h2{font-size:13.5px;margin:16px 0 7px;padding-bottom:4px;border-bottom:1.5px solid #1F4E9C;color:#1F4E9C;display:flex;align-items:center;gap:6px}
.paper h2 .rt{margin-left:auto;font-size:11px;color:#7A8698;font-weight:400}
.paper table{border-collapse:collapse;width:100%;font-size:11.5px}
.paper table th,.paper table td{border:1px solid #D6DEEA;padding:3px 6px}
.paper table th{background:#F0F4FA;font-weight:600;text-align:center}
.paper table td.num{text-align:right;font-variant-numeric:tabular-nums}
.paper .kv{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:11.5px;margin-bottom:4px}
.paper .kv b{font-weight:600}
.paper .note{background:#F5F8FC;border-left:3px solid #1F4E9C;padding:7px 10px;font-size:11.5px;margin:7px 0}
.paper .cols{display:flex;gap:12px}
.paper .cols>*{flex:1;min-width:0}
.paper .sign{margin-top:26px;display:flex;justify-content:space-between;font-size:11.5px;color:#4A5666}
.tier{display:inline-block;min-width:44px;text-align:center;padding:0 6px;border-radius:4px;font-size:11px}

/* ============ 提示 ============ */
#toasts{position:fixed;right:16px;bottom:16px;z-index:960;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#22303F;color:#fff;padding:9px 15px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);animation:tin .18s ease}
.toast.ok{background:var(--ok)}.toast.warn{background:var(--warn)}.toast.bad{background:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 移动端 ============ */
#mtab{display:none}
@media (max-width:820px){
  #nav{display:none}
  #main{padding:14px 12px 96px}
  #mtab{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:130;background:#fff;border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(21,42,85,.09)}
  #mtab .mt{flex:1;text-align:center;padding:7px 2px 8px;font-size:11px;color:var(--muted);cursor:pointer}
  #mtab .mt.on{color:var(--pri);font-weight:700}
  #mtab .mt .ico{display:block;font-size:17px;line-height:1.25}
  .paper{width:100%;padding:12px}
}

@media print{
  body{background:#fff}
  #topbar,#nav,#mtab,#toasts,#reportToolbar,.report-toolbar,.no-print{display:none !important}
  #layout{padding-top:0}
  #reportHost{position:static;padding:0;background:#fff;overflow:visible;display:block !important}
  .paper{box-shadow:none;margin:0;width:auto;min-height:0;padding:0;page-break-after:always}
  .paper:last-child{page-break-after:auto}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>

<!-- ================= 锁屏 ================= -->
<div id="lock" class="hidden">
  <div class="box">
    <div style="font-size:30px">🔒</div>
    <h1>班级教学仪表盘</h1>
    <p class="muted small" id="lockTip">请输入密码解锁</p>
    <div class="pin" id="pinBox"></div>
    <div class="err" id="lockErr"></div>
    <div class="row" style="justify-content:center;margin-top:6px">
      <button class="btn" id="lockOk">解锁</button>
    </div>
    <p class="muted small" style="margin-top:14px;line-height:1.7">数据全部保存在本机浏览器中，<b>不会上传到任何服务器</b>。<br>请定期在「设置」中导出加密备份。</p>
  </div>
</div>

<!-- ================= 顶栏 ================= -->
<div id="topbar">
  <span class="brand" id="tbTitle">班级教学仪表盘</span>
  <span class="sub" id="tbSub"></span>
  <div class="right">
    <span id="lockBar"><button class="tb-btn" onclick="App.lockNow()">🔒 锁定</button></span>
    <button class="tb-btn" onclick="UI.go('settings')">设置</button>
    <button class="tb-btn gold" id="tbMainBtn" onclick="UI.go('overview')">总览</button>
  </div>
</div>

<!-- ================= 主体 ================= -->
<div id="layout">
  <div id="nav"></div>
  <div id="main"></div>
</div>
<div id="mtab"></div>

<!-- ================= 报告层 ================= -->
<div id="reportHost">
  <div class="report-toolbar">
    <button class="btn ghost" onclick="Reports.close()">← 返回</button>
    <button class="btn" onclick="window.print()">🖨 打印 / 另存为 PDF</button>
  </div>
  <div id="reportBody"></div>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ==========================================================================
   班级教学仪表盘 · 单文件离线应用
   数据默认 100% 保存在本机 IndexedDB（AES-GCM 加密），不联网、不上传。
   ========================================================================== */

/* ---------------------------------------------------------------- 0. 工具 */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var pad2=function(n){return (n<10?'0':'')+n};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function addDays(s,n){var p=String(s).split('-');var d=new Date(+p[0],+p[1]-1,+p[2]+n);return todayStr(d)}
function nowTs(){return Date.now()}
function uid(p){return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,6).toUpperCase()}
function fmtV(v,n){if(v==null||isNaN(v))return '—';return (Math.round(v*Math.pow(10,n==null?1:n))/Math.pow(10,n==null?1:n)).toString()}
function fmtTime(ts){if(!ts)return '—';var d=new Date(ts);return (d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())}
function fmtDateCn(s){if(!s)return '—';var p=String(s).split('-');if(p.length<3)return s;return (+p[1])+'月'+(+p[2])+'日'}
function debounce(fn,ms){var t=null;return function(){var a=arguments,s=this;clearTimeout(t);t=setTimeout(function(){fn.apply(s,a)},ms)}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function sum(a){return a.reduce(function(x,y){return x+(Number(y)||0)},0)}
function mean(a){return a.length?sum(a)/a.length:0}
function stdev(a){if(a.length<2)return 0;var m=mean(a);return Math.sqrt(mean(a.map(function(x){return (x-m)*(x-m)})))}
function median(a){if(!a.length)return 0;var b=a.slice().sort(function(x,y){return x-y}),n=b.length;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2}
function quantile(a,q){if(!a.length)return 0;var b=a.slice().sort(function(x,y){return x-y}),pos=(b.length-1)*q,lo=Math.floor(pos),hi=Math.ceil(pos);return lo===hi?b[lo]:b[lo]+(b[hi]-b[lo])*(pos-lo)}
function toast(msg,type){
  var box=$('#toasts');if(!box){alert(msg);return}
  var el=document.createElement('div');el.className='toast '+(type||'');el.textContent=msg;box.appendChild(el);
  setTimeout(function(){el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(function(){el.remove()},320)},2400);
}
function modal(o){
  o=o||{};
  var m=document.createElement('div');m.className='mask';
  m.innerHTML='<div class="modal'+(o.wide?' wide':'')+'">'
    +'<div class="modal-h"><span>'+esc(o.title||'')+'</span><span class="x">✕</span></div>'
    +'<div class="modal-b">'+(o.body||'')+'</div>'
    +(o.foot===false?'':'<div class="modal-f">'+(o.foot||'<button class="btn ghost" data-close>关闭</button>')+'</div>')
    +'</div>';
  document.body.appendChild(m);
  m.querySelector('.x').onclick=function(){closeModal(m)};
  m.addEventListener('click',function(e){if(e.target===m)closeModal(m)});
  m.addEventListener('click',function(e){if(e.target.hasAttribute&&e.target.hasAttribute('data-close'))closeModal(m)});
  return m;
}
function closeModal(m){if(m&&m.parentNode){m.style.transition='opacity .14s';m.style.opacity='0';setTimeout(function(){m.remove()},150)}}
function confirmBox(msg,onOk,okText){
  var m=modal({title:'请确认',body:'<p style="margin:4px 0">'+msg+'</p>',
    foot:'<button class="btn ghost" data-close>取消</button><button class="btn bad" id="cfOk">'+esc(okText||'确定')+'</button>'});
  m.querySelector('#cfOk').onclick=function(){closeModal(m);onOk()};
}
function promptBox(title,def,onOk,type){
  var m=modal({title:title,body:'<input type="'+(type||'text')+'" id="pbV" style="width:100%" value="'+esc(def||'')+'">',
    foot:'<button class="btn ghost" data-close>取消</button><button class="btn" id="pbOk">确定</button>'});
  var el=m.querySelector('#pbV');setTimeout(function(){el.focus();el.select()},40);
  m.querySelector('#pbOk').onclick=function(){var v=el.value.trim();closeModal(m);onOk(v)};
  el.addEventListener('keydown',function(e){if(e.key==='Enter'){var v=el.value.trim();closeModal(m);onOk(v)}});
}

/* ---------------------------------------------------------------- 1. CSV */
function parseCsvLine(line){
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else { if(c==='"')q=true; else if(c===','||c==='\t'){out.push(cur);cur=''} else cur+=c }
  }
  out.push(cur);return out;
}
function parseTable(text){
  if(!text)return [];
  text=String(text).replace(/\r\n?/g,'\n').replace(/^\uFEFF/,'');
  var lines=text.split('\n').filter(function(l){return l.replace(/[\s,;\t]/g,'')!==''});
  if(!lines.length)return [];
  var tabs=lines.filter(function(l){return l.indexOf('\t')>=0}).length;
  var delim=tabs>=lines.length/2?'\t':(lines[0].indexOf(',')>=0?',':',');
  return lines.map(function(l){
    if(delim==='\t')return l.split('\t').map(function(x){return String(x).trim().replace(/^"|"$/g,'')});
    return parseCsvLine(l).map(function(x){return String(x).trim()});
  });
}
function toCsv(rows){
  return rows.map(function(r){return r.map(function(v){
    v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  }).join(',')}).join('\r\n');
}
function download(name,text,mime){
  var blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},900);
}
function readFileText(file,cb){
  var fr=new FileReader();
  fr.onload=function(){cb(String(fr.result||''))};
  fr.onerror=function(){cb('')};
  if(/^image\//.test(file.type))fr.readAsDataURL(file); else fr.readAsText(file,'UTF-8');
}
function guessCols(headers,spec){
  // spec: {key:{label,res:[正则],num?,date?}}
  var map={},used={};
  Object.keys(spec).forEach(function(k){
    var re=spec[k].res||[];
    for(var i=0;i<headers.length;i++){
      if(used[i])continue;
      var h=String(headers[i]||'').replace(/\s|　/g,'');
      for(var r=0;r<re.length;r++){ if(re[r].test(h)){ map[k]=i;used[i]=1;return } }
    }
  });
  return map;
}

function normDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date)return todayStr(v);
  var s=String(v).trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){var p=s.split('-');return p[0]+'-'+pad2(+p[1])+'-'+pad2(+p[2])}
  if(/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(s)){var q=s.split('/');return q[0]+'-'+pad2(+q[1])+'-'+pad2(+q[2])}
  var m=s.match(/^(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?$/);
  if(m)return m[1]+'-'+pad2(+m[2])+'-'+pad2(+m[3]);
  var m2=s.match(/^(\d{4})[.\-](\d{1,2})[.\-](\d{1,2})$/);
  if(m2)return m2[1]+'-'+pad2(+m2[2])+'-'+pad2(+m2[3]);
  var m3=s.match(/^(\d{1,2})\s*月\s*(\d{1,2})\s*日?$/);
  if(m3)return new Date().getFullYear()+'-'+pad2(+m3[1])+'-'+pad2(+m3[2]);
  return s;
}
function normNum(v){
  if(v==null||v==='')return null;
  var s=String(v).replace(/[^\d.\-]/g,'');
  if(s===''||s==='-'||s==='.')return null;
  var n=Number(s);
  return isNaN(n)?null:n;
}

var Sec={
  KEY:'dashboard.v1',
  TOMB:'dashboard.tomb',
  SALT:'dashboard.salt',
  pepper:'dsh-local-only-2026',
  _key:null,_plain:null,
  _b64:function(buf){var b='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)b+=String.fromCharCode(a[i]);return btoa(b)},
  _unb64:function(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a},
  available:function(){return !!(window.crypto&&crypto.subtle)},
  /* 存储后端：优先 IndexedDB；不可用时自动降级到 localStorage / 内存，
     因为部分浏览器（含 iOS Safari 打开本地文件时）会禁用 file:// 下的 IndexedDB。
     后端一旦探测成功就缓存结果，避免每次操作都重试。 */
  backend:null,        /* 'idb' | 'ls' | 'mem' | null */
  backendMsg:'',
  _mem:{},
  LS_PREFIX:'clsdb:',
  /* --- 探测后端（只跑一次），返回 Promise<backend> --- */
  probe:function(){
    var self=this;
    if(self.backend)return Promise.resolve(self.backend);
    return new Promise(function(res){
      var done=false;
      function finish(b,msg){
        if(done)return;done=true;
        self.backend=b;self.backendMsg=msg||'';
        res(b);
      }
      /* 1) IndexedDB */
      var timer=setTimeout(function(){tryLs()} ,2200);
      var r;
      try{ r=indexedDB.open('cls-dashboard',1) }catch(e){ clearTimeout(timer);tryLs();return }
      r.onupgradeneeded=function(){
        try{var db=r.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv')}catch(e){}
      };
      r.onsuccess=function(){
        if(done)return;
        var db=r.result;
        /* 真正写一次再回读，确认不是"假可用" */
        try{
          var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put('1','__probe__');
          tx.oncomplete=function(){
            clearTimeout(timer);
            try{
              var g=db.transaction('kv','readonly').objectStore('kv').get('__probe__');
              g.onsuccess=function(){
                if(g.result==='1')finish('idb','IndexedDB 可用');
                else tryLs();
              };
              g.onerror=function(){tryLs()};
            }catch(e){tryLs()}
          };
          tx.onerror=function(){clearTimeout(timer);tryLs()};
        }catch(e){clearTimeout(timer);tryLs()}
      };
      r.onerror=function(){clearTimeout(timer);tryLs()};
      r.onblocked=function(){clearTimeout(timer);tryLs()};
      /* 2) localStorage */
      function tryLs(){
        clearTimeout(timer);
        if(done)return;
        try{
          var k=self.LS_PREFIX+'__probe__';
          localStorage.setItem(k,'1');
          if(localStorage.getItem(k)==='1'){localStorage.removeItem(k);finish('ls','localStorage 可用（IndexedDB 不可用）');return}
        }catch(e){}
        finish('mem','浏览器禁用了本机存储，本次会话的数据不会保存');
      }
    });
  },
  _idb:function(){
    var self=this;
    return new Promise(function(res,rej){
      if(!window.indexedDB)return rej(new Error('不支持 IndexedDB'));
      var settled=false;
      var timer=setTimeout(function(){
        if(settled)return;settled=true;rej(new Error('IndexedDB 打开超时'));
      },2500);
      var r;
      try{ r=indexedDB.open('cls-dashboard',1) }catch(e){ clearTimeout(timer);return rej(e) }
      r.onupgradeneeded=function(){
        try{var db=r.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv')}catch(e){}
      };
      r.onsuccess=function(){if(settled)return;settled=true;clearTimeout(timer);res(r.result)};
      r.onerror=function(){if(settled)return;settled=true;clearTimeout(timer);rej(r.error||new Error('IndexedDB 不可用'))};
      r.onblocked=function(){if(settled)return;settled=true;clearTimeout(timer);rej(new Error('IndexedDB 被其它标签页占用'))};
    });
  },
  get:function(k){
    var self=this;
    return self.probe().then(function(b){
      if(b==='idb'){
        return self._idb().then(function(db){
          return new Promise(function(res){
            try{
              var q=db.transaction('kv','readonly').objectStore('kv').get(k);
              q.onsuccess=function(){res(q.result==null?null:q.result)};
              q.onerror=function(){res(null)};
            }catch(e){res(null)}
          });
        }).catch(function(){return null});
      }
      if(b==='ls'){
        try{ var v=localStorage.getItem(self.LS_PREFIX+k); return v==null?null:JSON.parse(v) }catch(e){ return null }
      }
      return self._mem[k]===undefined?null:self._mem[k];
    });
  },
  set:function(k,v){
    var self=this;
    return self.probe().then(function(b){
      if(b==='idb'){
        return self._idb().then(function(db){
          return new Promise(function(res){
            try{
              var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);
              tx.oncomplete=function(){res(true)};tx.onerror=function(){res(false)};
            }catch(e){res(false)}
          });
        }).catch(function(){return false});
      }
      if(b==='ls'){
        try{ localStorage.setItem(self.LS_PREFIX+k,JSON.stringify(v)); return true }
        catch(e){ self.backend='mem'; self.backendMsg='本机存储已满或被禁用'; return false }
      }
      self._mem[k]=v;return true;
    });
  },
  del:function(k){
    var self=this;
    return self.probe().then(function(b){
      if(b==='idb'){
        return self._idb().then(function(db){
          return new Promise(function(res){
            try{
              var tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);
              tx.oncomplete=function(){res(true)};tx.onerror=function(){res(false)};
            }catch(e){res(false)}
          });
        }).catch(function(){return false});
      }
      if(b==='ls'){ try{ localStorage.removeItem(self.LS_PREFIX+k); return true }catch(e){ return false } }
      delete self._mem[k];return true;
    });
  },
  /* 兼容旧调用名（桌面版/手机版其余代码用的都是 idbGet/idbSet/idbDel） */
  idbGet:function(k){return this.get(k)},
  idbSet:function(k,v){return this.set(k,v)},
  idbDel:function(k){return this.del(k)},
  digest:function(str){
    if(window.crypto&&crypto.subtle)return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(b){return Sec._b64(b)});
    var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return Promise.resolve('f'+Math.abs(h));
  },
  init:function(pin,saltB64){
    var salt=this._unb64(saltB64);
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pin+this.pepper),{name:'PBKDF2'},false,['deriveKey'])
      .then(function(base){
        return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
      }).then(function(k){Sec._key=k;return k});
  },
  encrypt:function(obj){
    if(!this._key)return Promise.reject(new Error('locked'));
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var data=new TextEncoder().encode(JSON.stringify(obj));
    return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},this._key,data).then(function(ct){
      return {v:1,iv:Sec._b64(iv),ct:Sec._b64(ct)};
    });
  },
  decrypt:function(rec){
    if(!this._key)return Promise.reject(new Error('locked'));
    var iv=this._unb64(rec.iv),ct=this._unb64(rec.ct);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},this._key,ct).then(function(pt){
      return JSON.parse(new TextDecoder().decode(pt));
    });
  }
};
function randomSalt(){var a=crypto.getRandomValues(new Uint8Array(16));return Sec._b64(a)}
function pinStrength(pin){
  if(!pin||pin.length<4)return {ok:false,msg:'密码至少 4 位'};
  if(/^\d{4,}$/.test(pin)){
    if(/^(\d)\1+$/.test(pin))return {ok:false,msg:'不要用重复数字'};
    if(/^(0123|1234|2345|3456|4567|5678|6789|9876|8765|7654|6543|5432|4321|3210)/.test(pin))return {ok:false,msg:'不要用连续数字'};
  }
  return {ok:true,msg:''};
}

var Store={
  data:null,_warned:false,
  load:function(){
    var self=this;
    return Sec.idbGet(Sec.KEY).then(function(rec){
      if(!rec||!rec.ct){ self.data=blankData(); return {fresh:true} }
      return Sec.decrypt(rec).then(function(obj){
        self.data=Fixer.fix(obj||blankData());
        return {fresh:false};
      }).catch(function(){
        return {broken:true,fresh:false};
      });
    });
  },
  save:debounce(function(){
    var self=Store;
    if(!self.data||!Sec._key)return;
    if(Sec.backend==="mem"){self.warnStorage();return}
    Sec.encrypt(self.data).then(function(rec){
      rec.updated=nowTs();
      return Sec.idbSet(Sec.KEY,rec);
    }).then(function(ok){
      if(!ok){self.warnStorage();return}
      var el=$('#tbSub');if(el)el.textContent=Store.subTitle();
    }).catch(function(e){
      if(!self._warned){self._warned=true;toast('保存出错：'+(e.message||e),'bad')}
    });
  },320),
  warnStorage:function(){
    if(this._warned)return;
    this._warned=true;
    var bar=$('#storeWarn');
    if(!bar){
      bar=document.createElement('div');
      bar.id='storeWarn';
      bar.setAttribute('style','position:fixed;top:56px;left:0;right:0;z-index:200;background:#D64550;color:#fff;'

/* 数据自愈：保证老数据/缺字段也能跑 */
var Fixer={
  fix:function(d){
    var b=blankData();
    if(!d||typeof d!=='object')return b;
    ['version','meta','students','exams','scores','examItems','itemScores','mistakes','points','attendance','homework','hwStatus','comments','logs'].forEach(function(k){
      if(d[k]==null)d[k]=b[k];
    });
    for(var k in b.meta){ if(d.meta[k]==null)d.meta[k]=b.meta[k] }
    if(!d.meta.subjects||!d.meta.subjects.length)d.meta.subjects=b.meta.subjects.slice();
    if(!d.meta.fullMarks)d.meta.fullMarks=JSON.parse(JSON.stringify(b.meta.fullMarks));
    d.meta.subjects.forEach(function(s){ if(d.meta.fullMarks[s]==null)d.meta.fullMarks[s]=100 });
    if(!d.meta.topics||!d.meta.topics.length)d.meta.topics=(MATH_TOPICS_BY_GRADE[d.meta.grade]||[]).slice();
    if(!Array.isArray(d.students))d.students=[];
    d.students.forEach(function(s){
      if(s.active==null)s.active=true;
      if(!Array.isArray(s.tags))s.tags=[];
      if(s.no==null)s.no=0;
    });
    if(!Array.isArray(d.exams))d.exams=[];
    d.exams.forEach(function(e){
      if(!Array.isArray(e.subjects)||!e.subjects.length)e.subjects=d.meta.subjects.slice();
      if(!e.kind)e.kind='full';
      if(!e.fullMarks)e.fullMarks=JSON.parse(JSON.stringify(d.meta.fullMarks));
      e.subjects.forEach(function(s){ if(e.fullMarks[s]==null)e.fullMarks[s]=d.meta.fullMarks[s]||100 });
      if(!e.date)e.date=todayStr();
    });
    Object.keys(d.itemScores).forEach(function(eid){ if(!d.examItems[eid])d.examItems[eid]=[] });
    if(!Array.isArray(d.mistakes))d.mistakes=[];
    d.mistakes.forEach(function(mk){
      if(!mk.type||!ERROR_MAP[mk.type]){
        var hitT=null,raw=String(mk.type||'').trim();
        ERROR_TYPES.forEach(function(t){if(t.label===raw||t.id===raw)hitT=t.id});
        mk.type=hitT||'concept';
      }
      if(mk.fixed==null)mk.fixed=false;
      if(mk.recur==null)mk.recur=0;
    });
    return d;
  }
};

/* ---------------------------------------------------------------- 5. 示例数据 */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
function makeDemo(){
  var d=blankData();
  var rng=mulberry32(20260910);
  /* 标准正态（Box-Muller），让分数分布像真实班级而不是均匀随机 */
  function norm(){var u=0,v=0;while(!u)u=rng();while(!v)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
  function clamp01(x){return Math.max(0,Math.min(1,x))}
  function jitter(a){return (rng()-0.5)*a}

  d.meta.className='示例班级（七年级）';
  d.meta.grade='七年级';d.meta.term=1;d.meta.boarding=true;
  d.meta.subjects=SUBJECT_PRESETS['七年级'].subjects.slice();
  d.meta.fullMarks=JSON.parse(JSON.stringify(SUBJECT_PRESETS['七年级'].full));
  d.meta.topics=MATH_TOPICS_BY_GRADE['七年级'].slice();
  d.meta.targetScore=0;d.meta.targetRank=0;d.meta.critGap=3;

  /* ---- 学生 ---- */
  var sn='李王张刘陈杨黄赵吴周徐孙马朱胡郭何林罗高郑梁谢宋唐许韩冯邓曹彭曾肖';
  var gn=['浩宇','雨萱','子轩','一诺','梓豪','思远','梦琪','嘉怡','俊杰','晓彤','雨桐','泽宇','欣怡','博文','雅静','晨曦','志强','慧敏','文博','若彤','天宇','佳琪','明轩','紫涵','瑞霖','诗涵','晨阳','可欣','伟豪','玉婷'];
  var N=42;
  /* 每个学生的"综合水平"：均值 0.70、标准差 0.13，截断到 0.30~1.0 */
  var ability=[];
  for(var i=0;i<N;i++){
    var s=blankStudent(i+1,sn.charAt(i%sn.length)+gn[i%gn.length]);
    s.gender=rng()<0.52?'男':'女';
    s.birthday=(2012+Math.floor(rng()*2))+'-'+pad2(1+Math.floor(rng()*12))+'-'+pad2(1+Math.floor(rng()*28));
    s.parent=(rng()<0.5?'父亲':'母亲');
    s.phone='138'+String(10000000+Math.floor(rng()*89999999));
    d.students.push(s);
    ability.push(clamp(0.72+0.12*norm(),0.32,1.0));
  }

  /* ---- 三次考试（难度递增，进步幅度可见） ---- */
  var exNames=[
    {name:'第一次月考',date:addDays(todayStr(),-70),shift:-0.015},
    {name:'期中考试',  date:addDays(todayStr(),-42),shift:0.010},
    {name:'第二次月考',date:addDays(todayStr(),-14),shift:0.030}
  ];
  var topics=d.meta.topics.slice(0,6);

  exNames.forEach(function(ex,ei){
    var e={id:uid('E'),name:ex.name,date:ex.date,kind:'full',
      subjects:d.meta.subjects.filter(function(s){return s!=='体育'}).slice(),
      fullMarks:JSON.parse(JSON.stringify(d.meta.fullMarks)),note:''};
    d.exams.push(e);
    d.scores[e.id]={};

    /* 题号表：6 个板块 + 一道综合压轴题，分值合计等于数学满分 */
    var items=[],used=0;
    var msFull=e.fullMarks[d.meta.mathSubject]||120;
    /* 前 6 题按板块，每题 10 分；余下分数拆成综合题（每题 ≤12）与压轴题（其余），
       避免出现单题 60 分这种不真实的结构 */
    topics.forEach(function(tp,ti){
      items.push({no:ti+1,topic:tp,full:10,desc:tp+' 相关'});
      used+=10;
    });
    var rest=msFull-used;
    while(rest>0){
      var isLast=(rest<=20);
      var full=isLast?rest:12;
      if(isLast&&full>13){ full=Math.ceil(rest/2); }
      items.push({no:items.length+1,topic:isLast?'压轴题':'综合应用',full:full,desc:isLast?'综合压轴题':'综合应用'});
      rest-=full;
      used+=full;
    }
    d.examItems[e.id]=items;

    /* 每个学生每科得分率 */
    d.students.forEach(function(s,si){
      var base=ability[si]+ex.shift;
      var row={};
      e.subjects.forEach(function(sub){
        /* 各科难度不同（数学略难、语文略易），并带个体学科偏好 */
        var hard=(sub===d.meta.mathSubject)?0.010:((sub==='语文'||sub==='道法')?0.035:0);
        var pref=(rng()-0.5)*0.10;
        var rate=clamp(base+hard+pref+jitter(0.075),0.12,1.0);
        row[sub]=Math.round(e.fullMarks[sub]*rate);
      });
      d.scores[e.id][s.id]=row;

      /* 数学题号得分：掌握 / 未掌握模型
         ① 难度基线 base 逐题递增 0.42 → 0.97，前几题对多数人是"会做的题"；
         ② rng() < base 判定掌握 → 拿满分；否则只拿部分分（0~60% 满分）；
         ③ 学困生（能力低）在中等题上就会失手，于是中等难度题的区分度 D 最高，
            这正是真实试卷的形态：太简单的题 D 低、压轴题 D 中等、中档题 D 最高。
         数学总分列与题号得分严格一致（总分由这里决定，避免两处不一致）。 */
      var msFull2=e.fullMarks[d.meta.mathSubject]||120;
      var alloc=[],got=0;
      items.forEach(function(it,ii){
        var pos=ii/(items.length-1||1);
        var base2=clamp(0.78-0.40*pos*pos+(ability[si]-0.72)*0.30+jitter(0.05),0.02,0.99);
        var mastered=(rng()<base2);
        var v;
        if(mastered)v=it.full;
        else v=Math.round(it.full*(rng()*0.55));
        alloc.push(clamp(v,0,it.full));
        got+=alloc[ii];
      });
      /* 极端情况下（整卷几乎全错/全对）做一次温和修正，保留区分度 */
      if(got<=0){ alloc[0]=Math.max(1,Math.round(items[0].full*0.3)); got=alloc[0]; }
      if(got>msFull2){ var over=got-msFull2; for(var z4=items.length-1;z4>=0&&over>0;z4--){var cut=Math.min(alloc[z4],over);alloc[z4]-=cut;over-=cut} got=msFull2; }
      row[d.meta.mathSubject]=got;
      d.itemScores[e.id]=d.itemScores[e.id]||{};
      d.itemScores[e.id][s.id]={};
      items.forEach(function(it,ii){ d.itemScores[e.id][s.id][it.no]=alloc[ii] });
    });
  });

  /* ---- 错题：错因与学生的数学水平弱相关（弱生更容易概念不清） ---- */
  var weakAcc=[];
  d.students.forEach(function(s,si){
    var e=d.exams[Math.floor(rng()*d.exams.length)];
    var items=d.examItems[e.id]||[];
    var n=1+Math.floor(rng()*4);
    for(var k=0;k<n;k++){
      var it=items[Math.floor(rng()*items.length)];
      /* 高水平学生错在计算/规范，低水平学生错在概念/方法 */
      var r=rng(),tier=ability[si];
      var et;
      if(tier>0.78)et=(r<0.45?ERROR_MAP.calc:(r<0.75?ERROR_MAP.steps:ERROR_MAP.read));
      else if(tier>0.62)et=(r<0.3?ERROR_MAP.calc:(r<0.55?ERROR_MAP.read:(r<0.8?ERROR_MAP.cases:ERROR_MAP.steps)));
      else et=(r<0.3?ERROR_MAP.concept:(r<0.5?ERROR_MAP.formula:(r<0.7?ERROR_MAP.calc:ERROR_MAP.aux)));
      var full=it.full;
      var got=Math.max(0,Math.round(full*(0.15+rng()*0.5)));
      d.mistakes.push({id:uid('M'),studentId:s.id,date:e.date,examId:e.id,source:(rng()<0.55?'考试':'作业'),
        itemNo:it.no,topic:it.topic,type:et.id,full:full,got:got,
        brief:'第'+it.no+'题（'+it.topic+'）',note:'',recur:0,fixed:rng()<0.55,ts:nowTs()});
    }
  });

  /* ---- 积分：与常规表现弱相关 ---- */
  var days=20;
  for(var p=0;p<110;p++){
    var si2=Math.floor(rng()*N);
    var lib=rng()<0.55?STUDY_POINTS:BOARDING_POINTS;
    var r2=lib[Math.floor(rng()*lib.length)];
    /* 水平低的学生负面记录更多 */
    if(ability[si2]<0.55&&r2.delta>0&&rng()<0.5)continue;
    d.points.push({id:uid('P'),studentId:d.students[si2].id,delta:r2.delta,reason:r2.label,
      cat:(lib===STUDY_POINTS?'study':'boarding'),ts:nowTs()-Math.floor(rng()*days*86400000)});
  }
  d.points.sort(function(a,b){return b.ts-a.ts});

  /* ---- 考勤 ---- */
  for(var q=0;q<9;q++){
    var si3=Math.floor(rng()*N);
    d.attendance.push({id:uid('A'),studentId:d.students[si3].id,
      date:addDays(todayStr(),-Math.floor(rng()*24)),
      type:(rng()<0.6?'病假':(rng()<0.5?'事假':'迟到')),
      sessions:[SESSION_PRESETS[Math.floor(rng()*3)]],reason:'',ts:nowTs()});
  }

  /* ---- 作业：默认大部分已交，留出少量缺交与优秀 ---- */
  for(var h2=0;h2<6;h2++){
    var hw={id:uid('HW'),subject:d.meta.mathSubject,title:'第'+(h2+3)+'课时作业',
      assigned:addDays(todayStr(),-(h2*2+1)),due:addDays(todayStr(),-(h2*2)),note:''};
    d.homework.push(hw);d.hwStatus[hw.id]={};
    d.students.forEach(function(s,si4){
      var r3=rng();
      if(r3<0.07)d.hwStatus[hw.id][s.id]=0;                 /* 缺交 */
      else if(r3<0.30)d.hwStatus[hw.id][s.id]=2;            /* 优秀 */
      else d.hwStatus[hw.id][s.id]=1;
    });
  }
  /* ---- 计算训练记录 ---- */
  d.compute=[];
  for(var c=0;c<6;c++){
    d.compute.push({id:uid('C'),date:addDays(todayStr(),-(c*4+2)),
      total:10,wrong:1+Math.floor(rng()*4),seconds:200+Math.floor(rng()*180),
      types:[CALC_TYPES[Math.floor(rng()*CALC_TYPES.length)]],note:''});
  }
  d.meta.updatedAt=nowTs();
  return d;
}

/* ---------------------------------------------------------------- 6.5 表格导入引擎 */
var Fields={
  students:{
    title:'👥 学生信息表',
    tip:'从 Excel 框选整张表（含表头）→ Ctrl+C → 粘贴到下方；也可拖入 .csv 文件。带 * 的列为必需。',
    fields:{
      no:{label:'学号 *',res:[/^学号$/,/学籍号/,/^号$/,/^序号$/],req:true},
      name:{label:'姓名 *',res:[/^姓名$/,/^名字$/,/学生姓名/],req:true},
      gender:{label:'性别',res:[/^性别$/]},
      birthday:{label:'出生日期',res:[/出生/,/生日/],date:true},
      parent:{label:'家长姓名',res:[/^家长$/,/家长姓名/,/监护人$/]},
      phone:{label:'家长电话',res:[/家长.*(电话|手机)/,/联系电话/,/^电话$/,/手机号?$/]},
      phone2:{label:'备用电话',res:[/备用/,/第二.*(电话|手机)/]},
      tags:{label:'标签',res:[/标签/,/备注分类/]},
      note:{label:'备注',res:[/^备注$/,/说明/]}
    },
    run:function(rows,map,opt){
      var st=Store.data;
      var added=0,upd=0,skip=0,dupNo=[];
      var seenNo={};
      rows.forEach(function(r,i){
        var name=String(map.name!=null?r[map.name]:'').trim();
        if(!name){skip++;return}
        var no=map.no!=null?normNum(r[map.no]):null;
        if(no==null)no=i+1;
        var exist=null;
        if(seenNo[no]){dupNo.push(no);exist=seenNo[no]}
        else {
          for(var k=0;k<st.students.length;k++){
            var s=st.students[k];
            if(opt.matchNo&&Number(s.no)===Number(no)){exist=s;break}
            if((s.name||'').replace(/\s|　/g,'')===name.replace(/\s|　/g,'')){exist=s;break}
          }
        }
        var rec={
          gender:map.gender!=null?String(r[map.gender]||'').trim():'',
          birthday:map.birthday!=null?normDate(r[map.birthday]):'',
          parent:map.parent!=null?String(r[map.parent]||'').trim():'',
          phone:map.phone!=null?String(r[map.phone]||'').trim():'',
          phone2:map.phone2!=null?String(r[map.phone2]||'').trim():'',
          tags:map.tags!=null?String(r[map.tags]||'').split(/[,，、\/]/).map(function(x){return x.trim()}).filter(Boolean):[],
          note:map.note!=null?String(r[map.note]||'').trim():''
        };
        if(exist){
          if(opt.overwrite){
            exist.no=Number(no)||exist.no;exist.name=name;
            ['gender','birthday','parent','phone','phone2','note'].forEach(function(k){if(rec[k])exist[k]=rec[k]});
            if(rec.tags.length)exist.tags=rec.tags;
            upd++;
          } else skip++;
        } else {
          rec.name=name;rec.tags=rec.tags||[];
          var ns=blankStudent(Number(no)||(st.students.length+1),name);
          for(var kk in rec){ if(rec[kk]!==''&&!(Array.isArray(rec[kk])&&!rec[kk].length))ns[kk]=rec[kk] }
          st.students.push(ns);seenNo[no]=ns;added++;
        }
      });
      st.students.sort(function(a,b){return a.no-b.no});
      Store.log('导入学生',added+' 新增 / '+upd+' 更新 / '+skip+' 跳过');
      return {added:added,upd:upd,skip:skip,dupNo:dupNo};
    }
  },
  scores:{
    title:'📊 成绩表',
    tip:'每一行一个学生，每一列一个科目（表头写科目名）。学号或姓名至少有一列能匹配上。',
    fields:null, /* 动态：学号 + 姓名 + 各科目 */
    run:function(rows,map,opt){
      var st=Store.data,e=opt.exam;
      var matched=0,unmatched=[],vals=0;
      rows.forEach(function(r){
        var s=null;
        var noV=map.no!=null?normNum(r[map.no]):null;
        var nameV=map.name!=null?String(r[map.name]||'').trim():'';
        if(noV!=null)s=Store.byNo(noV);
        if(!s&&nameV)s=Store.byName(nameV);
        if(!s){
          /* 姓名里可能带空格或含学号前缀，再放宽一次 */
          if(noV!=null||nameV)unmatched.push((noV!=null?noV:'')+(nameV||''));
          return;
        }
        matched++;
        st.scores[e.id]=st.scores[e.id]||{};
        st.scores[e.id][s.id]=st.scores[e.id][s.id]||{};
        e.subjects.forEach(function(sub){
          var ci=map['sub:'+sub];
          if(ci==null)return;
          var v=normNum(r[ci]);
          if(v==null)return;
          st.scores[e.id][s.id][sub]=v;vals++;
        });
      });
      Store.log('导入成绩',e.name+'：'+matched+' 人 / '+vals+' 个分数');
      return {matched:matched,unmatched:unmatched,vals:vals};
    }
  }
};

      return '<option value="'+i+'">'+esc(h||('第'+(i+1)+'列'))+'</option>'})).join('')};
    var mapHtml='<div class="map-grid">';

      mapHtml+='<label>'+esc(fields[k].label)+'<select data-fk="'+k+'">'+allOpts+'</select></label>';

    var prevHtml='<div class="prev-wrap"><table><thead><tr>'+headers.map(function(h){return '<th>'+esc(h||'')+'</th>'}).join('')+'</tr></thead><tbody>'
      +rows.slice(0,40).map(function(r){return '<tr>'+headers.map(function(_,i){return '<td>'+esc(r[i]==null?'':r[i])+'</td>'}).join('')+'</tr>'}).join('')
      +'</tbody></table></div>'
      +(rows.length>40?'<p class="hint">仅预览前 40 行，实际共 '+rows.length+' 行。</p>':'');
    var extra='';
    if(cfg.extraHtml)extra=cfg.extraHtml(opt);
    m.querySelector('#impStep2').innerHTML=
      '<p class="hint" style="margin-top:0">已解析 <b>'+rows.length+'</b> 行数据。请核对列对应关系（已自动猜测）：</p>'
      +mapHtml+extra
      +'<div class="row" style="margin:10px 0 4px"><button class="btn ghost sm" id="impBack">← 上一步</button>'
      +'<button class="btn ok right" id="impRun">✔ 导入 '+rows.length+' 行</button></div>'
      +'<p class="hint">数据预览：</p>'+prevHtml;
    m.querySelector('#impStep1').classList.add('hidden');
    m.querySelector('#impStep2').classList.remove('hidden');
    $$('#impStep2 select[data-fk]').forEach(function(sel){
      var k=sel.getAttribute('data-fk');
      if(map[k]!=null)sel.value=String(map[k]);
      sel.onchange=function(){ map[k]=sel.value===''?undefined:Number(sel.value) };
    });
    m.querySelector('#impBack').onclick=function(){
      m.querySelector('#impStep2').classList.add('hidden');
      m.querySelector('#impStep1').classList.remove('hidden');
    };
    m.querySelector('#impRun').onclick=function(){
      var res=cfg.run(rows,map,opt);
      Store.save();Store.log('导入完成',cfg.title);
      closeModal(m);
      cfg.done&&cfg.done(res);
      App.render();
    };
    if(cfg.onStep2)cfg.onStep2(m,opt);
  }
  parse();
  return m;
}

/* ---------------------------------------------------------------- 7. 分析引擎 */
var Calc={
  subFull:function(e,sub){return (e.fullMarks&&e.fullMarks[sub])||Store.data.meta.fullMarks[sub]||100},
  mathSub:function(){return Store.data.meta.mathSubject},
  mathFull:function(e){return this.subFull(e,Store.data.meta.mathSubject)},

  /* 分数表：分数缺失返回 null */
  scoreOf:function(eid,sid,sub){
    var sc=Store.data.scores[eid];
    if(!sc||!sc[sid])return null;
    var v=sc[sid][sub];
    return (v==null||v===''||isNaN(v))?null:Number(v);
  },
  /* 总分（% 口径，跨科可比）：返回 {raw,full,pct} */
  totalOf:function(eid,sid){
    var e=Store.exam(eid);if(!e)return null;
    var raw=0,full=0,any=false;
    e.subjects.forEach(function(sub){
      var v=Calc.scoreOf(eid,sid,sub);
      if(v==null)return;
      any=true;raw+=v;full+=Calc.subFull(e,sub);
    });
    if(!any)return null;
    return {raw:raw,full:full,pct:full?raw/full*100:0};
  },
  /* 数学单科（含题号口径校验） */
  mathOf:function(eid,sid){
    var e=Store.exam(eid);if(!e)return null;
    var sub=this.mathSub();
    if(e.subjects.indexOf(sub)<0)return null;
    var full=this.subFull(e,sub);
    var v=this.scoreOf(eid,sid,sub);
    if(v==null){
      /* 尝试由题号得分推算 */
      var items=Store.data.examItems[eid]||[];
      var isc=(Store.data.itemScores[eid]||{})[sid];
      if(!items.length||!isc)return null;
      var t=0,any=false;
      items.forEach(function(it){var x=isc[it.no];if(x!=null&&x!==''){t+=Number(x);any=true}});
      if(!any)return null;
      v=t;
    }
    return {score:v,full:full,pct:full?v/full*100:0};
  },

  /* ---- 单科统计 ---- */
  subjStat:function(eid,sub){
    var e=Store.exam(eid);if(!e)return null;
    var full=this.subFull(e,sub);
    var arr=[];
    Store.activeStudents().forEach(function(s){
      var v=Calc.scoreOf(eid,s.id,sub);
      if(v!=null)arr.push({sid:s.id,name:s.name,v:v});
    });
    var vals=arr.map(function(x){return x.v});
    var out={sub:sub,full:full,n:vals.length,vals:vals,
      avg:mean(vals),sd:stdev(vals),max:vals.length?Math.max.apply(null,vals):0,min:vals.length?Math.min.apply(null,vals):0,
      mid:median(vals),q1:quantile(vals,0.25),q3:quantile(vals,0.75),
      pass:0,good:0,low:0,excellent:0,avgPct:full?mean(vals)/full*100:0};
    if(vals.length){
      var mp=Store.data.meta;
      out.pass=vals.filter(function(v){return v>=full*mp.passRate}).length/vals.length;
      out.good=vals.filter(function(v){return v>=full*mp.goodRate}).length/vals.length;
      out.low=vals.filter(function(v){return v<full*mp.lowRate}).length/vals.length;
      out.excellent=out.good;
    }
    /* 分数段（按满分百分比 10% 一档） */
    out.segments=[];
    for(var i=0;i<10;i++){
      var lo=full*i/10,hi=full*(i+1)/10;
      out.segments.push({lo:lo,hi:hi,label:Math.round(i*10)+'~'+Math.round((i+1)*10)+'%',
        n:vals.filter(function(v){return v>=lo&&(i===9?v<=hi:v<hi)}).length});
    }
    /* 排名 */
    arr.sort(function(a,b){return b.v-a.v});
    var rk=0,prev=null,cnt=0;arr.forEach(function(x){cnt++;if(prev===null||x.v!==prev){rk=cnt;prev=x.v}x.rank=rk});
    out.rows=arr;
    return out;
  },

  /* ---- 考试总表（含总分/标准分/排名）---- */
  examStat:function(eid){
    var e=Store.exam(eid);if(!e)return null;
    var rows=[];
    Store.activeStudents().forEach(function(s){
      var t=Calc.totalOf(eid,s.id);
      if(!t)return;
      var per={sid:s.id,name:s.name,no:s.no,gender:s.gender,
        sc:{},raw:t.raw,full:t.full,pct:t.pct};
      e.subjects.forEach(function(sub){ per.sc[sub]=Calc.scoreOf(eid,s.id,sub) });
      rows.push(per);
    });
    if(!rows.length)return {exam:e,rows:[],subj:{},n:0,avg:0,avgPct:0,sd:0,pass:0,good:0,low:0};
    /* 总分排名（按百分比） */
    rows.sort(function(a,b){return b.pct-a.pct});
    var rk=0,prev=null,cnt=0;
    rows.forEach(function(r){cnt++;if(prev===null||Math.abs(r.pct-prev)>1e-9){rk=cnt;prev=r.pct}r.rank=rk});
    /* Z 分与 T 分 */
    var pcts=rows.map(function(r){return r.pct});
    var m=mean(pcts),sd=stdev(pcts);
    rows.forEach(function(r){
      r.z=sd?((r.pct-m)/sd):0;
      r.t=Math.round((50+10*r.z)*10)/10;
      r.percentile=rows.length>1?Math.round((rows.length-r.rank)/(rows.length-1)*100):100;
    });
    var out={exam:e,rows:rows,n:rows.length,
      avg:mean(rows.map(function(r){return r.raw})),
      avgPct:m,sd:sd,
      maxPct:Math.max.apply(null,pcts),minPct:Math.min.apply(null,pcts),
      midPct:median(pcts),q1Pct:quantile(pcts,0.25),q3Pct:quantile(pcts,0.75),
      pass:0,good:0,low:0,subj:{}};
    var meta=Store.data.meta;
    out.pass=pcts.filter(function(v){return v>=meta.passRate*100}).length/pcts.length;
    out.good=pcts.filter(function(v){return v>=meta.goodRate*100}).length/pcts.length;
    out.low=pcts.filter(function(v){return v<meta.lowRate*100}).length/pcts.length;
    /* 各科 */
    e.subjects.forEach(function(sub){
      var st=Calc.subjStat(eid,sub);
      if(!st)return;
      out.subj[sub]=st;
      /* 把单科 Z 分写回行 */
      var sv=st.vals,sd2=st.sd,m2=st.avg;
      st.rows.forEach(function(x){
        var row=null;rows.forEach(function(r){if(r.sid===x.sid)row=r});
        if(row){row.zsub=row.zsub||{};row.zsub[sub]=sd2?((x.v-m2)/sd2):0}
      });
    });
    /* 各科名次写回 */
    rows.forEach(function(r){
      r.subRank={};
      e.subjects.forEach(function(sub){
        var st=out.subj[sub];if(!st)return;
        st.rows.forEach(function(x){if(x.sid===r.sid)r.subRank[sub]=x.rank});
      });
    });
    return out;
  },

  /* 上一次考试（按日期排序） */
  sortedExams:function(){return Store.data.exams.slice().sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1})},
  prevExam:function(eid){
    var ex=this.sortedExams();
    for(var i=0;i<ex.length;i++){if(ex[i].id===eid)return i>0?ex[i-1]:null}
    return null;
  },
  nextExam:function(eid){
    var ex=this.sortedExams();
    for(var i=0;i<ex.length;i++){if(ex[i].id===eid)return i<ex.length-1?ex[i+1]:null}
    return null;
  },
  rankOf:function(eid,sid){
    var st=this.examStat(eid);if(!st)return null;
    for(var i=0;i<st.rows.length;i++){if(st.rows[i].sid===sid)return st.rows[i].rank}
    return null;
  },
  /* 历次考试的单科轨迹 */
  trend:function(sid,sub){
    var out=[];
    this.sortedExams().forEach(function(e){
      var rec={examId:e.id,name:e.name,date:e.date};
      if(!sub){var t=Calc.totalOf(e.id,sid);rec.score=t?t.raw:null;rec.pct=t?t.pct:null;rec.rank=Calc.rankOf(e.id,sid)}
      else{var v=Calc.scoreOf(e.id,sid);rec.score=v;rec.pct=(v==null)?null:v/Calc.subFull(e,sub)*100;rec.rank=null}
      out.push(rec);
    });
    return out;
  },

  /* ---- 题级统计：难度 P / 区分度 D ---- */
  itemStat:function(eid,sub){
    var e=Store.exam(eid);if(!e)return null;
    sub=sub||this.mathSub();
    var items=(Store.data.examItems[eid]||[]).slice();
    if(!items.length)return null;
    var isc=Store.data.itemScores[eid]||{};
    var st=this.subjStat(eid,sub);
    var order=st?st.rows.map(function(r){return r.sid}):[];
    var n=order.length;
    var gN=Math.max(1,Math.round(n*0.27));
    var hi=order.slice(0,gN), lo=order.slice(-gN);
    var meta=Store.data.meta;
    var out=items.map(function(it){
      var vals=[],hiV=[],loV=[];
      order.forEach(function(sid){
        var s=isc[sid];if(!s)return;
        var v=s[it.no];
        if(v==null||v==='')return;
        vals.push(Number(v));
      });
      if(!vals.length)return {no:it.no,topic:it.topic,full:it.full,desc:it.desc||'',n:0,P:0,D:0,avgPct:0,level:'无数据'};
      hi.forEach(function(sid){var s=isc[sid];if(s&&s[it.no]!=null&&s[it.no]!=='')hiV.push(Number(s[it.no]))});
      lo.forEach(function(sid){var s=isc[sid];if(s&&s[it.no]!=null&&s[it.no]!=='')loV.push(Number(s[it.no]))});
      var P=it.full?mean(vals)/it.full:0;
      var D=it.full?((hiV.length?mean(hiV)/it.full:0)-(loV.length?mean(loV)/it.full:0)):0;
      var lv='';
      if(D>=0.4)lv='优秀';
      else if(D>=0.3)lv='良好';
      else if(D>=0.2)lv='需修改';
      else lv='建议淘汰/复核';
      if(P<0.3)lv+=' · 偏难'; else if(P>0.7)lv+=' · 偏易';
      return {no:it.no,topic:it.topic,full:it.full,desc:it.desc||'',n:vals.length,
        avg:mean(vals),avgPct:it.full?mean(vals)/it.full*100:0,P:P,D:D,
        hiPct:it.full&&hiV.length?mean(hiV)/it.full*100:null,
        loPct:it.full&&loV.length?mean(loV)/it.full*100:null,
        level:lv};
    });
    /* 整卷难度 P：教育测量学的通行定义是「全卷平均分 ÷ 全卷满分」。
       每题的 x.avg 是该题每生平均得分（分值），逐题相加即为全卷平均分。 */
    var paperFull=sum(items.map(function(it){return it.full}));
    var avgScore=0,gotN=0;
    out.forEach(function(x){ if(x.n){avgScore+=x.avg;gotN++} });
    if(!gotN)return {items:out,n:n,gN:gN,fullItems:items,avgScore:0,avgP:0,paperFull:paperFull,effFull:0,dataItems:0};
    /* 若存在完全无数据的题目，按有效题的比例折算出对应的满分，避免把缺题当 0 分 */
    var effFull=paperFull*gotN/out.length;
    return {items:out,n:n,gN:gN,fullItems:items,
      avgScore:avgScore,avgP:(effFull?avgScore/effFull:0),paperFull:paperFull,
      effFull:effFull,dataItems:gotN};
  },

  /* ---- 知识板块掌握度 ---- */
  topicStat:function(eid,sub){
    var e=Store.exam(eid);var sub2=sub||this.mathSub();
    var items=(Store.data.examItems[eid]||[]);
    if(!items.length)return null;
    var isc=Store.data.itemScores[eid]||{};
    var topics={};
    items.forEach(function(it){
      var tp=it.topic||'未分类';
      topics[tp]=topics[tp]||{topic:tp,full:0,items:[]};
      topics[tp].full+=it.full;topics[tp].items.push(it);
    });
    var list=Object.keys(topics).map(function(k){
      var t=topics[k];
      var got=[],rates=[];
      Store.activeStudents().forEach(function(s){
        var is=isc[s.id];if(!is)return;
        var g=0,has=false;
        t.items.forEach(function(it){var v=is[it.no];if(v!=null&&v!==''){g+=Number(v);has=true}});
        if(has){got.push(g);rates.push(t.full?g/t.full:0)}
      });
      var rate=t.full?mean(got)/t.full:0;
      return {topic:k,full:t.full,n:got.length,rate:rate,pct:rate*100,sd:stdev(rates),items:t.items};
    }).sort(function(a,b){return a.rate-b.rate});
    /* 每个学生每个板块的得分率 */
    var stuRate={};
    Store.activeStudents().forEach(function(s){
      var is=isc[s.id]||{};
      stuRate[s.id]={};
      Object.keys(topics).forEach(function(k){
        var t=topics[k],g=0,has=false;
        t.items.forEach(function(it){var v=is[it.no];if(v!=null&&v!==''){g+=Number(v);has=true}});
        stuRate[s.id][k]=has?(t.full?g/t.full*100:0):null;
      });
    });
    return {list:list,topics:Object.keys(topics),stuRate:stuRate,sumFull:sum(items.map(function(it){return it.full}))};
  },
  /* 多次考试合并的知识板块掌握度（用于热力图与报告） */
  topicStatMulti:function(eids,sub){
    var agg={};
    eids.forEach(function(eid){
      var ts=Calc.topicStat(eid,sub);if(!ts)return;
      ts.list.forEach(function(t){
        agg[t.topic]=agg[t.topic]||{topic:t.topic,full:0,got:0};
        agg[t.topic].full+=t.full;
        agg[t.topic].got+=t.rate*t.full;
      });
    });
    var list=Object.keys(agg).map(function(k){
      var a=agg[k];
      return {topic:k,full:a.full,pct:a.full?a.got/a.full*100:0};
    });
    return list;
  },

  /* ---- 临界生 / 踩线生 ---- */
  critList:function(eid){
    var st=this.examStat(eid);if(!st||!st.rows.length)return {rows:[],gap:Store.data.meta.critGap,mode:''};
    var meta=Store.data.meta;
    var full=st.rows[0].full;
    var gap=meta.critGap||3;
    var rows=[];
    var useScore=meta.targetScore>0;
    var useRank=meta.targetRank>0;
    /* 近三次 Z 分波动 */
    var exs=this.sortedExams();
    var idx=-1;exs.forEach(function(e,i){if(e.id===eid)idx=i});
    var lastIds=exs.slice(Math.max(0,idx-2),idx+1).map(function(e){return e.id});
    st.rows.forEach(function(r){
      var rec={sid:r.sid,name:r.name,no:r.no,rank:r.rank,raw:r.raw,pct:r.pct,z:r.z,
        zs:[],zsd:0,gaps:{},reasons:[],tag:''};
      lastIds.forEach(function(id,ii){
        var s2=Calc.examStat(id);if(!s2)return;
        s2.rows.forEach(function(x){if(x.sid===r.sid)rec.zs.push(x.z)});
      });
      rec.zsd=stdev(rec.zs);
      var hit=false;
      if(useScore){
        var d=meta.targetScore-r.raw;              /* >0 还差多少 */
        rec.gaps.score=d;
        if(Math.abs(d)<=gap){hit=true;rec.reasons.push(d>=0?('距目标分仅差 '+fmtV(d)+' 分'):('超目标分 '+fmtV(-d)+' 分，需守住'))}
      }
      if(useRank){
        var dr=meta.targetRank-r.rank;
        rec.gaps.rank=dr;
        if(Math.abs(dr)<=Math.max(2,Math.round(st.n*0.08))){hit=true;rec.reasons.push(dr>=0?('距目标名次差 '+dr+' 名'):('已在目标名次内 '+(-dr)+' 名，需守住'))}
      }
      if(!useScore&&!useRank){
        /* 默认：总分贴近班级平均 gap 分内 */
        var d2=r.raw-st.avg;
        rec.gaps.score=d2;
        if(Math.abs(d2)<=gap){hit=true;rec.reasons.push('总分贴近班级平均（'+(d2>=0?'+':'')+fmtV(d2)+' 分）')}
      }
      /* 单科拖后腿：某科 Z < weakZ（只作为原因标注，不单独决定是否入选） */
      var weak=[],wz=(meta.weakZ!=null?meta.weakZ:-0.8);
      Object.keys(r.zsub||{}).forEach(function(s){if(r.zsub[s]<wz)weak.push(s+'（Z '+fmtV(r.zsub[s])+'）')});
      if(weak.length){rec.reasons.push('短板科：'+weak.join('、'));rec.weak=weak}
      if(hit)rows.push(rec);
    });
    rows.sort(function(a,b){
      var A=Math.abs(a.gaps.score==null?99:a.gaps.score),B=Math.abs(b.gaps.score==null?99:b.gaps.score);
      return A-B;
    });
    rows.forEach(function(r){
      if(r.zsd>=0.6)r.tag='波动大';
      else if(r.gaps.score!=null&&Math.abs(r.gaps.score)<=gap/2)r.tag='临界';
      else r.tag='关注';
    });
    return {rows:rows,gap:gap,avg:st.avg,full:full,
      mode:(useScore?'目标分':(useRank?'目标名次':'班级平均'))};
  },

  /* ---- 重点关注 / 预警 ---- */
  warnings:function(eid){
    var meta=Store.data.meta;
    var st=eid?this.examStat(eid):null;
    var prev=st?this.prevExam(st.exam.id):null;
    var pst=prev?this.examStat(prev.id):null;
    var out=[];
    Store.activeStudents().forEach(function(s){
      var w={sid:s.id,name:s.name,no:s.no,score:0,flags:[],drop:null,point:0,abs:0,miss:0,mistake:0};
      /* 1 成绩下滑 */
      if(st&&pst){
        var cur=null,old=null;
        st.rows.forEach(function(r){if(r.sid===s.id)cur=r});
        pst.rows.forEach(function(r){if(r.sid===s.id)old=r});
        if(cur&&old){
          w.drop=cur.rank-old.rank;                /* >0 名次退步 */
          if(w.drop>=meta.warnDrop){w.score+=Math.min(34,18+ (w.drop-meta.warnDrop)*1.6);w.flags.push('名次下滑 '+w.drop+' 名（第'+old.rank+'→第'+cur.rank+'）')}
          else if(w.drop>=Math.max(5,Math.round(meta.warnDrop*0.7))){w.score+=10;w.flags.push('名次略降 '+w.drop+' 名')}
          if(cur.z<-1){w.score+=12;w.flags.push('总分低于班级均值 1 个标准差（Z '+fmtV(cur.z)+'）')}
          if(cur.z-old.z<-0.8){w.score+=8;w.flags.push('标准分下降 '+fmtV(Math.abs(cur.z-old.z))+'，跌幅超过跨科可比幅度')}
        }
      }
      /* 2 积分转负 */
      var bal=0;Store.data.points.forEach(function(p){if(p.studentId===s.id)bal+=p.delta});
      w.point=bal;
      if(bal<=-20){w.score+=20;w.flags.push('常规/学习积分严重为负（'+bal+' 分）')}
      else if(bal<0){w.score+=8;w.flags.push('积分为负（'+bal+' 分）')}
      /* 3 缺勤 */
      var abs=Store.data.attendance.filter(function(a){return a.studentId===s.id});
      w.abs=abs.length;
      if(abs.length>=meta.warnAbsence+2){w.score+=16;w.flags.push('缺勤 '+abs.length+' 次')}
      else if(abs.length>=meta.warnAbsence){w.score+=7;w.flags.push('缺勤 '+abs.length+' 次')}
      /* 4 作业缺交 */
      var miss=0;Object.keys(Store.data.hwStatus).forEach(function(hid){
        var m=Store.data.hwStatus[hid];if(m&&m[s.id]===0)miss++;
      });
      w.miss=miss;
      if(miss>=meta.warnMissHw+2){w.score+=15;w.flags.push('作业缺交 '+miss+' 次')}
      else if(miss>=meta.warnMissHw){w.score+=6;w.flags.push('作业缺交 '+miss+' 次')}
      /* 5 错题未订正 */
      var mts=Store.data.mistakes.filter(function(m){return m.studentId===s.id});
      var open=mts.filter(function(m){return !m.fixed});
      var recur=mts.filter(function(m){return m.recur>0});
      w.mistake=open.length;
      if(open.length>=5){w.score+=12;w.flags.push('错题未订正 '+open.length+' 题')}
      else if(open.length>=3){w.score+=5;w.flags.push('错题未订正 '+open.length+' 题')}
      if(recur.length>=2){w.score+=8;w.flags.push('同一题重复出错 '+recur.length+' 次')}
      /* 6 单科严重拖后腿（Z < weakZ） */
      if(st){
        var wz=(meta.weakZ!=null?meta.weakZ:-0.8);
        var tRow=null;st.rows.forEach(function(r){if(r.sid===s.id)tRow=r});
        var weakList=[];
        Object.keys((tRow&&tRow.zsub)||{}).forEach(function(sub){if(tRow.zsub[sub]<wz)weakList.push(sub+'（Z '+fmtV(tRow.zsub[sub])+'）')});
        if(weakList.length){w.score+=6;w.flags.push('短板科：'+weakList.join('、'))}
      }
      w.score=Math.min(100,w.score);
      if(w.score>=12)out.push(w);
    });
    out.forEach(function(w){
      w.level=w.score>=40?'高':(w.score>=22?'中':'低');
    });
    out.sort(function(a,b){return b.score-a.score});
    return out;
  },

  /* ---- 错因分析 ---- */
  mistakesOf:function(sid){return Store.data.mistakes.filter(function(m){return !sid||m.studentId===sid})},
  errorDist:function(sid){
    var list=this.mistakesOf(sid);
    var d={};ERROR_TYPES.forEach(function(t){d[t.id]=0});
    list.forEach(function(m){d[m.type]=(d[m.type]||0)+1});
    return {dist:d,total:list.length};
  },
  /* 错因随时间迁移：按考试（或月份）分组 */
  errorTrend:function(sid,byMonth){
    var list=this.mistakesOf(sid);
    var groups={},order=[];
    if(byMonth){
      list.forEach(function(m){
        var k=(m.date||'').slice(0,7);if(!k)return;
        if(!groups[k]){groups[k]={label:k,counts:{},total:0};order.push(k)}
        groups[k].counts[m.type]=(groups[k].counts[m.type]||0)+1;groups[k].total++;
      });
      order.sort();
    } else {
      var exs=this.sortedExams();
      exs.forEach(function(e){
        groups[e.id]={label:e.name,counts:{},total:0,date:e.date};order.push(e.id);
      });
      list.forEach(function(m){
        var k=m.examId;
        if(k&&groups[k]){groups[k].counts[m.type]=(groups[k].counts[m.type]||0)+1;groups[k].total++}
      });
    }
    var series=ERROR_TYPES.map(function(t){
      return {id:t.id,label:t.label,color:t.color,data:order.map(function(k){return groups[k].counts[t.id]||0})};
    }).filter(function(s){return sum(s.data)>0});
    return {labels:order.map(function(k){return groups[k].label}),series:series,
      totals:order.map(function(k){return groups[k].total}),groups:groups};
  },
  /* 高频错因榜（全班） */
  errorRank:function(){
    var list=this.mistakesOf(null);
    var by={};ERROR_TYPES.forEach(function(t){by[t.id]={id:t.id,label:t.label,color:t.color,n:0,open:0}});
    list.forEach(function(m){
      var o=by[m.type];if(!o)return;o.n++;if(!m.fixed)o.open++;
    });
    return Object.keys(by).map(function(k){return by[k]}).sort(function(a,b){return b.n-a.n});
  },
  /* 高频错题板块榜 */
  topicWeakRank:function(sid){
    var list=this.mistakesOf(sid);
    var by={};
    list.forEach(function(m){
      var k=m.topic||'未分类';
      by[k]=by[k]||{topic:k,n:0,open:0};
      by[k].n++;if(!m.fixed)by[k].open++;
    });
    return Object.keys(by).map(function(k){return by[k]}).sort(function(a,b){return b.n-a.n});
  },
  /* 是否为重复错（同板块+同错因已出现过） */
  isRecur:function(rec){
    return Store.data.mistakes.filter(function(m){
      return m.studentId===rec.studentId&&m.topic===rec.topic&&m.type===rec.type&&m.id!==rec.id;
    }).length;
  },
  /* 学生画像摘要 */
  profile:function(sid){
    var meta=Store.data.meta,sub=this.mathSub();
    var tr=this.trend(sid,sub);
    var scored=tr.filter(function(x){return x.score!=null});
    var last=scored.length?scored[scored.length-1]:null;
    var first=scored.length?scored[0]:null;
    var delta=(last&&first)?last.score-first.score:null;
    var zds=[];
    this.sortedExams().forEach(function(e){
      var s2=Calc.examStat(e.id);if(!s2)return;
      s2.rows.forEach(function(r){if(r.sid===sid)zds.push(r.z)});
    });
    var bal=0;Store.data.points.forEach(function(p){if(p.studentId===sid)bal+=p.delta});
    var abs=Store.data.attendance.filter(function(a){return a.studentId===sid}).length;
    var miss=0;Object.keys(Store.data.hwStatus).forEach(function(hid){var m=Store.data.hwStatus[hid];if(m&&m[sid]===0)miss++});
    var er=this.errorDist(sid);
    var topErr=Object.keys(er.dist).map(function(k){return {id:k,label:ERROR_MAP[k]?ERROR_MAP[k].label:k,n:er.dist[k]}})
      .filter(function(x){return x.n}).sort(function(a,b){return b.n-a.n}).slice(0,3);
    return {trend:tr,last:last,first:first,delta:delta,zs:zds,zsd:stdev(zds),
      point:bal,absence:abs,missHw:miss,errors:er,topErrors:topErr,
      weakTopics:this.topicWeakRank(sid).slice(0,3),
      mathRank:last?this.rankOf(last.examId,sid):null};
  }
};

/* ---------------------------------------------------------------- 8. 图表 */
var PAL=['#1F4E9C','#D9A21B','#2F68C4','#1F9254','#C4703E','#8E6BC4','#5C6B7A','#D64550'];
var Chart={
  _setup:function(cv,hCss){
    var dpr=window.devicePixelRatio||1;
    var w=Math.max(120,(cv.parentElement?cv.parentElement.clientWidth:600)-2);
    cv.style.width=w+'px';cv.style.height=hCss+'px';cv.style.display='block';
    cv.width=Math.round(w*dpr);cv.height=Math.round(hCss*dpr);
    var ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,hCss);
    return {ctx:ctx,w:w,h:hCss};
  },
  _rr:function(ctx,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  },
  _frame:function(C,pad,max,steps,axisFmt){
    var ctx=C.ctx;
    ctx.strokeStyle='#E2E8F2';ctx.lineWidth=1;ctx.fillStyle='#8A94A6';
    ctx.font='11px system-ui,sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
    var iw=C.w-pad.l-pad.r,ih=C.h-pad.t-pad.b;
    for(var i=0;i<=steps;i++){
      var y=pad.t+ih-ih*i/steps;
      ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(C.w-pad.r,y);ctx.stroke();
      ctx.fillText(axisFmt?axisFmt(max*i/steps):fmtV(max*i/steps),pad.l-5,y);
    }
    return {iw:iw,ih:ih};
  },
  /* 竖向分组柱状图 */
  bar:function(cv,labels,series,opts){
    opts=opts||{};
    var C=this._setup(cv,opts.h||230),ctx=C.ctx;
    var max=opts.max||0;
    series.forEach(function(s){s.data.forEach(function(v){if(v>max)max=v})});
    max=max||10;
    if(!opts.noRound)max=Math.ceil(max/(opts.step||10))*(opts.step||10);
    var pad={l:38,r:8,t:14,b:30};
    var D=this._frame(C,pad,max,4,opts.axisFmt);
    var n=labels.length;if(!n)return;
    var gw=(D.iw)/n;
    var bw=Math.min(28,Math.max(6,(gw-10)/series.length-4));
    ctx.textAlign='center';
    var rotate=n>9;
    for(var k=0;k<n;k++){
      var cx=pad.l+gw*k+gw/2;
      ctx.fillStyle='#5C6B7A';ctx.font='11px system-ui,sans-serif';
      if(rotate){
        ctx.save();ctx.translate(cx,pad.t+D.ih+8);ctx.rotate(-Math.PI/4);
        ctx.textAlign='right';ctx.fillText(String(labels[k]).slice(0,7),0,0);ctx.restore();
      } else ctx.fillText(String(labels[k]).slice(0,6),cx,C.h-11);
      for(var s=0;s<series.length;s++){
        var v=Number(series[s].data[k])||0;
        var bh=D.ih*v/max;
        var bx=cx-((bw+3)*series.length)/2+s*(bw+3);
        ctx.fillStyle=series[s].color||PAL[s%PAL.length];
        Chart._rr(ctx,bx,pad.t+D.ih-bh,bw,Math.max(bh,1),3);ctx.fill();
        if(!opts.noValue&&series.length<=2&&gw>40&&v>0){
          ctx.fillStyle='#6B7689';ctx.font='10.5px system-ui,sans-serif';
          ctx.fillText(fmtV(v,opts.dec==null?1:opts.dec),bx+bw/2,pad.t+D.ih-bh-7);
        }
      }
    }
    if(series.length>1){
      ctx.textAlign='left';ctx.font='11px system-ui,sans-serif';
      var lx=pad.l;
      series.forEach(function(s){
        ctx.fillStyle=s.color||'#888';Chart._rr(ctx,lx,3,10,10,2);ctx.fill();
        ctx.fillStyle='#6B7689';ctx.fillText(s.name,lx+13,8);
        lx+=ctx.measureText(s.name).width+28;
      });
    }
  },
  /* 折线图（可多条） */
  line:function(cv,labels,series,opts){
    opts=opts||{};
    var C=this._setup(cv,opts.h||210),ctx=C.ctx;
    var all=[];
    series.forEach(function(s){s.data.forEach(function(v){if(v!=null&&!isNaN(v))all.push(Number(v))})});
    if(!all.length){ctx.fillStyle='#9AA4B4';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('暂无数据',C.w/2,C.h/2);return}
    var mn=opts.min!=null?opts.min:Math.min.apply(null,all),mx=opts.max!=null?opts.max:Math.max.apply(null,all);
    if(mx-mn<1){mx=mn+1}
    var padV=(mx-mn)*0.16;mn-=padV;mx+=padV;
    var pad={l:42,r:12,t:16,b:28};
    var D=this._frame(C,pad,mx,4,function(v){return fmtV(mn+(mx-mn)*((v-mx)/(mn-mx))==null?0:v,1)});
    /* 重新绘制带真实数值的 Y 轴刻度 */
    ctx.clearRect(0,0,C.w,C.h);
    ctx.strokeStyle='#E2E8F2';ctx.fillStyle='#8A94A6';ctx.font='11px system-ui,sans-serif';
    ctx.textAlign='right';ctx.textBaseline='middle';
    for(var i=0;i<=4;i++){
      var y=pad.t+D.ih-D.ih*i/4;
      ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(C.w-pad.r,y);ctx.stroke();
      ctx.fillText(fmtV(mn+(mx-mn)*i/4,1),pad.l-5,y);
    }
    var n=labels.length;
    var px=function(i){return pad.l+(n<=1?D.iw/2:D.iw*i/(n-1))};
    var py=function(v){return pad.t+D.ih-D.ih*(v-mn)/(mx-mn)};
    ctx.textAlign='center';ctx.fillStyle='#7A8598';ctx.font='11px system-ui,sans-serif';
    labels.forEach(function(l,i){
      if(n>10&&i%2)return;
      ctx.fillText(String(l).slice(0,7),px(i),C.h-10);
    });
    series.forEach(function(s,si){
      var col=s.color||PAL[si%PAL.length];
      ctx.strokeStyle=col;ctx.lineWidth=s.width||2;ctx.beginPath();
      var started=false;
      s.data.forEach(function(v,i){
        if(v==null||isNaN(v)){started=false;return}
        var x=px(i),y=py(Number(v));
        if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y);
      });
      ctx.stroke();
      ctx.fillStyle=col;
      s.data.forEach(function(v,i){
        if(v==null||isNaN(v))return;
        ctx.beginPath();ctx.arc(px(i),py(Number(v)),s.dot==null?3:s.dot,0,Math.PI*2);ctx.fill();
      });
      if(s.area&&s.data.length>1){
        ctx.globalAlpha=0.10;ctx.fillStyle=col;ctx.beginPath();
        var first=true;
        s.data.forEach(function(v,i){if(v==null)return;var x=px(i),y=py(Number(v));if(first){ctx.moveTo(x,pad.t+D.ih);ctx.lineTo(x,y);first=false}else ctx.lineTo(x,y)});
        ctx.lineTo(px(s.data.length-1),pad.t+D.ih);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
      }
    });
    if(series.length>1){
      ctx.textAlign='left';ctx.font='11px system-ui,sans-serif';var lx=pad.l;
      series.forEach(function(s){
        ctx.fillStyle=s.color||'#888';Chart._rr(ctx,lx,3,10,10,2);ctx.fill();
        ctx.fillStyle='#6B7689';ctx.fillText(s.name,lx+13,8);lx+=ctx.measureText(s.name).width+28;
      });
    }
  },
  /* 堆叠柱状图：matrix[类别][分段] */
  stack:function(cv,rowLabels,segNames,matrix,opts){
    opts=opts||{};
    var C=this._setup(cv,opts.h||240),ctx=C.ctx;
    var totals=matrix.map(function(r){return sum(r)});
    var max=Math.max.apply(null,totals.concat([1]));
    max=Math.ceil(max/5)*5;
    var pad={l:36,r:10,t:14,b:32};
    var D=this._frame(C,pad,max,4);
    var n=rowLabels.length;if(!n)return;
    var gw=D.iw/n,bw=Math.min(46,gw*0.62);
    ctx.textAlign='center';
    for(var k=0;k<n;k++){
      var cx=pad.l+gw*k+gw/2;
      var stackY=pad.t+D.ih;
      for(var s=0;s<segNames.length;s++){
        var v=matrix[k][s]||0;if(!v)continue;
        var bh=D.ih*v/max;
        stackY-=bh;
        ctx.fillStyle=segNames[s].color||PAL[s%PAL.length];
        ctx.fillRect(cx-bw/2,stackY,bw,bh);
      }
      if(totals[k]>0){ctx.fillStyle='#6B7689';ctx.font='10.5px system-ui,sans-serif';ctx.fillText(totals[k],cx,stackY-7)}
      ctx.fillStyle='#5C6B7A';ctx.font='11px system-ui,sans-serif';
      ctx.save();ctx.translate(cx,pad.t+D.ih+8);ctx.rotate(-Math.PI/4);ctx.textAlign='right';
      ctx.fillText(String(rowLabels[k]).slice(0,7),0,0);ctx.restore();
    }
    ctx.textAlign='left';ctx.font='11px system-ui,sans-serif';var lx=pad.l;
    segNames.forEach(function(s){
      ctx.fillStyle=s.color||'#888';Chart._rr(ctx,lx,3,10,10,2);ctx.fill();
      ctx.fillStyle='#6B7689';ctx.fillText(s.name,lx+13,8);lx+=ctx.measureText(s.name).width+26;
    });
  },
  /* 箱线图：多组分布 */
  box:function(cv,groups,opts){
    opts=opts||{};
    var C=this._setup(cv,opts.h||210),ctx=C.ctx;
    var all=[];groups.forEach(function(g){g.vals.forEach(function(v){all.push(v)})});
    if(!all.length)return;
    var mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);
    if(mx-mn<1)mx=mn+1;
    var padV=(mx-mn)*0.12;mn-=padV;mx+=padV;
    var pad={l:42,r:12,t:14,b:30};
    var D=this._frame(C,pad,mx,4,function(v){return fmtV(mn+(mx-mn)*((v-mx)/(mn-mx)),0)});
    ctx.clearRect(0,0,C.w,C.h);
    ctx.strokeStyle='#E2E8F2';ctx.fillStyle='#8A94A6';ctx.font='11px system-ui,sans-serif';
    ctx.textAlign='right';ctx.textBaseline='middle';
    for(var i=0;i<=4;i++){
      var y=pad.t+D.ih-D.ih*i/4;
      ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(C.w-pad.r,y);ctx.stroke();
      ctx.fillText(fmtV(mn+(mx-mn)*i/4,0),pad.l-5,y);
    }
    var py=function(v){return pad.t+D.ih-D.ih*(v-mn)/(mx-mn)};
    var n=groups.length,gw=D.iw/n,bw=Math.min(58,gw*0.5);
    groups.forEach(function(g,i){
      var cx=pad.l+gw*i+gw/2;
      var v=g.vals.slice().sort(function(a,b){return a-b});
      if(!v.length)return;
      var q1=quantile(v,0.25),q2=quantile(v,0.5),q3=quantile(v,0.75),lo=v[0],hi=v[v.length-1];
      var col=g.color||PAL[i%PAL.length];
      ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.6;
      ctx.beginPath();ctx.moveTo(cx,py(hi));ctx.lineTo(cx,py(lo));ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-9,py(hi));ctx.lineTo(cx+9,py(hi));ctx.moveTo(cx-9,py(lo));ctx.lineTo(cx+9,py(lo));ctx.stroke();
      ctx.globalAlpha=0.26;ctx.fillRect(cx-bw/2,py(q3),bw,Math.max(1,py(q1)-py(q3)));ctx.globalAlpha=1;
      ctx.strokeRect(cx-bw/2,py(q3),bw,Math.max(1,py(q1)-py(q3)));
      ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(cx-bw/2,py(q2));ctx.lineTo(cx+bw/2,py(q2));ctx.stroke();
      ctx.fillStyle='#5C6B7A';ctx.textAlign='center';ctx.font='11px system-ui,sans-serif';
      ctx.fillText(String(g.name).slice(0,8),cx,C.h-11);
    });
    ctx.textAlign='left';ctx.fillStyle='#8A94A6';ctx.font='10.5px system-ui,sans-serif';
    ctx.fillText('箱体=中间 50% · 横线=中位数 · 须=最高/最低',pad.l,10);
  },
  /* 雷达图：多组维度得分率（0-100） */
  radar:function(cv,labels,series,opts){
    opts=opts||{};
    var C=this._setup(cv,opts.h||250),ctx=C.ctx;
    var n=labels.length;if(n<3){ctx.fillStyle='#9AA4B4';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('维度太少，无法绘制雷达图',C.w/2,C.h/2);return}
    var cx=C.w/2,cy=C.h/2+4,R=Math.min(C.w,C.h)/2-34;
    var max=opts.max||100;
    ctx.strokeStyle='#E2E8F2';ctx.lineWidth=1;
    for(var ring=1;ring<=4;ring++){
      ctx.beginPath();
      for(var i=0;i<n;i++){
        var a=-Math.PI/2+i*2*Math.PI/n;
        var r=R*ring/4;
        var x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.closePath();ctx.stroke();
    }
    ctx.fillStyle='#8A94A6';ctx.font='10.5px system-ui,sans-serif';
    for(var i2=0;i2<n;i2++){
      var a2=-Math.PI/2+i2*2*Math.PI/n;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a2)*R,cy+Math.sin(a2)*R);ctx.stroke();
      var lx=cx+Math.cos(a2)*(R+15),ly=cy+Math.sin(a2)*(R+15);
      ctx.textAlign=Math.abs(Math.cos(a2))<0.25?'center':(Math.cos(a2)>0?'left':'right');
      ctx.textBaseline=Math.sin(a2)>0.4?'top':(Math.sin(a2)<-0.4?'bottom':'middle');
      ctx.fillText(String(labels[i2]).slice(0,6),lx,ly);
    }
    series.forEach(function(s,si){
      var col=s.color||PAL[si%PAL.length];
      ctx.beginPath();
      s.data.forEach(function(v,i){
        var a=-Math.PI/2+i*2*Math.PI/n;
        var r=R*clamp(Number(v)||0,0,max)/max;
        var x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      });
      ctx.closePath();
      ctx.globalAlpha=0.16;ctx.fillStyle=col;ctx.fill();ctx.globalAlpha=1;
      ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.stroke();
      s.data.forEach(function(v,i){
        var a=-Math.PI/2+i*2*Math.PI/n;
        var r=R*clamp(Number(v)||0,0,max)/max;
        ctx.fillStyle=col;ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,2.6,0,Math.PI*2);ctx.fill();
      });
    });
    if(series.length>1){
      ctx.textAlign='left';ctx.font='11px system-ui,sans-serif';var lx2=8;
      series.forEach(function(s){
        ctx.fillStyle=s.color||'#888';Chart._rr(ctx,lx2,3,10,10,2);ctx.fill();
        ctx.fillStyle='#6B7689';ctx.fillText(s.name,lx2+13,8);lx2+=ctx.measureText(s.name).width+26;
      });
    }
  }
};
/* 得分率 → 颜色（红→黄→绿） */
function heatColor(pct,alpha){
  if(pct==null)return '#EEF1F6';
  var p=clamp(pct,0,100)/100;
  var r,g,b;
  if(p<0.5){var t=p/0.5;r=214+(217-214)*t;g=69+(162-69)*t;b=80+(27-80)*t}
  else{var t2=(p-0.5)/0.5;r=217+(31-217)*t2;g=162+(146-162)*t2;b=27+(84-27)*t2}
  if(alpha!=null)return 'rgba('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+','+alpha+')';
  return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
}
function heatTextColor(pct){return (pct!=null&&(pct<38||pct>78))?'#fff':'#22303F'}
function heatLegend(){
  var out='<div class="legend"><span>得分率</span>';
  for(var i=0;i<=10;i++){
    out+='<i style="background:'+heatColor(i*10)+'"></i>';
  }
  return out+'<span>0%</span><span style="margin-left:6px">100%</span></div>';
}
