function bindEntry(){
  var eid=UI.examId,e=Store.exam(eid);
  function recalc(sid){
    if(EntryMode==='subject'){
      var t=Calc.totalOf(eid,sid);
      var el=$('#tot_'+sid);if(el)el.textContent=t?fmtV(t.raw):'—';
    } else {
      var items=Store.data.examItems[eid]||[];
      var isc=(Store.data.itemScores[eid]||{})[sid]||{};
      var v=0,any=false;
      items.forEach(function(it){var x=isc[it.no];if(x!=null&&x!==''){v+=Number(x);any=true}});
      var el2=$('#tot_'+sid);if(el2)el2.textContent=any?fmtV(v):'—';
    }
  }
  var inputs=$$('.ent');
  inputs.forEach(function(inp){
    var sid=inp.getAttribute('data-sid'),k=inp.getAttribute('data-k');
    var parts=k.split('|'),kind=parts[0],key=parts.slice(1).join('|');
    var v=Calc.scoreOf(eid,sid,key);
    if(kind==='i'){
      var isc=(Store.data.itemScores[eid]||{})[sid]||{};
      var x=isc[key];inp.value=(x==null||x==='')?'':x;
    } else inp.value=(v==null?'':v);
    recalc(sid);
    inp.addEventListener('input',function(){
      var raw=inp.value.trim();
      var val=raw===''?null:Number(raw);
      var full=kind==='i'?(function(){var it=null;(Store.data.examItems[eid]||[]).forEach(function(z){if(String(z.no)===String(key))it=z});return it?it.full:100})():Calc.subFull(e,key);
      if(val!=null){
        if(val<0)val=0;
        if(val>full){val=full;inp.value=full;toast('超过满分 '+full+'，已按满分记','warn')}
      }
      if(kind==='s'){
        Store.data.scores[eid]=Store.data.scores[eid]||{};
        Store.data.scores[eid][sid]=Store.data.scores[eid][sid]||{};
        if(val==null)delete Store.data.scores[eid][sid][key];
        else Store.data.scores[eid][sid][key]=val;
      } else {
        Store.data.itemScores[eid]=Store.data.itemScores[eid]||{};
        Store.data.itemScores[eid][sid]=Store.data.itemScores[eid][sid]||{};
        if(val==null)delete Store.data.itemScores[eid][sid][key];
        else Store.data.itemScores[eid][sid][key]=val;
        /* 数学总分同步为题号和 */
        var items=Store.data.examItems[eid]||[];
        var isc=Store.data.itemScores[eid][sid],tt=0,any=false;
        items.forEach(function(it){var z=isc[it.no];if(z!=null&&z!==''){tt+=Number(z);any=true}});
        Store.data.scores[eid]=Store.data.scores[eid]||{};
        Store.data.scores[eid][sid]=Store.data.scores[eid][sid]||{};
        if(any)Store.data.scores[eid][sid][Store.data.meta.mathSubject]=tt;
      }
      recalc(sid);
      Store.save();
      var el=$('#entrySaved');if(el){el.textContent='已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
    });
    /* 方向键 / 回车 跳到上下格 */
    inp.addEventListener('keydown',function(ev){
      var idx=inputs.indexOf(inp),cols=0;
      if(ev.key==='Enter'||ev.key==='ArrowDown'||ev.key==='ArrowUp'){
        ev.preventDefault();
        var perRow=(EntryMode==='subject')?e.subjects.length:((Store.data.examItems[eid]||[]).length);
        var jump=(ev.key==='ArrowUp')?-perRow:perRow;
        var ni=inputs[idx+jump];
        if(ni){ni.focus();ni.select()}
      }
    });
    /* Excel 整块粘贴 */
    inp.addEventListener('paste',function(ev){
      var txt=(ev.clipboardData||window.clipboardData).getData('text');
      if(!txt||txt.indexOf('\t')<0&&txt.indexOf('\n')<0)return;
      ev.preventDefault();
      var grid=parseTable(txt);
      if(!grid.length)return;
      var startIdx=inputs.indexOf(inp);
      var perRow=(EntryMode==='subject')?e.subjects.length:((Store.data.examItems[eid]||[]).length);
      var startRow=Math.floor(startIdx/(perRow+1)),startCol=startIdx%(perRow+1);
      var filled=0;
      grid.forEach(function(row,ri){
        row.forEach(function(cell,ci){
          var ti=(startRow+ri)*(perRow+1)+(startCol+ci);
          var t=inputs[ti];
          if(!t)return;
          if(startCol+ci>perRow)return;   /* 不覆盖姓名列 */
          var n=normNum(cell);
          t.value=(n==null?'':n);
          t.dispatchEvent(new Event('input',{bubbles:true}));
          filled++;
        });
      });
      toast('已粘贴 '+grid.length+' 行 × '+filled+' 个分数','ok');
    });
  });
  updateEntryStat();
}
function updateEntryStat(){
  var eid=UI.examId,e=Store.exam(eid);

  Store.data.students.forEach(function(s){

function parseItems(text){
  var grid=parseTable(text);
  var out=[];
  grid.forEach(function(r){
    var no=normNum(r[0]),full=normNum(r[1]);
    if(no==null||full==null)return;
    out.push({no:no,full:full,topic:String(r[2]||'').trim()||'未分类',desc:String(r[3]||'').trim()});
  });
  out.sort(function(a,b){return a.no-b.no});
  return out;
}
function renderItemPreview(){
  var ta=$('#itemTa');if(!ta)return;
  var items=parseItems(ta.value);
  var s=sum(items.map(function(x){return x.full}));
  var mf=Store.data.meta.fullMarks[Store.data.meta.mathSubject]||120;
  var el=$('#itemSum');
  if(el){
    el.innerHTML='共 '+items.length+' 题，合计 <b>'+s+'</b> 分 / 满分 '+mf+' 分 '
      +(s===mf?'<span class="chip ok">与满分一致 ✓</span>':(s>mf?'<span class="chip bad">超出满分</span>':'<span class="chip warn">还差 '+(mf-s)+' 分</span>'));
  }
  var box=$('#itemPrev');
  if(!box)return;
  if(!items.length){box.innerHTML='';return}
  var topics={};items.forEach(function(it){topics[it.topic]=(topics[it.topic]||0)+it.full});
  box.innerHTML='<div class="tbl-wrap" style="max-height:260px"><table class="tbl"><thead><tr><th class="num">题号</th><th class="num">满分</th><th>知识板块</th><th>说明</th></tr></thead><tbody>'

    +'</tbody></table></div>'

function fillItemsFromTopics(){
  var topics=Store.data.meta.topics;
  if(!topics.length){toast('「设置 → 知识板块」里还没有板块','warn');return}
  var mf=Store.data.meta.fullMarks[Store.data.meta.mathSubject]||120;
  var n=Math.min(topics.length,6);
  var per=Math.floor(mf/n/2)*2;
  var lines=[];
  for(var i=0;i<n;i++)lines.push((i+1)+','+per+','+topics[i]+',');

  h+='<td style="background:'+heatColor(classAvg,0.95)+';color:'+heatTextColor(classAvg)+';font-weight:800;border-top:2px solid var(--pri)">'+(classAvg==null?'—':Math.round(classAvg))+'</td></tr>';
  h+='</tbody></table></div>'+heatLegend()
    +'<p class="hint">点板块名可看该板块的题目明细。颜色越绿掌握越好，越红越需要讲评。</p></div>';

  /* 板块排行（弱→强） */

    +'<div class="card"><h3>📉 最需要讲评的板块</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>板块</th><th class="num">满分</th><th class="num">得分率</th><th class="num">学生间差异</th><th>状态</th></tr></thead><tbody>';
  ts.list.slice(0,8).forEach(function(t){
    var st2=t.pct>=80?'优势':(t.pct>=65?'合格':(t.pct>=50?'薄弱':'严重薄弱'));
    var cls=t.pct>=80?'ok':(t.pct>=65?'gray':(t.pct>=50?'warn':'bad'));
    h+='<tr><td class="bold">'+esc(t.topic)+'</td><td class="num muted">'+t.full+'</td><td class="num">'+fmtV(t.pct)+'%</td>'
      +'<td class="num muted">σ '+fmtV(t.sd*100)+'</td><td><span class="chip '+cls+'">'+st2+'</span></td></tr>';
  });
  h+='</tbody></table></div></div>';
  /* 个体短板 Top */

    ts.list.forEach(function(t,i){
      var v=r.vals[i];
      if(v!=null&&v<60)weakPer.push({name:r.s.name,sid:r.s.id,topic:t.topic,v:v});

        +'<span class="chip gray">'+esc(w.topic)+'</span>'
        +'<span class="right bold" style="color:'+heatColor(w.v)+'">'+fmtV(w.v)+'%</span></div>';
    });
    h+='</div>';
    if(weakPer.length>40)h+='<p class="hint">共 '+weakPer.length+' 条，仅显示最弱的 40 条。</p>';
  }
  h+='</div></div>';
  box.innerHTML=h;
}

function renderCompute(){
  var box=$('#anaBody');

  var h='<div class="card"><h3>➗ 计算能力训练 <span class="sub">每日 10 题计时 + 正确率曲线 + 错式归类</span></h3>'

    +'长期就能看出计算能力是在提速还是在倒退。</p>'
    +'<div class="row"><button class="btn" onclick="computeAdd()">＋ 记录一次训练</button>'
    +(sessions.length?'<button class="btn ghost" onclick="exportComputeCsv()">导出 CSV</button>':'')
    +'<button class="btn ghost right" onclick="openCalcTimer()">⏱ 打开计时器</button></div></div>';
  if(!sessions.length){
    box.innerHTML=h+'<div class="card empty">还没有训练记录。</div>';return;
  }
  sessions.sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1});
  var accs=sessions.map(function(s){return s.total?(s.total-s.wrong)/s.total*100:0});
  var times=sessions.map(function(s){return s.seconds==null?null:s.seconds});
  h+='<div class="grid g4" style="margin-bottom:14px">'
    +'<div class="stat"><div class="k">训练次数</div><div class="v">'+sessions.length+'</div><div class="d">最近 '+esc(sessions[sessions.length-1].date||'')+'</div></div>'
    +'<div class="stat"><div class="k">平均正确率</div><div class="v pri">'+fmtV(mean(accs))+'%</div><div class="d">满分率 '+(accs.filter(function(a){return a>=100}).length)+' 次</div></div>'
    +'<div class="stat"><div class="k">平均用时</div><div class="v">'+(times.filter(function(t){return t!=null}).length?fmtV(mean(times.filter(function(t){return t!=null})))+' 秒':'—')+'</div><div class="d">10 题</div></div>'
    +'<div class="stat"><div class="k">主要错式类型</div><div class="v" style="font-size:15px">'+esc(computeTopType(sessions))+'</div><div class="d">出现最多</div></div>'
    +'</div>'
    +'<div class="card"><h3>正确率与用时趋势</h3><div class="chart-box"><canvas id="cmpChart"></canvas></div></div>'
    +'<div class="card"><h3>错式类型分布</h3><div class="chart-box"><canvas id="cmpErr"></canvas></div></div>'
    +'<div class="card"><h3>训练记录</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>日期</th><th class="num">题数</th><th class="num">错题数</th><th class="num">正确率</th><th class="num">用时</th><th>错式类型</th><th>备注</th><th></th></tr></thead><tbody>';
  sessions.slice().reverse().forEach(function(s){
    var acc=s.total?(s.total-s.wrong)/s.total*100:0;
    h+='<tr><td>'+esc(s.date||'')+'</td><td class="num">'+s.total+'</td><td class="num">'+s.wrong+'</td>'
      +'<td class="num bold" style="color:'+heatColor(acc)+'">'+fmtV(acc)+'%</td>'
      +'<td class="num">'+(s.seconds==null?'—':s.seconds+' 秒')+'</td>'
      +'<td class="small">'+esc((s.types||[]).join('、')||'—')+'</td>'
      +'<td class="small muted">'+esc(s.note||'')+'</td>'
      +'<td><button class="btn xs danger" onclick="computeDel(\''+s.id+'\')">删</button></td></tr>';
  });
  h+='</tbody></table></div></div>';
  box.innerHTML=h;
  var cv=$('#cmpChart');
  if(cv){
    Chart.line(cv,sessions.map(function(s){return (s.date||'').slice(5)}),
      [{name:'正确率 %',color:PAL[0],data:accs,area:true},
       {name:'用时（秒）',color:'#D9A21B',data:times}],{h:230});
  }
  var ce=$('#cmpErr');
  if(ce){
    var by={};
    sessions.forEach(function(s){(s.types||[]).forEach(function(t){by[t]=(by[t]||0)+1})});
    var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
    if(!keys.length){ce.parentNode.innerHTML='<p class="muted small">还没有记录错式类型。</p>'}
    else Chart.bar(ce,keys,[{name:'次数',color:'#C4703E',data:keys.map(function(k){return by[k]})}],{h:200,step:1});
  }
}
function computeTopType(sessions){
  var by={};
  sessions.forEach(function(s){(s.types||[]).forEach(function(t){by[t]=(by[t]||0)+1})});
  var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  return keys.length?keys[0]:'—';
}

function openCalcTimer(){
  var m=modal({title:'⏱ 计算训练计时器',foot:'<button class="btn ghost" data-close>关闭</button>',
    body:'<div style="text-align:center"><div id="ctDisp" style="font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--pri)">0:00</div>'
      +'<div class="row" style="justify-content:center;margin-top:10px">'
      +'<button class="btn" id="ctStart">▶ 开始</button><button class="btn ghost" id="ctReset">↺ 重置</button></div>'
      +'<p class="hint">建议：10 道计算题，目标 5 分钟内全对。全屏投影效果更好。</p></div>'});
  var t0=null,iv=null,running=false;
  function paint(){
    var s=t0?Math.floor((Date.now()-t0)/1000):0;
    m.querySelector('#ctDisp').textContent=Math.floor(s/60)+':'+pad2(s%60);
  }
  m.querySelector('#ctStart').onclick=function(){
    if(running){clearInterval(iv);running=false;this.textContent='▶ 继续'}
    else{ if(!t0)t0=Date.now(); running=true;this.textContent='⏸ 暂停';
      iv=setInterval(paint,200); }
  };
  m.querySelector('#ctReset').onclick=function(){
    clearInterval(iv);running=false;t0=null;paint();m.querySelector('#ctStart').textContent='▶ 开始';
  };
  m.addEventListener('click',function(e){if(e.target.hasAttribute&&e.target.hasAttribute('data-close'))clearInterval(iv)});
  paint();
}

      recur:normNum(m.querySelector('#mkRecur').value)||0

    obj.recur=Math.max(obj.recur,Calc.isRecur(Object.assign({id:rec?rec.id:''},obj)));

    Store.log(rec?'修改错题':'录入错题',(Store.stu(sid)||{}).name+' · '+(ERROR_MAP[type]||{}).label);
    Store.save();closeModal(m);App.render();toast(rec?'已保存':'已录入','ok');
  };

function mistakeBulk(){

    body:'<p class="hint" style="margin-top:0">从 Excel 复制粘贴，或写一行一条。列顺序：<b>姓名, 日期, 来源, 题号, 知识板块, 错因, 满分, 得分, 简述</b>。'
      +'只有「姓名」和「错因」是必需的。错因可写中文（如「计算失误」）或全拼 id（如 calc）。</p>'
      +'<textarea id="bkTa" rows="10" style="font-family:ui-monospace,Consolas,monospace;font-size:12.5px" placeholder="张小明,2026-09-08,考试,18,二次函数,分类讨论不全,10,3,忘记讨论 k=0"></textarea>'
      +'<div class="row" style="margin-top:8px"><button class="btn xs ghost" onclick="document.getElementById(\'bkTa\').value=document.getElementById(\'bkDemo\').value">填入示例</button></div>'
      +'<textarea id="bkDemo" style="display:none">'+esc('张小明,2026-09-08,考试,18,二次函数,分类讨论不全,10,3,忘记讨论 k=0\n李小红,2026-09-08,考试,15,有理数,计算失误,8,5,符号写错\n王大力,2026-09-05,作业,3,整式的加减,去括号,6,2,括号前是负号没变号')+'</textarea>'
      +'<div id="bkPrev" style="margin-top:10px"></div>'});
  m.querySelector('#bkImport').onclick=function(){

    if(!grid.length){toast('没有解析到数据','warn');return}
    var ok=0,fail=[];
    grid.forEach(function(r){
      var name=String(r[0]||'').trim();
      var s=Store.byName(name);
      if(!s){fail.push(name||'（空）');return}

        full:normNum(r[6]),got:normNum(r[7]),brief:String(r[8]||'').trim(),note:'',recur:0,fixed:false,ts:nowTs()};
      rec.recur=Calc.isRecur(rec);
      Store.data.mistakes.push(rec);
      if(rec.topic!=='未分类'&&Store.data.meta.topics.indexOf(rec.topic)<0)Store.data.meta.topics.push(rec.topic);
      ok++;
    });
    Store.log('批量导入错题',ok+' 条');
    Store.save();closeModal(m);
    toast('已导入 '+ok+' 条'+(fail.length?('，'+fail.length+' 条没匹配到学生：'+fail.slice(0,5).join('、')):''),fail.length?'warn':'ok');

function renderMistakeAnalysis(){
  var box=$('#misBody');
  var all=Store.data.mistakes;
  var sid=UI.misAnaStu||'';
  var er=Calc.errorDist(sid||null);
  var trend=Calc.errorTrend(sid||null,UI.misByMonth);
  var weak=Calc.topicWeakRank(sid||null);
  var h='<div class="row" style="margin-bottom:12px">'
    +'<span class="muted small">分析对象</span>'
    +'<select id="anaStu"><option value="">全班</option>'+Store.data.students.map(function(s){
      return '<option value="'+s.id+'"'+(sid===s.id?' selected':'')+'>'+s.no+' 号 '+esc(s.name)+'</option>'}).join('')+'</select>'
    +'<div class="seg"><button class="'+(!UI.misByMonth?'on':'')+'" onclick="UI.misByMonth=false;App.render()">按考试</button>'
    +'<button class="'+(UI.misByMonth?'on':'')+'" onclick="UI.misByMonth=true;App.render()">按月份</button></div>'
    +'<button class="btn sm ghost right" onclick="exportMistakesCsv(\''+(sid||'')+'\')">导出 CSV</button>'
    +'</div>';
  if(!all.length){
    box.innerHTML=h+'<div class="card empty">还没有错题记录。</div>';return;
  }
  h+='<div class="grid g4" style="margin-bottom:14px">'
    +'<div class="stat"><div class="k">错题总数</div><div class="v">'+er.total+'</div><div class="d">'+(sid?'该生':'全班')+'</div></div>'
    +'<div class="stat"><div class="k">未订正</div><div class="v '+(all.filter(function(m){return !m.fixed&&(!sid||m.studentId===sid)}).length?'neg':'')+'">'+all.filter(function(m){return !m.fixed&&(!sid||m.studentId===sid)}).length+'</div><div class="d">需要跟进</div></div>'
    +'<div class="stat"><div class="k">重复出错</div><div class="v gold">'+all.filter(function(m){return m.recur>0&&(!sid||m.studentId===sid)}).length+'</div><div class="d">同一题多次错</div></div>'
    +'<div class="stat"><div class="k">头号错因</div><div class="v" style="font-size:16px">';
  var topE=Object.keys(er.dist).map(function(k){return {id:k,n:er.dist[k]}}).sort(function(a,b){return b.n-a.n})[0];
  h+=(topE&&topE.n?esc((ERROR_MAP[topE.id]||{}).label)+' '+topE.n+' 次':'—')+'</div><div class="d">占比 '+(er.total&&topE?Math.round(topE.n/er.total*100):0)+'%</div></div>'
    +'</div>';

  h+='<div class="grid g2">'
    +'<div class="card"><h3>🔍 错因分布</h3><div class="chart-box"><canvas id="errDist"></canvas></div></div>'
    +'<div class="card"><h3>📈 错因随时间迁移 <span class="sub">这才是错题本的价值所在</span></h3>'
    +'<div class="chart-box"><canvas id="errTrend"></canvas></div>'
    +'<p class="hint">看的是<b>结构变化</b>而不是总数：如果「概念不清」在减少而「计算失误」在增加，'
    +'说明理解已经过关，剩下的是熟练度问题——这是很典型的进步信号。</p></div>'
    +'</div>';

  h+='<div class="card"><h3>🧩 高频错题板块</h3>';
  if(!weak.length)h+='<p class="muted small">暂无数据。</p>';
  else{
    h+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>知识板块</th><th class="num">错题数</th><th class="num">未订正</th><th style="width:38%">占比</th></tr></thead><tbody>';
    var mx=weak[0].n||1;
    weak.forEach(function(w){
      h+='<tr><td class="bold">'+esc(w.topic)+'</td><td class="num">'+w.n+'</td><td class="num">'+w.open+'</td>'
        +'<td><div style="background:var(--line);border-radius:5px;height:9px;overflow:hidden"><div style="height:100%;width:'+Math.round(w.n/mx*100)+'%;background:var(--bad)"></div></div></td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';

  /* 学生错因矩阵 */
  if(!sid){
    h+='<div class="card"><h3>👥 学生 × 错因 一览 <span class="sub">找谁的问题最集中</span></h3>'
      +'<div class="heat-scroll"><table class="heat"><thead><tr><th>姓名</th>'
      +ERROR_TYPES.map(function(t){return '<th class="top">'+esc(t.label)+'</th>'}).join('')
      +'<th class="top">合计</th></tr></thead><tbody>';
    var byStu={};
    all.forEach(function(m){
      byStu[m.studentId]=byStu[m.studentId]||{};
      byStu[m.studentId][m.type]=(byStu[m.studentId][m.type]||0)+1;
    });
    var rows=Store.data.students.filter(function(s){return byStu[s.id]}).map(function(s){
      var t=0;ERROR_TYPES.forEach(function(e){t+=byStu[s.id][e.id]||0});
      return {s:s,d:byStu[s.id],t:t};
    }).sort(function(a,b){return b.t-a.t});
    var maxT=rows.length?rows[0].t:1;
    rows.forEach(function(r){
      h+='<tr><td class="name">'+esc(r.s.name)+'</td>';
      ERROR_TYPES.forEach(function(e){
        var v=r.d[e.id]||0;
        h+='<td style="background:'+(v?heatColor(100-v/Math.max(1,maxT)*60,0.85):'#F4F6FA')+';color:'+(v>maxT*0.6?'#fff':'#22303F')+'" title="'+esc(e.label)+'">'+(v||'')+'</td>';
      });
      h+='<td style="background:'+heatColor(100-r.t/Math.max(1,maxT)*60,0.9)+';color:#fff;font-weight:700">'+r.t+'</td></tr>';
    });
    h+='</tbody></table></div>'
      +'<p class="hint">数字是错题条数，颜色越深表示该生在这个错因上问题越集中。</p></div>';
  }
  box.innerHTML=h;
  if(sid){
    var sd=Store.stu(sid);
    if(sd)h=h.replace('<div class="row" style="margin-bottom:12px">','<div class="row" style="margin-bottom:12px">');
  }
  var sel=$('#anaStu');
  if(sel)sel.onchange=function(){UI.misAnaStu=sel.value;App.render()};
  var cv=$('#errDist');
  if(cv){
    var items=ERROR_TYPES.map(function(t){return {label:t.label,color:t.color,n:er.dist[t.id]||0}}).filter(function(x){return x.n});
    if(!items.length)cv.parentNode.innerHTML='<p class="muted small">暂无数据。</p>';
    else Chart.bar(cv,items.map(function(x){return x.label}),
      [{name:'错题次数',color:'#D64550',data:items.map(function(x){return x.n})}],{h:230,step:1});
  }
  var ct=$('#errTrend');
  if(ct){
    if(!trend.labels.length||!trend.series.length)ct.parentNode.innerHTML='<p class="muted small">记录太少，还画不出迁移曲线。</p>';
    else Chart.line(ct,trend.labels,trend.series,{h:240,min:0});
  }
}

function rankDelta(cur,prev){
  if(cur==null||prev==null)return '—';
  var d=prev-cur;
  if(d===0)return '<span class="muted">—</span>';
  return '<span class="'+(d>0?'arrow-up':'arrow-down')+'">'+(d>0?'↑'+d:'↓'+(-d))+'</span>';
}

function removeStudent(id){
  var s=Store.stu(id);if(!s)return;
  confirmBox('删除学生「'+esc(s.name)+'」？<br><span class="small">其成绩、题号得分、积分、缺勤、作业状态、错题记录都会一并删除，无法恢复。</span>',function(){
    Store.data.students=Store.data.students.filter(function(x){return x.id!==id});
    Object.keys(Store.data.scores).forEach(function(eid){if(Store.data.scores[eid])delete Store.data.scores[eid][id]});
    Object.keys(Store.data.itemScores).forEach(function(eid){if(Store.data.itemScores[eid])delete Store.data.itemScores[eid][id]});
    Store.data.points=Store.data.points.filter(function(p){return p.studentId!==id});
    Store.data.attendance=Store.data.attendance.filter(function(a){return a.studentId!==id});
    Store.data.mistakes=Store.data.mistakes.filter(function(m){return m.studentId!==id});
    Object.keys(Store.data.hwStatus).forEach(function(hid){delete Store.data.hwStatus[hid][id]});
    delete Store.data.comments[id];
    Store.log('删除学生',s.name);
    Store.save();var mk=$('.mask');if(mk)mk.remove();var dr=$('.drawer');if(dr)dr.remove();
    App.render();toast('已删除','ok');
  },'删除');
}
function exportStudentsCsv(){
  var rows=[['学号','姓名','性别','出生日期','家长电话','标签','备注']];
  Store.data.students.forEach(function(s){
    rows.push([s.no,s.name,s.gender||'',s.birthday||'',s.phone||'',(s.tags||[]).join('、'),s.note||'']);
  });
  download('学生名单.csv','\uFEFF'+toCsv(rows),'text/csv;charset=utf-8');
}
/* ---- 学生档案抽屉 ---- */
function openStudent(id){
  var s=Store.stu(id);if(!s)return;
  var mask=document.createElement('div');mask.className='mask';mask.style.padding='0';
  mask.style.justifyContent='flex-end';
  var dr=document.createElement('div');
  dr.setAttribute('style','background:#fff;width:min(760px,96vw);height:100%;overflow:auto;box-shadow:var(--shadow-lg)');
  dr.innerHTML='<div class="modal-h" style="position:sticky;top:0;background:#fff;z-index:5">'
    +'<span>👤 '+esc(s.name)+' <span class="muted small">'+s.no+' 号 '+(s.gender?('· '+s.gender):'')+'</span></span>'
    +'<button class="btn xs ghost" onclick="Reports.student(\''+id+'\')">📄 生成报告</button>'
    +'<span class="x">✕</span></div><div id="stuDrw" style="padding:15px 16px 40px"></div>';
  mask.appendChild(dr);document.body.appendChild(mask);
  function close(){mask.remove()}
  mask.addEventListener('click',function(e){if(e.target===mask)close()});
  dr.querySelector('.x').onclick=close;
  renderStudentBody(id,dr);
}
function renderStudentBody(id,dr){
  var s=Store.stu(id);if(!s)return;
  var meta=Store.data.meta,msub=meta.mathSubject;
  var prof=Calc.profile(id);
  var warns=Calc.warnings(UI.examId);
  var w=null;warns.forEach(function(x){if(x.sid===id)w=x});
  var h='<div class="sec" style="border-top:none;padding-top:0;margin-top:0"><h4>📇 基本信息</h4>'
    +'<div class="grid g2" style="gap:8px">'
    +'<label class="small">姓名<input type="text" id="eName" value="'+esc(s.name)+'"></label>'
    +'<label class="small">学号<input type="number" id="eNo" value="'+s.no+'"></label>'
    +'<label class="small">性别<select id="eG"><option value=""'+(s.gender?'':' selected')+'>—</option><option'+(s.gender==='男'?' selected':'')+'>男</option><option'+(s.gender==='女'?' selected':'')+'>女</option></select></label>'
    +'<label class="small">出生日期<input type="date" id="eB" value="'+esc(s.birthday||'')+'"></label>'
    +'<label class="small">家长电话<input type="text" id="eP" value="'+esc(s.phone||'')+'"></label>'
    +'<label class="small">备用电话<input type="text" id="eP2" value="'+esc(s.phone2||'')+'"></label>'
    +'<label class="small">家长姓名<input type="text" id="ePa" value="'+esc(s.parent||'')+'"></label>'
    +'<label class="small">标签（逗号分隔）<input type="text" id="eT" value="'+esc((s.tags||[]).join(','))+'"></label>'
    +'<label class="small" style="grid-column:1/-1">备注<textarea id="eN" rows="2">'+esc(s.note||'')+'</textarea></label>'
    +'</div><div class="row" style="margin-top:10px">'
    +'<button class="btn sm" onclick="stuSave(\''+id+'\')">💾 保存</button>'
    +'<button class="btn sm ghost" onclick="stuToggleActive(\''+id+'\')">'+(s.active===false?'恢复在班':'标记为已转出/休学')+'</button>'
    +'<button class="btn sm bad ghost right" onclick="removeStudent(\''+id+'\')">删除学生</button></div></div>';

  if(w){
    h+='<div class="sec"><h4>🚨 重点关注（风险分 '+w.score+' · '+w.level+'）</h4>'
      +'<ul class="small" style="margin:0;padding-left:18px;line-height:1.9">'+w.flags.map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul></div>';
  }
  /* 成绩趋势 */
  h+='<div class="sec"><h4>📈 '+esc(msub)+' 成绩趋势</h4>';
  var tr=prof.trend.filter(function(x){return x.score!=null});
  if(tr.length){
    h+='<div class="chart-box"><canvas id="stuTrend"></canvas></div>'
      +'<div class="row" style="margin-top:8px">'+prof.trend.map(function(x){
        if(x.score==null)return '<span class="chip gray">'+esc(x.name)+'：缺考</span>';
        return '<span class="chip">'+esc(x.name)+'：<b>'+fmtV(x.score)+'</b>'+(x.rank?('（第'+x.rank+'名）'):'')+'</span>';
      }).join('')+'</div>';
    if(prof.delta!=null)h+='<p class="hint">从第一次到最后一次变化：<b style="color:'+(prof.delta>=0?'var(--bad)':'var(--ok)')+'">'+(prof.delta>=0?'+':'')+fmtV(prof.delta)+' 分</b>'
      +'；成绩 Z 分波动 σ='+fmtV(prof.zsd)+(prof.zsd>=0.6?'（波动较大，注意稳定性）':'（较稳定）')+'</p>';
  } else h+='<p class="muted small">还没有 '+esc(msub)+' 成绩。</p>';
  h+='</div>';
  /* 板块短板 */
  h+='<div class="sec"><h4>🧩 知识板块掌握度</h4>';
  var eid=UI.examId;
  var ts=eid?Calc.topicStat(eid):null;
  if(ts){
    var rows=ts.list.map(function(t){
      return {topic:t.topic,pct:ts.stuRate[id]?ts.stuRate[id][t.topic]:null,cls:t.pct};
    }).filter(function(r){return r.pct!=null});
    if(rows.length){
      h+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>板块</th><th class="num">本人</th><th class="num">班级</th><th class="num">差值</th><th>状态</th></tr></thead><tbody>';
      rows.sort(function(a,b){return a.pct-b.pct}).forEach(function(r){
        var d=r.pct-r.cls;
        h+='<tr><td class="bold">'+esc(r.topic)+'</td><td class="num" style="color:'+heatColor(r.pct)+';font-weight:700">'+fmtV(r.pct)+'%</td>'
          +'<td class="num muted">'+fmtV(r.cls)+'%</td>'
          +'<td class="num" style="color:'+(d>=0?'var(--ok)':'var(--bad)')+'">'+(d>=0?'+':'')+fmtV(d)+'</td>'
          +'<td>'+(r.pct<60?'<span class="chip bad">需补</span>':(r.pct<80?'<span class="chip warn">待巩固</span>':'<span class="chip ok">已掌握</span>'))+'</td></tr>';
      });
      h+='</tbody></table></div>';
    } else h+='<p class="muted small">这场考试没有该生的题号得分。</p>';
  } else h+='<p class="muted small">当前考试还没有题号表，无法分析板块。</p>';
  h+='</div>';
  /* 错题与错因 */
  h+='<div class="sec"><h4>🔍 错题与错因</h4>';
  if(!prof.errors.total)h+='<p class="muted small">还没有该生的错题记录。<button class="btn xs ghost" onclick="mistakeAdd()">＋ 录入</button></p>';
  else{
    h+='<div class="grid g2"><div class="chart-box"><canvas id="stuErr"></canvas></div>'
      +'<div><p class="small" style="margin:0 0 6px">主要错因：</p><ul class="small" style="margin:0;padding-left:18px;line-height:1.9">'
      +prof.topErrors.map(function(x){return '<li>'+esc(x.label)+' <b>'+x.n+'</b> 次</li>'}).join('')
      +'</ul>';
    if(prof.weakTopics.length)h+='<p class="small" style="margin:10px 0 6px">错题集中板块：</p><ul class="small" style="margin:0;padding-left:18px;line-height:1.9">'
      +prof.weakTopics.map(function(x){return '<li>'+esc(x.topic)+' <b>'+x.n+'</b> 题</li>'}).join('')+'</ul>';
    h+='<div class="row" style="margin-top:10px"><button class="btn xs ghost" onclick="mistakeAdd()">＋ 录入错题</button>'
      +'<button class="btn xs ghost" onclick="exportMistakesCsv(\''+id+'\')">导出该生错题</button></div></div></div>';
    var recent=Store.data.mistakes.filter(function(m){return m.studentId===id}).sort(function(a,b){return (a.date||'')<(b.date||'')?1:-1}).slice(0,10);
    h+='<div style="margin-top:10px;max-height:240px;overflow:auto">'
      +recent.map(function(m){
        var et=ERROR_MAP[m.type]||{label:m.type,color:'#888'};
        return '<div class="flow-item"><span class="muted small" style="width:74px">'+esc(m.date||'')+'</span>'
          +'<span class="small" style="flex:1">'+esc(m.brief||m.topic||'')+'</span>'
          +'<span class="chip" style="background:'+et.color+'22;color:'+et.color+'">'+esc(et.label)+'</span>'
          +'<span class="small '+(m.fixed?'muted':'')+'" style="width:56px;text-align:right">'+(m.fixed?'已订正':'未订正')+'</span></div>';
      }).join('')+'</div>';
  }
  h+='</div>';
  /* 积分 / 缺勤 / 作业 */
  h+='<div class="sec"><h4>📌 常规表现</h4><div class="grid g4">'
    +'<div class="stat"><div class="k">当前积分</div><div class="v '+(prof.point<0?'neg':'')+'">'+prof.point+'</div><div class="d">学习+常规合计</div></div>'
    +'<div class="stat"><div class="k">缺勤次数</div><div class="v">'+prof.absence+'</div><div class="d">含病事假与迟到</div></div>'
    +'<div class="stat"><div class="k">作业缺交</div><div class="v '+(prof.missHw?'neg':'')+'">'+prof.missHw+'</div><div class="d">累计</div></div>'
    +'<div class="stat"><div class="k">错题未订正</div><div class="v '+(prof.mistake?'neg':'')+'">'+prof.mistake+'</div><div class="d">共 '+prof.errors.total+' 条错题</div></div>'
    +'</div>'
    +'<div class="row" style="margin-top:10px"><button class="btn xs ghost" onclick="pointAdd(\''+id+'\')">＋ 加减分</button>'
    +'<button class="btn xs ghost" onclick="absenceAdd(\''+id+'\')">＋ 登记缺勤</button>'
    +'<button class="btn xs ghost" onclick="UI.go(\'points\')">积分与考勤总表</button></div>'
    +'<div style="margin-top:10px;max-height:190px;overflow:auto">'
    +Store.data.points.filter(function(p){return p.studentId===id}).slice(0,12).map(function(p){
      return '<div class="flow-item"><span class="muted small" style="width:96px">'+fmtTime(p.ts)+'</span>'
        +'<span class="small" style="flex:1">'+esc(p.reason)+'</span>'
        +'<span class="'+(p.delta>=0?'arrow-up':'arrow-down')+'">'+(p.delta>0?'+':'')+p.delta+'</span></div>';
    }).join('')||'<p class="muted small">暂无积分记录</p>'
    +'</div></div>';
  /* 评语 */
  h+='<div class="sec"><h4>✍️ 期末评语 / 报告寄语</h4>'
    +'<textarea id="cmText" rows="4" placeholder="写在这里的评语会出现在学生成长报告里">'+esc(Store.data.comments[id]||'')+'</textarea>'
    +'<div class="row" style="margin-top:8px"><button class="btn sm" onclick="saveComment(\''+id+'\')">💾 保存评语</button>'
    +'<button class="btn sm ghost" onclick="suggestComment(\''+id+'\')">给我一个草稿</button></div></div>';
  dr.querySelector('#stuDrw').innerHTML=h;
  /* 图表 */
  var cv=dr.querySelector('#stuTrend');
  if(cv){
    var labs=prof.trend.map(function(x){return x.name});
    Chart.line(cv,labs,[{name:msub+' 得分',color:PAL[0],data:prof.trend.map(function(x){return x.score}),area:true}],{h:190,min:0,max:Store.data.meta.fullMarks[msub]||120});
  }
  var ce=dr.querySelector('#stuErr');
  if(ce&&prof.errors.total){
    var items=ERROR_TYPES.map(function(t){return {label:t.label,color:t.color,n:prof.errors.dist[t.id]||0}}).filter(function(x){return x.n});
    Chart.bar(ce,items.map(function(x){return x.label}),[{name:'次数',color:'#D64550',data:items.map(function(x){return x.n})}],{h:200,step:1});
  }
}
function stuSave(id){
  var s=Store.stu(id);if(!s)return;
  var dr=$('#stuDrw');if(!dr)return;
  var g=function(x){var e=dr.querySelector(x);return e?e.value:''};
  s.name=g('#eName').trim()||s.name;
  s.no=normNum(g('#eNo'))||s.no;
  s.gender=g('#eG');
  s.birthday=g('#eB');
  s.phone=g('#eP').trim();
  s.phone2=g('#eP2').trim();
  s.parent=g('#ePa').trim();
  s.tags=g('#eT').split(/[,，、]/).map(function(x){return x.trim()}).filter(Boolean);
  s.note=g('#eN');
  Store.data.students.sort(function(a,b){return a.no-b.no});
  Store.log('修改学生',s.name);
  Store.save();toast('已保存','ok');
}
function stuToggleActive(id){
  var s=Store.stu(id);if(!s)return;
  s.active=(s.active===false);
  Store.log(s.active?'恢复在班':'标记离班',s.name);
  Store.save();
  var dr=$('.mask');if(dr)dr.remove();
  App.render();
}
function saveComment(id){
  var dr=$('#stuDrw');if(!dr)return;
  var el=dr.querySelector('#cmText');if(!el)return;
  Store.data.comments[id]=el.value;
  Store.save();toast('评语已保存','ok');
}
function suggestComment(id){
  var s=Store.stu(id);if(!s)return;
  var prof=Calc.profile(id);
  var dr=$('#stuDrw');if(!dr)return;
  var el=dr.querySelector('#cmText');if(!el)return;
  var parts=[];
  var name=s.name;
  var mathTxt='';
  if(prof.last&&prof.first){
    if(prof.delta>=8)mathTxt='这学期数学进步明显，从 '+fmtV(prof.first.score)+' 分提升到 '+fmtV(prof.last.score)+' 分';
    else if(prof.delta<=-8)mathTxt='数学成绩近期有所回落（'+fmtV(prof.first.score)+'→'+fmtV(prof.last.score)+' 分）';
    else mathTxt='数学成绩保持在 '+fmtV(prof.last.score)+' 分左右，比较稳定';
  } else mathTxt='数学学习态度端正';
  parts.push(name+'同学：'+mathTxt+'。');
  if(prof.zsd>=0.6)parts.push('成绩起伏较大，建议把注意力放在“稳定发挥”上，先把会做的题做对。');
  if(prof.topErrors.length){
    var e1=prof.topErrors[0];
    parts.push('从错题看，主要问题在「'+e1.label+'」，建议针对性练习同类题，把错因消灭在平时。');
  }
  if(prof.weakTopics.length)parts.push('知识板块里「'+prof.weakTopics[0].topic+'」还需要加强，可以先用课本例题把基础打牢。');
  if(prof.point>=30)parts.push('常规表现积极，班级事务参与度高，值得肯定。');
  else if(prof.point<0)parts.push('常规方面还需注意纪律与细节，希望你下阶段能对自己的行为多一分要求。');
  if(prof.missHw>=3)parts.push('作业有缺交情况，请按时完成并交给老师检查。');
  if(prof.absence>=3)parts.push('本学期请假次数偏多，希望调整作息、保持出勤。');
  parts.push('老师相信你能做得更好，加油！');
  el.value=parts.join('');
  toast('已生成草稿，请按实际情况修改','ok');
}
function pointAdd(sid){
  var m=modal({title:'加减分',body:
    '<div class="row" style="margin-bottom:10px"><label class="small">分值<input type="number" id="ptD" value="5" style="width:74px"></label>'
    +'<label class="small" style="flex:1">事由<input type="text" id="ptR" list="ptReasons" placeholder="如：课堂发言" style="width:100%">'
    +'<datalist id="ptReasons">'+STUDY_POINTS.concat(BOARDING_POINTS).map(function(p){return '<option value="'+esc(p.label)+'">'}).join('')+'</datalist></label></div>'
    +'<div class="row">'+STUDY_POINTS.slice(0,4).concat(BOARDING_POINTS.slice(0,4)).map(function(p){
      return '<span class="chip" style="cursor:pointer" onclick="document.getElementById(\'ptR\').value=\''+esc(p.label)+'\';document.getElementById(\'ptD\').value='+p.delta+'">'+esc(p.label)+' '+(p.delta>0?'+':'')+p.delta+'</span>';
    }).join('')+'</div>',
    foot:'<button class="btn ghost" data-close>取消</button><button class="btn" id="ptOk">记录</button>'});
  m.querySelector('#ptOk').onclick=function(){
    var d=normNum(m.querySelector('#ptD').value)||0;
    var r=m.querySelector('#ptR').value.trim()||'手动调整';
    Store.data.points.unshift({id:uid('P'),studentId:sid,delta:d,reason:r,cat:'manual',ts:nowTs()});
    Store.log('加减分',(Store.stu(sid)||{}).name+' '+r+' '+(d>0?'+':'')+d);
    Store.save();closeModal(m);
    var dr=$('#stuDrw');if(dr)renderStudentBody(sid,dr.closest('.mask'));
    toast('已记录','ok');
  };
}
function absenceAdd(sid){
  var m=modal({title:'登记缺勤',body:
    '<div class="row" style="margin-bottom:10px"><label class="small">日期<input type="date" id="abD" value="'+todayStr()+'" style="width:150px"></label>'
    +'<label class="small">类型<select id="abT"><option>病假</option><option>事假</option><option>迟到</option><option>早退</option><option>旷课</option></select></label></div>'
    +'<div class="small muted" style="margin-bottom:6px">时段</div>'
    +'<div class="row">'+SESSION_PRESETS.map(function(x){
      return '<label class="ck chip"><input type="checkbox" class="abS" value="'+esc(x)+'">'+esc(x)+'</label>'}).join('')+'</div>'
    +'<label class="small" style="display:block;margin-top:10px">原因备注<input type="text" id="abR" style="width:100%"></label>',
    foot:'<button class="btn ghost" data-close>取消</button><button class="btn" id="abOk">登记</button>'});
  m.querySelector('#abOk').onclick=function(){
    Store.data.attendance.unshift({id:uid('A'),studentId:sid,date:m.querySelector('#abD').value||todayStr(),
      type:m.querySelector('#abT').value,sessions:$$('.abS:checked',m).map(function(x){return x.value}),
      reason:m.querySelector('#abR').value.trim(),ts:nowTs()});
    Store.log('登记缺勤',(Store.stu(sid)||{}).name);
    Store.save();closeModal(m);
    var dr=$('#stuDrw');if(dr)renderStudentBody(sid,dr.closest('.mask'));
    toast('已登记','ok');
  };
}

/* ================= 视图：积分与考勤 ================= */
function viewPoints(){
  var tabs=[['points','🏆 积分'],['absence','📅 考勤'],['homework','📋 作业']];
  return '<div class="tabs">'+tabs.map(function(t){
    return '<div class="tab'+(UI.ptTab===t[0]?' on':'')+'" onclick="UI.ptTab=\''+t[0]+'\';App.render()">'+t[1]+'</div>';
  }).join('')+'</div><div id="ptBody"></div>';
}
function afterPoints(){
  var box=$('#ptBody');if(!box)return;
  if(UI.ptTab==='absence')renderAbsence();
  else if(UI.ptTab==='homework')renderHomework();
  else renderPointsBoard();
}
function renderPointsBoard(){
  var box=$('#ptBody');
  var pts=Store.data.points;
  var byStu={};
  Store.activeStudents().forEach(function(s){byStu[s.id]={s:s,v:0,pos:0,neg:0}});
  pts.forEach(function(p){
    var o=byStu[p.studentId];if(!o)return;
    o.v+=p.delta;if(p.delta>0)o.pos+=p.delta;else o.neg+=p.delta;
  });
  var rows=Object.keys(byStu).map(function(k){return byStu[k]}).sort(function(a,b){return b.v-a.v});
  var h='<div class="card"><h3>🏆 积分榜 <span class="sub">共 '+pts.length+' 条流水</span>'
    +'<button class="btn sm right" onclick="pointBulk()">＋ 批量加减分</button>'
    +'<button class="btn sm ghost right" onclick="exportPointsCsv()">导出 CSV</button></h3>'
    +'<p class="hint" style="margin-top:0">积分用于「重点关注」的综合判断，不是用来公示排名的。<b>请勿在班级或家长群公布积分榜</b>。</p>';
  if(!pts.length){box.innerHTML=h+'<div class="empty">还没有积分记录。<br><br><button class="btn" onclick="pointBulk()">＋ 批量加减分</button></div></div>';return}

function renderHomework(){
  var box=$('#ptBody');

  var h='<div class="card"><h3>📋 作业登记 <span class="sub">共 '+list.length+' 次</span>'
    +'<button class="btn sm right" onclick="hwAdd()">＋ 新建作业</button>'
    +'<button class="btn sm ghost right" onclick="exportHomeworkCsv()">导出 CSV</button></h3>'
    +'<p class="hint" style="margin-top:0">作业只记「交没交、优不优」，用来支撑重点关注的缺交统计；数学的错题请记到「错题本」里，不要混在这里。</p>';
  if(!list.length){box.innerHTML=h+'<div class="empty">还没有作业记录。</div></div>';return}
  h+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>布置日期</th><th>学科</th><th>作业</th><th class="num">已交</th><th class="num">优秀</th><th class="num">缺交</th><th>完成率</th><th></th></tr></thead><tbody>';
  var n=Store.activeStudents().length||1;
  list.forEach(function(hw){
    var m=Store.data.hwStatus[hw.id]||{};
    var done=0,exc=0,miss=0;
    Store.activeStudents().forEach(function(s){
      var v=m[s.id];
      if(v===1||v===2)done++;
      if(v===2)exc++;
      if(v===0)miss++;
    });
    var rate=Math.round(done/n*100);
    h+='<tr><td>'+esc(hw.assigned||'')+'</td><td><span class="chip">'+esc(hw.subject)+'</span></td>'
      +'<td class="bold">'+esc(hw.title)+'</td>'
      +'<td class="num">'+done+'</td><td class="num gold">'+exc+'</td>'
      +'<td class="num" style="color:'+(miss?'var(--bad)':'inherit')+'">'+miss+'</td>'
      +'<td style="width:130px"><div style="background:var(--line);border-radius:5px;height:9px;overflow:hidden"><div style="height:100%;width:'+rate+'%;background:'+heatColor(rate)+'"></div></div><span class="small muted">'+rate+'%</span></td>'
      +'<td style="white-space:nowrap"><button class="btn xs" onclick="hwMark(\''+hw.id+'\')">登记</button>'
      +'<button class="btn xs danger" onclick="hwDel(\''+hw.id+'\')">删</button></td></tr>';
  });
  h+='</tbody></table></div>';
  /* 缺交排行 */
  var missBy={};
  Store.activeStudents().forEach(function(s){missBy[s.id]=0});
  list.forEach(function(hw){
    var m=Store.data.hwStatus[hw.id]||{};
    Store.activeStudents().forEach(function(s){if(m[s.id]===0)missBy[s.id]++});
  });
  var ranked=Store.activeStudents().map(function(s){return {s:s,n:missBy[s.id]}}).filter(function(x){return x.n})
    .sort(function(a,b){return b.n-a.n});
  if(ranked.length){
    h+='<div class="card" style="margin-top:14px"><h3>缺交排行</h3><div class="row">';
    ranked.forEach(function(x){
      h+='<span class="chip '+(x.n>=3?'bad':(x.n>=2?'warn':'gray'))+'" style="cursor:pointer" onclick="openStudent(\''+x.s.id+'\')">'+esc(x.s.name)+' '+x.n+' 次</span>';
    });
    h+='</div></div>';
  }
  box.innerHTML=h;
}

function hwMark(id){
  var hw=null;Store.data.homework.forEach(function(x){if(x.id===id)hw=x});
  if(!hw)return;
  var m=modal({title:'作业登记 · '+esc(hw.title),wide:true,foot:'<button class="btn" data-close>完成</button>',
    body:'<div class="row" style="margin-bottom:10px"><span class="hint" style="margin:0">点一下循环切换：<b>已交 → 优秀 → 缺交</b>。默认全部已交，只需点出缺交和优秀的。</span>'
      +'<button class="btn sm ghost right" id="hwAllIn">全部标记已交</button></div>'
      +'<div id="hwMarkBox"></div>'});
  function paint(){
    var box=m.querySelector('#hwMarkBox');
    var h='<div style="max-height:56vh;overflow:auto">';
    Store.activeStudents().forEach(function(s){
      var v=Store.data.hwStatus[id][s.id];
      var label=v===2?'优秀':(v===1?'已交':'缺交');
      var cls=v===2?'gold':(v===1?'ok':'bad');
      h+='<div class="flow-item"><span class="muted" style="width:36px">'+s.no+'</span>'
        +'<span class="bold" style="flex:1">'+esc(s.name)+'</span>'
        +'<button class="btn xs '+cls+'" data-sid="'+s.id+'" style="min-width:64px;justify-content:center">'+label+'</button></div>';
    });
    h+='</div>';
    box.innerHTML=h;
    $$('button[data-sid]',box).forEach(function(b){
      b.onclick=function(){
        var sid=b.getAttribute('data-sid');
        var cur=Store.data.hwStatus[id][sid];
        Store.data.hwStatus[id][sid]=(cur===1?2:(cur===2?0:1));
        Store.save();paint();
      };
    });
  }
  m.querySelector('#hwAllIn').onclick=function(){
    Store.activeStudents().forEach(function(s){Store.data.hwStatus[id][s.id]=1});
    Store.save();paint();
  };
  paint();
}

function saveClass(){
  var m=Store.data.meta;
  m.className=$('#stName').value.trim()||m.className;
  m.teacher=$('#stTeacher').value.trim();
  var g=$('#stGrade').value;
  m.year=normNum($('#stYear').value)||m.year;
  m.term=Number($('#stTerm').value)||1;
  m.boarding=$('#stBoarding').value==='1';
  if(g!==m.grade){
    var old=m.grade;m.grade=g;
    saveClassRaw();
    confirmBox('年级已从「'+old+'」改为「'+g+'」。要顺便套用这个年级的默认科目表和知识板块清单吗？<br><span class="small">（选「不套用」就保留现在的科目设置）</span>',function(){
      applyPreset(g);
      applyTopics(g==='跨年级'?'七年级':g);
      toast('已套用默认科目与板块','ok');
    },'套用默认');
    App.render();
    toast('年级已改为 '+g,'ok');
    return;
  }
  saveClassRaw();App.render();toast('已保存','ok');
}
function saveClassRaw(){
  var m=Store.data.meta;
  $('#tbTitle').textContent=m.className;
  $('#tbSub').textContent=Store.subTitle();
  Store.log('保存班级信息',m.className);
  Store.save();
}
function applyPreset(g){
  var p=SUBJECT_PRESETS[g]||SUBJECT_PRESETS['七年级'];
  var m=Store.data.meta;
  m.subjects=p.subjects.slice();
  m.fullMarks=JSON.parse(JSON.stringify(p.full));
  if(m.subjects.indexOf(m.mathSubject)<0)m.mathSubject='数学';
  Store.data.exams.forEach(function(e){
    e.subjects=e.subjects.filter(function(s){return m.subjects.indexOf(s)>=0});
    m.subjects.forEach(function(s){if(e.fullMarks[s]==null)e.fullMarks[s]=m.fullMarks[s]});
  });
  Store.log('套用科目预设',g);
  Store.save();App.render();toast('已套用「'+g+'」的科目与满分','ok');
}
function saveSubjects(){
  var m=Store.data.meta;
  $$('.subFull').forEach(function(inp){
    var sub=inp.getAttribute('data-sub');
    var v=normNum(inp.value);
    if(v!=null&&v>0)m.fullMarks[sub]=v;
  });
  Store.log('修改科目满分','');
  Store.save();App.render();toast('已保存','ok');
}
function setMathSubject(sub){
  Store.data.meta.mathSubject=sub;
  Store.log('切换任教科目',sub);

function changePin(){
  var m=modal({title:'修改密码',body:
    '<p class="hint" style="margin-top:0">修改密码会立即用新密钥重新加密并保存全部数据。请牢记新密码。</p>'
    +'<label class="small" style="display:block;margin-bottom:8px">当前密码<input type="password" id="cpOld" style="width:100%"></label>'
    +'<label class="small" style="display:block;margin-bottom:8px">新密码（至少 4 位）<input type="password" id="cpNew" style="width:100%"></label>'
    +'<label class="small" style="display:block">再输一次<input type="password" id="cpNew2" style="width:100%"></label>'
    +'<div class="small" id="cpErr" style="color:var(--bad);min-height:18px;margin-top:6px"></div>',
    foot:'<button class="btn ghost" data-close>取消</button><button class="btn" id="cpOk">修改</button>'});
  m.querySelector('#cpOk').onclick=function(){
    var oldP=m.querySelector('#cpOld').value,newP=m.querySelector('#cpNew').value,new2=m.querySelector('#cpNew2').value;
    var err=m.querySelector('#cpErr');
    var chk=pinStrength(newP);
    if(!chk.ok){err.textContent=chk.msg;return}
    if(newP!==new2){err.textContent='两次输入的新密码不一致';return}
    Sec.digest(oldP+Sec.pepper).then(function(h){
      return Sec.idbGet(Sec.SALT).then(function(rec){
        if(!rec||rec.hash!==h){err.textContent='当前密码不正确';return Promise.reject('bad')}
        var salt=randomSalt();
        return Sec.idbSet(Sec.SALT,{salt:salt,hash:null}).then(function(){
          return Sec.init(newP,salt);
        }).then(function(){
          return Sec.digest(newP+Sec.pepper);
        }).then(function(h2){
          return Sec.idbSet(Sec.SALT,{salt:salt,hash:h2});
        }).then(function(){
          return Sec.encrypt(Store.data);
        }).then(function(enc){
          return Sec.idbSet(Sec.KEY,enc);
        }).then(function(){
          closeModal(m);toast('密码已修改，数据已用新密钥重新加密','ok');
          Store.log('修改密码','');
        });
      });
    }).catch(function(e){if(e!=='bad')err.textContent='修改失败：'+e});
  };
}

var Reports={
  open:function(html){
    $('#reportBody').innerHTML=html;
    $('#reportHost').classList.add('on');
    document.body.style.overflow='hidden';
  },
  close:function(){
    $('#reportHost').classList.remove('on');
    document.body.style.overflow='';
    $('#reportBody').innerHTML='';
  },
  line_svg:function(labels,values,opts){
    opts=opts||{};
    var w=opts.w||700,h=opts.h||170,pad={l:38,r:12,t:14,b:24};
    var vals=values.filter(function(v){return v!=null&&!isNaN(v)});
    if(!vals.length)return '<p style="color:#7A8698;font-size:11px">暂无数据</p>';
    var mn=opts.min!=null?opts.min:Math.min.apply(null,vals),mx=opts.max!=null?opts.max:Math.max.apply(null,vals);
    if(mx-mn<1)mx=mn+1;
    var pad2v=(mx-mn)*0.14;mn-=pad2v;mx+=pad2v;
    var iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
    var px=function(i){return pad.l+(labels.length<=1?iw/2:iw*i/(labels.length-1))};
    var py=function(v){return pad.t+ih-ih*(v-mn)/(mx-mn)};
    var s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="max-width:100%">';
    for(var i=0;i<=4;i++){
      var y=pad.t+ih-ih*i/4;
      s+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(w-pad.r)+'" y2="'+y+'" stroke="#E2E8F2" stroke-width="1"/>';
      s+='<text x="'+(pad.l-4)+'" y="'+(y+3)+'" font-size="9" fill="#8A94A6" text-anchor="end">'+fmtV(mn+(mx-mn)*i/4,1)+'</text>';
    }
    var dPath='',started=false;
    values.forEach(function(v,i){
      if(v==null||isNaN(v)){started=false;return}
      dPath+=(started?' L':' M')+px(i).toFixed(1)+' '+py(Number(v)).toFixed(1);
      started=true;
    });
    s+='<path d="'+dPath+'" fill="none" stroke="#1F4E9C" stroke-width="2"/>';
    values.forEach(function(v,i){
      if(v==null||isNaN(v))return;
      s+='<circle cx="'+px(i).toFixed(1)+'" cy="'+py(Number(v)).toFixed(1)+'" r="3" fill="#1F4E9C"/>';
      s+='<text x="'+px(i).toFixed(1)+'" y="'+(py(Number(v))-7).toFixed(1)+'" font-size="9" fill="#1F4E9C" text-anchor="middle">'+fmtV(v)+'</text>';
    });
    labels.forEach(function(l,i){
      if(labels.length>8&&i%2)return;
      s+='<text x="'+px(i).toFixed(1)+'" y="'+(h-8)+'" font-size="9" fill="#7A8698" text-anchor="middle">'+esc(String(l).slice(0,6))+'</text>';
    });
    return s+'</svg>';
  },
  bar_svg:function(labels,values,opts){
    opts=opts||{};
    var w=opts.w||700,h=opts.h||150,pad={l:38,r:12,t:14,b:26};
    var mx=Math.max.apply(null,values.concat([1]));
    var iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
    var gw=iw/(labels.length||1),bw=Math.min(44,gw*0.62);
    var s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" style="max-width:100%">';
    labels.forEach(function(l,i){
      var v=values[i]||0;
      var bh=ih*v/mx,cx=pad.l+gw*i+gw/2;
      var col=opts.colorFn?opts.colorFn(v):'#1F4E9C';

      s+='<text x="'+cx.toFixed(1)+'" y="'+(pad.t+ih-bh-4).toFixed(1)+'" font-size="9" fill="#6B7689" text-anchor="middle">'+fmtV(v,opts.dec==null?1:opts.dec)+'</text>';

    h+='<h2>一、班级总体概况 <span class="rt">总分按得分率计，跨科可比</span></h2>'
      +'<table><thead><tr><th>指标</th><th>数值</th><th>指标</th><th>数值</th></tr></thead><tbody>'
      +'<tr><td>总分平均</td><td class="num">'+fmtV(st.avg)+'（得分率 '+fmtV(st.avgPct)+'%）</td><td>标准差</td><td class="num">'+fmtV(st.sd)+'</td></tr>'

      +'<tr><td>低分率（&lt;'+(m.lowRate*100)+'%）</td><td class="num">'+Math.round(st.low*100)+'%</td><td>中位数（得分率）</td><td class="num">'+fmtV(st.midPct)+'%</td></tr>'
      +'<tr><td>四分位 Q1 / Q3</td><td class="num">'+fmtV(st.q1Pct)+'% / '+fmtV(st.q3Pct)+'%</td><td>最高 / 最低（得分率）</td><td class="num">'+fmtV(st.maxPct)+'% / '+fmtV(st.minPct)+'%</td></tr>'
      +(pst?'<tr><td>较上次（'+esc(prev.name)+'）</td><td class="num">'+((st.avgPct-pst.avgPct>=0?'+':'')+fmtV(st.avgPct-pst.avgPct))+' 个百分点</td>'
        +'<td>及格率变化</td><td class="num">'+((st.pass-pst.pass>=0?'+':'')+Math.round((st.pass-pst.pass)*100))+' 个百分点</td></tr>':'')
      +'</tbody></table>';

    h+='<h2>二、各科成绩统计</h2>'
      +'<table><thead><tr><th>科目</th><th>满分</th><th>平均</th><th>得分率</th><th>及格率</th><th>优秀率</th><th>低分率</th><th>标准差</th><th>最高</th><th>最低</th></tr></thead><tbody>';

      var s=st.subj[sub];if(!s)return;
      h+='<tr'+(sub===msub?' style="background:#F5F8FC"':'')+'><td>'+esc(sub)+(sub===msub?' ★':'')+'</td>'
        +'<td class="num">'+s.full+'</td><td class="num">'+fmtV(s.avg)+'</td><td class="num">'+fmtV(s.avgPct)+'%</td>'
        +'<td class="num">'+Math.round(s.pass*100)+'%</td><td class="num">'+Math.round(s.good*100)+'%</td>'
        +'<td class="num">'+Math.round(s.low*100)+'%</td><td class="num">'+fmtV(s.sd)+'</td>'
        +'<td class="num">'+fmtV(s.max)+'</td><td class="num">'+fmtV(s.min)+'</td></tr>';
    });
    h+='</tbody></table><p style="font-size:10.5px;color:#7A8698;margin:4px 0">★ = 本人任教科目。</p>';

    if(ms){
      h+='<h2>三、'+esc(msub)+' 分数段分布</h2>'
        +this.bar_svg(ms.segments.map(function(x){return x.label}),ms.segments.map(function(x){return x.n}),
          {h:150,dec:0})
        +segmentTable(st,msub).replace('<table>','<table style="margin-top:6px">');
    }

    if(ist){
      var worst=ist.items.filter(function(x){return x.n}).slice().sort(function(a,b){return a.avgPct-b.avgPct});

        +'<table><thead><tr><th>题号</th><th>板块</th><th>满分</th><th>平均分</th><th>得分率</th><th>难度 P</th><th>区分度 D</th><th>评价</th></tr></thead><tbody>';
      ist.items.forEach(function(it){
        h+='<tr><td class="num">'+it.no+'</td><td>'+esc(it.topic)+'</td><td class="num">'+it.full+'</td>'
          +'<td class="num">'+fmtV(it.avg||0)+'</td><td class="num">'+fmtV(it.avgPct||0)+'%</td>'
          +'<td class="num">'+fmtV(it.P,2)+'</td><td class="num">'+fmtV(it.D,2)+'</td>'
          +'<td>'+(it.n?it.level:'无数据')+'</td></tr>';
      });
      h+='</tbody></table>'
        +'<p style="font-size:10.5px;color:#7A8698;margin:4px 0">'
        +'难度 P = 该题平均得分 ÷ 满分（0.5~0.6 最理想，&lt;0.3 偏难，&gt;0.7 偏易）；'
        +'区分度 D = 高分组得分率 − 低分组得分率（≥0.4 优秀，0.30~0.39 良好，0.20~0.29 建议修改，&lt;0.2 建议复核或淘汰）。'
        +'两者均为教育测量学通行算法，非官方统一规定，各校教研组口径可能略有差异。</p>'
        +'<div class="note"><b>讲评建议顺序：</b>'
        +worst.slice(0,5).map(function(it,i){return (i+1)+'. 第 '+it.no+' 题（'+esc(it.topic)+'，得分率 '+fmtV(it.avgPct)+'%）'}).join('；')
        +'。'+(ist.items.filter(function(x){return x.n&&x.D<0.2}).length?('另有 '+ist.items.filter(function(x){return x.n&&x.D<0.2}).length+' 题区分度低于 0.2，建议复核题干表述或答案设置。'):'')
        +'</div>';
    }

    if(ts){
      h+='<h2>五、'+esc(msub)+' 知识板块掌握度</h2>'
        +'<table><thead><tr><th>知识板块</th><th>满分</th><th>全班得分率</th><th>学生间差异（σ）</th><th>判定</th></tr></thead><tbody>';
      ts.list.forEach(function(t){
        var lv=t.pct>=80?'优势板块':(t.pct>=65?'基本达标':(t.pct>=50?'薄弱，需讲评':'严重薄弱，需专项补差'));
        h+='<tr><td>'+esc(t.topic)+'</td><td class="num">'+t.full+'</td><td class="num">'+fmtV(t.pct)+'%</td>'
          +'<td class="num">'+fmtV(t.sd*100)+'</td><td>'+lv+'</td></tr>';
      });
      h+='</tbody></table>';
      var weak=ts.list.slice(0,3);
      h+='<div class="note"><b>最需优先讲评的板块：</b>'+weak.map(function(t){return esc(t.topic)+'（'+fmtV(t.pct)+'%）'}).join('、')
        +'。建议在下一阶段安排 1~2 课时的专项复习，并配套分层练习。</div>';
    }

    if(crit.rows.length){
      h+='<h2>六、临界生 / 踩线生（内部名单） <span class="rt">基准：'+esc(crit.mode)+'，容差 '+(crit.gap||3)+' 分</span></h2>'
        +'<table><thead><tr><th>学号</th><th>姓名</th><th>名次</th><th>总分</th><th>Z 分</th><th>波动</th><th>说明</th></tr></thead><tbody>';
      crit.rows.slice(0,20).forEach(function(r){
        h+='<tr><td class="num">'+r.no+'</td><td>'+esc(r.name)+'</td><td class="num">'+r.rank+'</td>'
          +'<td class="num">'+fmtV(r.raw)+'</td><td class="num">'+fmtV(r.z)+'</td><td class="num">'+fmtV(r.zsd)+'</td>'
          +'<td>'+esc(r.reasons.join('；'))+'</td></tr>';
      });
      h+='</tbody></table>'
        +'<p style="font-size:10.5px;color:#7A8698;margin:4px 0">此名单为教学诊断材料，<b>仅供教师本人使用，不进入家长端、不在群内发布</b>。</p>';
    }

    if(warns.length){
      h+='<h2>七、重点关注名单（内部）</h2>'
        +'<table><thead><tr><th>学号</th><th>姓名</th><th>风险分</th><th>等级</th><th>原因</th></tr></thead><tbody>';
      warns.slice(0,15).forEach(function(w){
        h+='<tr><td class="num">'+w.no+'</td><td>'+esc(w.name)+'</td><td class="num">'+w.score+'</td>'
          +'<td>'+w.level+'</td><td>'+esc(w.flags.join('；'))+'</td></tr>';
      });
      h+='</tbody></table>';
    }

    h+='<h2>八、结论与下一步措施</h2><div class="note">'
      +'<b>整体判断：</b>本次总分平均得分率 '+fmtV(st.avgPct)+'%，'
      +(st.avgPct>=75?'整体掌握情况较好':(st.avgPct>=60?'整体处于合格水平，仍有提升空间':'整体基础较薄弱，需要系统补差'))
      +'；标准差 '+fmtV(st.sd)+'，'+(st.sd>=18?'班级内部分化明显，需要分层教学':'班级整体比较整齐')
      +'。'+(pst?('较上次'+(st.avgPct>=pst.avgPct?'上升':'下降')+fmtV(Math.abs(st.avgPct-pst.avgPct))+' 个百分点。'):'')
      +'<br><b>建议措施：</b>1) 按第四节给出的顺序进行试卷讲评，重点题控制在 5 题以内；'
      +'2) 针对最弱板块安排专项复习与分层作业；'
      +(crit.rows.length?('3) 对 '+crit.rows.length+' 名临界生做一对一订正跟进，优先解决短板科目；'):'3) 关注中段学生，避免下滑；')
      +(warns.length?('4) 对 '+warns.length+' 名重点关注学生安排谈话或家校沟通。'):'4) 保持常规管理节奏。')
      +'</div>'

      +'<p style="font-size:10px;color:#8A94A6;margin-top:12px;border-top:1px solid #E2E8F2;padding-top:6px">'
      +'本报告由班级教学仪表盘自动生成。统计口径（及格/优秀/低分线、难度与区分度算法）可在工具设置中调整。'

      +'</div>';
    this.open(h);
    Store.log('生成班级分析报告',e.name);
  }
};

/* ================= 应用外壳 ================= */
var UI={
  route:'overview',
  examId:null,examsTab:'summary',anaTab:'topic',misTab:'list',ptTab:'points',setTab:'class',
  misStu:'',misType:'',misOpen:false,misAnaStu:'',misByMonth:false,stuQ:'',
  go:function(r){location.hash='#/'+r}
};
var NAVS=[
  ['overview','🌟','总览'],
  ['exams','📊','考试与成绩'],
  ['analysis','🧩','教学分析'],
  ['mistakes','📕','错题本'],
  ['students','👤','学生档案'],
  ['points','📌','积分与考勤'],
  ['settings','⚙','设置']
];
var App={
  _lockTimer:null,
  route:function(){
    var r=(location.hash||'').replace(/^#\/?/,'');
    for(var i=0;i<NAVS.length;i++){if(NAVS[i][0]===r)return r}
    return 'overview';
  },
  render:function(){
    if(!Store.data)return;
    var r=this.route();UI.route=r;
    var m=Store.data.meta;
    $('#tbTitle').textContent=m.className+(m.grade?(''):'');
    $('#tbSub').textContent=Store.subTitle();
    var nav=$('#nav');
    nav.innerHTML=NAVS.map(function(n){
      return '<div class="nav-item'+(n[0]===r?' active':'')+'" onclick="UI.go(\''+n[0]+'\')"><span class="ico">'+n[1]+'</span>'+n[2]+'</div>';
    }).join('')
    +'<div style="margin-top:14px;padding:10px 13px;border-top:1px solid var(--line)">'
    +'<div class="row" style="gap:6px"><button class="tb-btn" style="background:var(--pri-soft);color:var(--pri);border-color:transparent" onclick="App.lockNow()">🔒 锁定</button></div>'
    +'<p class="small muted" style="margin:8px 0 0;line-height:1.6">数据仅保存在本机<br>不上传任何服务器</p></div>';
    /* 移动端 */
    $('#mtab').innerHTML=['overview','exams','students','points','settings'].map(function(k){
      var n=null;NAVS.forEach(function(x){if(x[0]===k)n=x});
      return n?'<div class="mt'+(r===k?' on':'')+'" onclick="UI.go(\''+k+'\')"><span class="ico">'+n[1]+'</span>'+n[2]+'</div>':'';
    }).join('');
    /* 主体 */
    var main=$('#main');
    if(r==='overview'){main.innerHTML=viewOverview();afterOverview()}
    else if(r==='exams'){ensureExam();main.innerHTML=viewExams();afterExams()}
    else if(r==='analysis'){ensureExam();main.innerHTML=viewAnalysis();afterAnalysis()}
    else if(r==='mistakes'){main.innerHTML=viewMistakes();afterMistakes()}
    else if(r==='students'){main.innerHTML=viewStudents();afterStudents()}
    else if(r==='points'){main.innerHTML=viewPoints();afterPoints()}
    else if(r==='settings'){main.innerHTML=viewSettings();afterSettings()}
    window.scrollTo(0,0);
    this.armAutoLock();
    this.checkBackup();
  },
  lockNow:function(){
    Sec._key=null;
    $('#lock').classList.remove('hidden');
    $('#main').innerHTML='';
    $('#pinBox').innerHTML='';
    LockUI.mount('unlock');
  },
  armAutoLock:function(){
    var self=this;
    if(this._lockTimer)clearTimeout(this._lockTimer);
    var min=Store.data&&Store.data.meta?Store.data.meta.autoLock:10;
    if(!min||min<=0)return;
    this._lockTimer=setTimeout(function(){self.lockNow()},min*60000);
  },
  storageWarn:function(){
    if(this._swShown)return;this._swShown=true;
    var bar=document.getElementById('storeWarn');
    var txt=Sec.backend==='mem'
      ? '<b>当前无法保存数据到本机！</b>浏览器禁用了本地存储（IndexedDB 与 localStorage 都不可用）。你现在做的修改关闭页面就没了，请立刻「导出加密备份」保存到文件。'
      : '';
    if(!txt)return;
    if(!bar){
      bar=document.createElement('div');
      bar.id='storeWarn';
      bar.setAttribute('style','position:fixed;top:0;left:0;right:0;z-index:200;background:#D64550;color:#fff;'
        +'padding:10px 16px;font-size:13px;line-height:1.6;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.25)');
      document.body.appendChild(bar);
    }
    bar.innerHTML='<span style="flex:1">⚠️ '+txt+'</span>'
      +'<button class="tb-btn" style="background:#fff;color:#D64550;border-color:#fff;font-weight:700" '
      +'onclick="UI.setTab=\'security\';UI.go(\'settings\');setTimeout(backupExport,300)">立即导出备份</button>'
      +'<button class="tb-btn" onclick="this.parentNode.remove()">知道了</button>';
  },
  checkBackup:function(){
    if(!Store.data)return;
    var le=Store.data.meta.lastExport||0;
    if(nowTs()-le>7*86400000&&!App._backupNotified){
      App._backupNotified=true;
      setTimeout(function(){
        var m=modal({title:'💡 该备份了',body:
          '<p style="margin:4px 0">已经超过 7 天没有导出备份了。数据存在这台电脑的浏览器里，'
          +'清理浏览器数据、重装系统、换电脑都会丢失。建议现在导出一份加密备份。</p>',
          foot:'<button class="btn ghost" data-close>稍后</button><button class="btn gold" id="bkNow">立即导出</button>'});
        m.querySelector('#bkNow').onclick=function(){closeModal(m);UI.setTab='security';UI.go('settings');setTimeout(backupExport,260)};
      },1600);
    }
  }
};
/* ================= 锁屏 ================= */
var LockUI={
  mode:'unlock',
  mount:function(mode){
    this.mode=mode;
    var isSetup=mode==='setup';
    $('#lockTip').innerHTML=isSetup
      ?'第一次使用，请设置一个密码。<br><span class="small">数据会用这个密码加密后存在本机</span>'
      :'请输入密码解锁';
    $('#lockOk').textContent=isSetup?'创建并开始使用':'解锁';
    var box=$('#pinBox');
    box.innerHTML='<input type="password" maxlength="8" inputmode="numeric" autocomplete="off">'
      +'<input type="password" maxlength="8" inputmode="numeric" autocomplete="off">';
    var ins=$$('#pinBox input');
    ins.forEach(function(inp,i){
      inp.addEventListener('input',function(){
        inp.value=inp.value.replace(/\D/g,'');
        if(inp.value.length>=4&&ins[i+1])ins[i+1].focus();
      });
      inp.addEventListener('keydown',function(ev){
        if(ev.key==='Backspace'&&!inp.value&&ins[i-1])ins[i-1].focus();
        if(ev.key==='Enter')LockUI.submit();
      });
    });
    setTimeout(function(){ins[0].focus()},80);
    $('#lock').classList.remove('hidden');
  },
  err:function(msg){
    $('#lockErr').textContent=msg;
    $$('#pinBox input').forEach(function(i){i.value=''});
    $$('#pinBox input')[0].focus();
  },
  submit:function(){
    var ins=$$('#pinBox input');
    var p1=ins[0].value,p2=ins[1]?ins[1].value:'';
    var self=this;
    if(this.mode==='setup'){
      var chk=pinStrength(p1);
      if(!chk.ok){self.err(chk.msg);return}
      if(p1!==p2){self.err('两次输入不一致');return}
      var salt=randomSalt();
      $('#lockErr').textContent='正在创建加密数据库…';
      Sec.init(p1,salt).then(function(){
        return Sec.digest(p1+Sec.pepper);
      }).then(function(h){
        return Sec.idbSet(Sec.SALT,{salt:salt,hash:h});
      }).then(function(){
        return Sec.encrypt(Store.data);
      }).then(function(enc){
        return Sec.idbSet(Sec.KEY,enc);
      }).then(function(){
        Store.log('初始化','创建加密数据库');
        Store.save();
        Boot.enter(false);
        toast('已就绪。建议先到「设置 → 安全与备份」导出一份加密备份','ok');
      }).catch(function(e){
        self.err('创建失败：'+(e.message||e));
      });
      return;
    }
    Sec.idbGet(Sec.SALT).then(function(rec){
      if(!rec||!rec.salt){self.err('本机没有初始化过，请刷新页面');return Promise.reject('noinit')}
      return Sec.digest(p1+Sec.pepper).then(function(h){
        if(rec.hash&&h!==rec.hash){self.err('密码不正确');return Promise.reject('bad')}
        return Sec.init(p1,rec.salt).then(function(){
          return Store.load();
        }).then(function(res){
          if(res.broken){self.err('数据解密失败，密码可能不对');return Promise.reject('bad')}
          Boot.enter(res.fresh);
        });
      });
    }).catch(function(e){
      if(e!=='bad'&&e!=='noinit'&&e!=='fresh'){self.err('出错了：'+(e.message||e));console.warn(e)}
    });
  }
};
/* ================= 启动 ================= */
var Boot={
  enter:function(fresh){
    $('#lock').classList.add('hidden');
    if(fresh){
      Store.data=blankData();
      ensureExam();
      App.render();
      setTimeout(function(){
        modal({title:'👋 欢迎使用',body:
          '<p class="small" style="margin:0 0 8px">三步就能用起来：</p>'
          +'<ol class="small" style="line-height:2;padding-left:20px;margin:0">'
          +'<li>到「设置 → 班级与科目」填班级名称、选年级（七年级/八年级/九年级，跨年级也能随时切）</li>'
          +'<li>到「学生档案」点「📥 导入学生信息表」，从 Excel 复制粘贴</li>'
          +'<li>到「考试与成绩」新建考试 → 导入成绩表 → 回「总览」看临界生和重点关注</li>'
          +'</ol>'
          +'<p class="hint" style="margin-top:10px">想先看看效果？点下面的按钮载入示例数据（含 42 名学生、3 次考试、题号表、错题、积分、考勤）。</p>',
          foot:'<button class="btn ghost" data-close>我自己来</button><button class="btn gold" id="wlDemo">载入示例数据</button>'});
        var mm=lastMask();
        mm.querySelector('#wlDemo').onclick=function(){
          closeModal(mm);
          Store.data=makeDemo();Store.save();UI.examId=null;ensureExam();App.render();
          toast('示例数据已载入','ok');
        };
      },420);
    } else {
      ensureExam();
      App.render();
    }
  },
  start:function(){
    if(!Sec.available()){
      document.getElementById('lock').classList.add('hidden');
      document.getElementById('main').innerHTML='<div class="card"><h3>⚠️ 浏览器不支持</h3>'
        +'<p>这个工具需要 <b>Web Crypto + IndexedDB</b> 才能把数据加密保存在本机。请换用较新版本的 Chrome / Edge / 火狐 / Safari。</p>'
        +'<p class="muted small">如果你用的是无痕/隐私窗口，请改用普通窗口打开。</p></div>';
      return;
    }
    /* 探测存储后端：优先 IndexedDB，不可用时降级到 localStorage / 内存，
       这样即便浏览器限制了本地数据库（例如 iOS 打开本地文件）也能用起来。 */
    var self=this;
    Sec.probe().then(function(b){
      if(b==='mem')App.storageWarn();
      Sec.get(Sec.SALT).then(function(rec){
        if(rec&&rec.salt)LockUI.mount('unlock');
        else LockUI.mount('setup');
        $('#lockOk').onclick=function(){LockUI.submit()};
      });
    });
    window.addEventListener('hashchange',function(){App.render()});
    ['click','keydown','touchstart'].forEach(function(ev){
      window.addEventListener(ev,function(){
        if(Store.data&&$('#lock').classList.contains('hidden'))App.armAutoLock();
      },{passive:true});
    });
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'){
        var hs=$$('.mask');
        if(hs.length){closeModal(hs[hs.length-1]);return}
        if($('#reportHost').classList.contains('on'))Reports.close();
      }
      if(e.key==='p'&&(e.ctrlKey||e.metaKey)&&$('#reportHost').classList.contains('on')){e.preventDefault();window.print()}
    });
  }
};
Boot.start();
</script>
